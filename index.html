<style>
:root{
  --red:#AA0201; --red-dark:#7d0101; --graphite:#4B4E53; --ink:#17181A;
  --steel:#6b6f76; --steel-soft:#eef0f2; --paper:#f7f6f4; --card:#ffffff;
  --line:#e3e1dd; --amber:#b8860b; --green:#1f7a3d; --sidebar-w:232px;
  --amber-tint:#fdf3dc; --amber-tint-border:#eadfb8; --amber-tint-text:#6b5410;
  --red-tint:#fbe4e3; --red-tint-border:#f0c4c2;
  --green-tint:#e4f3e8;
  /* spacing / sizing scale (4px base) */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --radius-sm:6px; --radius-md:9px; --radius-lg:12px;
  --control-h:38px;
  --shadow-sm:0 1px 2px rgba(23,24,26,.05);
  --shadow-md:0 4px 14px rgba(23,24,26,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
h1,h2,h3,.brand,.tab,.dash-section-title{font-family:'Space Grotesk',system-ui,sans-serif}
.mono,.num,td.num,th.num{font-family:'JetBrains Mono',monospace}
.appshell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--ink);color:#eee;display:flex;flex-direction:column;padding:16px 0}
.sb-brand{display:flex;align-items:center;gap:10px;padding:0 16px 16px;border-bottom:1px solid #26272a;margin-bottom:8px}
.sb-brand img{width:32px;height:32px;object-fit:contain;border-radius:7px;background:#fff;padding:3px}
.sb-brand b{font-size:14.5px;letter-spacing:.01em;color:#fff;font-weight:600}
.sb-brand span{display:block;font-size:10px;color:#8a8d93;letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.sb-group-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#6f7278;padding:16px 16px 6px;font-family:'Inter',system-ui,sans-serif}
.sb-group-toggle{all:unset;box-sizing:border-box;cursor:pointer;width:100%;padding:16px 16px 6px;display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#6f7278;font-family:'Inter',system-ui,sans-serif}
.sb-group-toggle:hover{color:#c9cacc}
.sb-group-chevron{font-size:8px;line-height:1;color:#6f7278;transition:transform .15s ease}
.sb-group-toggle:hover .sb-group-chevron{color:#c9cacc}
.sb-group-toggle[aria-expanded="true"] .sb-group-chevron{transform:rotate(90deg)}
.sb-subgroup{overflow:hidden;max-height:400px;transition:max-height .18s ease}
.sb-subgroup.collapsed{max-height:0}
.sb-nav{display:flex;flex-direction:column;padding:0 8px}
.tab{all:unset;box-sizing:border-box;cursor:pointer;width:100%;padding:8px 10px;margin:1px 0;border-radius:var(--radius-sm);color:#c9cacc;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:9px;justify-content:flex-start;border-left:2.5px solid transparent}
.tab .tab-ico{flex:0 0 auto;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;opacity:.85}
.tab .tab-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.tab:hover{background:#222327;color:#fff}
.tab.active{background:#26181a;color:#fff;border-left-color:var(--red)}
.tab.active .tab-ico{opacity:1;color:var(--red)}
.tab .count{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9a9da3;background:#2a2b2e;border-radius:8px;padding:1px 7px}
.tab.active .count{color:#fff;background:#3a2224}
.sb-group-divider{margin-top:auto}
.doc-subnav{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:0}
.subtab{all:unset;cursor:pointer;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--steel);border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
.subtab:hover{color:var(--ink)}
.subtab.active{color:var(--red);border-bottom-color:var(--red)}
.subtab .count{font-family:'JetBrains Mono',monospace;font-size:11px;color:#8a8d93;background:#f3f1ee;border-radius:8px;padding:1px 7px}
.subtab.active .count{color:var(--red)}
.doc-subpanel.hidden{display:none}
.cost-card{margin-bottom:16px}
.cost-recipe-editor{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.cost-recipe-head{margin-bottom:4px;font-size:13px}
.cost-missing td{color:var(--red)}
.cost-bundle td{background:#fbf9f5}
.bundle-tag{font-size:9px;background:var(--steel-soft);color:var(--steel);padding:2px 6px;border-radius:8px;margin-left:6px;text-transform:uppercase;font-weight:700;letter-spacing:.03em;vertical-align:middle}
.cost-included td{color:var(--steel);font-style:italic}
.cost-included .cost-included-name{padding-left:24px}
.cost-summary{display:flex;gap:24px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px}
.cost-summary b{font-family:'JetBrains Mono',monospace}
.cost-warning{color:var(--red);font-weight:600}
.money-field{position:relative;display:block;width:100%}
.money-field .money-prefix{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--steel);font-size:12.5px;font-family:'JetBrains Mono',monospace;pointer-events:none}
.money-field input.money-input{padding-left:17px;width:100%;box-sizing:border-box}
.cost-summary .money-field{display:inline-block;width:90px;vertical-align:middle;margin-left:6px}
.cost-cell{display:flex;align-items:center;gap:4px}
.cost-cell .money-field{flex:1;min-width:0}
.pack-toggle-btn{all:unset;cursor:pointer;font-size:13px;padding:3px 5px;border-radius:5px;line-height:1;border:1px solid var(--line)}
.pack-toggle-btn:hover{background:var(--steel-soft)}
.pack-badge{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;width:100%;box-sizing:border-box}
.pack-badge:hover{background:var(--steel-soft);border-color:var(--steel)}
.pack-badge .pack-unit-price{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:12.5px;color:var(--ink)}
.pack-badge .pack-tag{font-size:10px;color:var(--steel)}
.tier-badge{gap:3px}
.tier-options{display:flex;flex-wrap:wrap;gap:3px}
.tier-opt{font-size:9.5px;color:var(--steel);background:var(--steel-soft);border-radius:6px;padding:1px 5px;white-space:nowrap}
.tier-opt.is-active{color:#fff;background:var(--red);font-weight:700}
.qty-edit-wrap{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
.qty-edit-wrap input.row-qty-edit{width:52px !important;font-size:16px;font-weight:700;text-align:center;padding:5px 2px;border:1.5px solid var(--line);border-radius:6px;background:var(--steel-soft)}
.qty-edit-wrap input.row-qty-edit:hover{border-color:var(--graphite)}
.qty-edit-wrap input.row-qty-edit:focus{border-color:var(--red);background:#fff;outline:none;box-shadow:0 0 0 2px rgba(170,2,1,.14)}
.pack-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.pack-modal-grid label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--steel);font-weight:600}
.pack-modal-grid input{font-weight:400;color:var(--ink)}
.pack-result{font-size:14px;font-weight:600;margin:8px 0 4px;color:var(--ink)}
.sb-foot{padding:12px 18px;font-size:10.5px;color:#6f7176;border-top:1px solid #2a2b2e;margin-top:8px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{padding:16px 28px;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:space-between;gap:16px}
.topbar h1{font-size:22px;margin:0;letter-spacing:-.01em;font-weight:600}
.topbar .sub{color:var(--steel);font-size:12.5px;margin-top:3px}
.topbar-actions{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.content{padding:24px 28px;overflow:auto}
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-size:22px;font-family:'JetBrains Mono',monospace}
.kpi span{font-size:11.5px;color:var(--steel);text-transform:uppercase;letter-spacing:.06em}
.kpi.warn b{color:var(--red)}
.kpi.amber b{color:var(--amber)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);margin-bottom:18px;overflow:hidden;box-shadow:var(--shadow-sm)}
.links-layout{display:flex;gap:18px;align-items:flex-start}
.links-picker{flex:0 0 260px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;align-self:flex-start}
.links-picker-search{padding:10px;border-bottom:1px solid var(--line)}
.links-picker-search input{width:100%;box-sizing:border-box}
.links-picker-list{max-height:560px;overflow-y:auto;padding:6px 0}
.links-picker-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--steel);padding:10px 14px 4px}
.links-picker-item{all:unset;display:block;width:100%;box-sizing:border-box;cursor:pointer;padding:7px 14px;font-size:13px;color:var(--ink);border-left:3px solid transparent}
.links-picker-item:hover{background:var(--steel-soft)}
.links-picker-item.active{background:var(--amber-tint);border-left-color:var(--amber);color:var(--amber-tint-text);font-weight:600}
.links-picker-empty{padding:12px 14px;color:var(--steel);font-size:12.5px;margin:0}
.links-detail-wrap{flex:1;min-width:0}
@media (max-width:900px){.links-layout{flex-direction:column}.links-picker{flex:0 0 auto;width:100%}.links-picker-list{max-height:280px}}
.bom-layout{display:flex;gap:18px;align-items:flex-start}
.bom-picker{flex:0 0 260px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;align-self:flex-start}
.bom-picker-search{padding:10px;border-bottom:1px solid var(--line)}
.bom-picker-search input{width:100%;box-sizing:border-box}
.bom-picker-list{max-height:560px;overflow-y:auto;padding:6px 0}
.bom-picker-item{all:unset;display:block;width:100%;box-sizing:border-box;cursor:pointer;padding:9px 14px;border-left:3px solid transparent}
.bom-picker-item:hover{background:var(--steel-soft)}
.bom-picker-item.active{background:var(--amber-tint);border-left-color:var(--amber)}
.bom-picker-name{font-size:13px;font-weight:600;color:var(--ink)}
.bom-picker-item.active .bom-picker-name{color:var(--amber-tint-text)}
.bom-picker-meta{font-size:11.5px;color:var(--steel);margin-top:1px}
.bom-picker-item.active .bom-picker-meta{color:var(--amber-tint-text)}
.bom-picker-badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;background:var(--steel-soft);color:var(--graphite);border-radius:10px;padding:1px 7px;margin-top:4px}
.bom-picker-item.active .bom-picker-badge{background:rgba(255,255,255,.55);color:var(--amber-tint-text)}
.bom-picker-empty{padding:12px 14px;color:var(--steel);font-size:12.5px;margin:0}
.bom-detail-wrap{flex:1;min-width:0}
@media (max-width:900px){.bom-layout{flex-direction:column}.bom-picker{flex:0 0 auto;width:100%}.bom-picker-list{max-height:280px}}
.card-head{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:space-between}
.card-head h3{margin:0;font-size:14.5px;font-weight:600}
.card-body{padding:14px 16px}
.cost-card-title{display:flex;align-items:center;gap:8px;cursor:pointer}
.cost-collapse-toggle{background:none;border:none;cursor:pointer;font-size:11px;color:var(--steel);padding:2px 4px;line-height:1;transition:transform .12s ease}
.cost-collapse-toggle:hover{color:var(--graphite)}
.cost-collapse-toggle.is-collapsed{transform:rotate(-90deg)}
.cost-details.hidden{display:none}
.cost-summary.collapsed-summary{margin-top:0;padding-top:0;border-top:none}
.dash-section-title{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--graphite);border-left:3px solid var(--red);padding-left:8px;margin:22px 0 10px}
tr.item-group-row td{background:var(--steel-soft);color:var(--graphite);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:7px 10px;border-bottom:1.5px solid var(--ink)}
tr.item-group-row:first-child td{border-top:none}
/* ---- Items tab decluttering: fields read as plain text until you touch the row, action
   buttons collapse to icons — same data, a lot less "form full of boxes" visual noise. ---- */
#panel-items .icon-btn{padding:5px 7px;font-size:13px;line-height:1;min-width:0}
#panel-items table input,#panel-items table select{border-color:transparent;background:transparent;box-shadow:none;padding:6px 4px}
#panel-items table tr:hover input,#panel-items table tr:hover select,#panel-items table input:focus,#panel-items table select:focus{border-color:var(--line);background:#fff}
#panel-items table input:focus,#panel-items table select:focus{border-color:var(--red)}
#panel-items tbody td{padding:4px 8px}
.lastordered-cell{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lastordered-cell input.f-lastdate{font-size:11.5px;min-width:104px;box-sizing:border-box}

.items-split{display:grid;grid-template-columns:minmax(340px,5fr) minmax(0,6fr);gap:16px;align-items:start}
.items-split .card{margin-bottom:0}
.items-split .list-table td,.items-split .list-table th{padding-top:7px;padding-bottom:7px}
.items-split tr.list-row{cursor:pointer}
.items-split .list-table td.num{white-space:nowrap;overflow:visible}
.items-split tr.list-row.is-selected td{background:#fbeaea}
.items-split tr.list-row.is-selected td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.item-panel{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;margin-top:0}
.item-panel-empty{border:1px dashed var(--line);border-radius:var(--radius-lg);padding:48px 24px;text-align:center;color:var(--steel);background:var(--card)}
.item-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.item-stat label{display:block;font-size:11px;color:var(--steel);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.item-stat input{width:100%;box-sizing:border-box;font-size:18px;font-weight:600;padding:6px 8px}
.item-stat .stat-text{font-size:15px;font-weight:600;padding-top:8px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-stat .money-wrap{position:relative}
.item-stat .money-wrap span{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--steel);font-size:15px}
.item-stat .money-wrap input{padding-left:22px}
.item-notes-wrap{padding:14px 18px;border-bottom:1px solid var(--line)}
.item-notes-wrap textarea{width:100%;box-sizing:border-box;resize:vertical;min-height:58px}
.item-panel details.item-sec{border-bottom:1px solid var(--line)}
.item-panel details.item-sec:last-child{border-bottom:0}
.item-panel details.item-sec>summary{list-style:none;cursor:pointer;padding:12px 18px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--graphite);display:flex;align-items:center;gap:8px}
.item-panel details.item-sec>summary::-webkit-details-marker{display:none}
.item-panel details.item-sec>summary::before{content:'\25B8';color:var(--steel);transition:transform .12s}
.item-panel details.item-sec[open]>summary::before{transform:rotate(90deg)}
.item-panel details.item-sec>summary:hover{background:var(--steel-soft)}
.item-panel details.item-sec .sec-count{font-weight:500;color:var(--steel);text-transform:none;letter-spacing:0}
.item-panel details.item-sec .sec-body{padding:0 18px 16px}
.item-panel .detail-grid input,.item-panel .detail-grid select{width:100%;box-sizing:border-box}
.item-panel .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
@media (max-width:1000px){.items-split{grid-template-columns:1fr}.item-panel{position:static;max-height:none;order:-1}}
/* ===== Items: category boxes + item cards ===== */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.cat-tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:136px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);transition:border-color .12s,box-shadow .12s,transform .12s}
.cat-tile:hover{border-color:var(--graphite);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.cat-tile:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.ct-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ct-name{font-family:'Space Grotesk',system-ui,sans-serif;font-size:16px;font-weight:600;color:var(--ink)}
.ct-count{font-size:20px;font-weight:600;color:var(--graphite)}
.ct-preview{font-size:12px;color:var(--steel);line-height:1.45;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ct-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ct-value{margin-left:auto;font-size:11px;color:var(--steel)}
.cat-tile-new{align-items:center;justify-content:center;border-style:dashed;box-shadow:none;color:var(--steel);font-weight:600;gap:4px;background:transparent}
.cat-tile-new .ct-plus{font-size:26px;line-height:1;color:var(--steel)}
.items-crumb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.items-crumb h2{margin:0;font-size:19px;font-weight:600}
.item-group-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--graphite);margin:4px 0 8px}
.item-group-label .mono{font-weight:400;color:var(--steel);margin-left:4px}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:18px}
.item-tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);border-left:3px solid var(--line);transition:border-color .12s,box-shadow .12s}
.item-tile:hover{border-color:var(--graphite);box-shadow:var(--shadow-md)}
.item-tile:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.item-tile.is-late{border-left-color:var(--red)}
.item-tile.is-soon{border-left-color:var(--amber)}
.item-tile.is-selected{border-color:var(--red);box-shadow:0 0 0 2px rgba(170,2,1,.15);background:#fffafa}
.it-pic{display:flex;align-items:center;justify-content:center;height:120px;margin:-12px -14px 2px;background:#fff;border-bottom:1px solid var(--line);border-radius:var(--radius-md) var(--radius-md) 0 0;overflow:hidden}
.it-pic img{max-width:100%;max-height:100%;object-fit:contain;padding:8px;box-sizing:border-box}
.it-pic.is-empty{background:#f6f5f3;color:#b9b5ae;font-size:30px}
.item-photo{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line)}
.item-photo .ip-box{flex:0 0 auto;width:150px;height:150px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden}
.item-photo .ip-box img{max-width:100%;max-height:100%;object-fit:contain;padding:6px;box-sizing:border-box}
.item-photo .ip-box.is-empty{background:#f6f5f3;color:#b9b5ae;font-size:40px}
.item-photo .ip-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.it-name{font-weight:600;font-size:13.5px;line-height:1.3;color:var(--ink)}
.it-stock{font-size:11.5px;color:var(--steel)}
.it-stock b{font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--ink);font-weight:600}
.it-meta{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--steel)}
.it-meta .it-price{color:var(--ink);font-weight:500}
.it-meta .it-price.is-empty{font-family:'Inter',system-ui,sans-serif;color:var(--steel);font-weight:400}
.it-meta .it-sup{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.items-split{grid-template-columns:minmax(0,1fr) minmax(360px,460px)}
.items-split .item-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.items-split .cat-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
/* ===== Documents ===== */
.doc-drop{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--card);border:2px dashed #d6d3ce;border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:16px;transition:.15s}
.doc-drop.drag-over{border-color:var(--red);background:var(--red-tint)}
.doc-drop .dd-ico{font-size:26px;width:46px;height:46px;border-radius:50%;background:var(--red-tint);color:var(--red);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.doc-drop .dd-text{flex:1;min-width:220px}
.doc-drop .dd-title{font-family:'Space Grotesk',system-ui,sans-serif;font-size:16px;font-weight:600;margin-bottom:2px}
.doc-drop .btn{position:relative}
.doc-drop-modal{flex-direction:column;text-align:center;padding:34px 20px}
.doc-drop-modal .dd-ico{margin:0 auto}
.blank-dd summary{min-height:var(--control-h)}
.blank-dd .filter-options{display:flex;flex-direction:column;align-items:stretch;right:0;left:auto}
.intake-blank{margin-top:14px;text-align:center;font-size:12.5px;color:var(--steel);display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.setup-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--amber-tint);border:1px solid var(--amber-tint-border);color:var(--amber-tint-text);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.setup-done{color:var(--green);font-weight:600;font-size:12.5px}
.doc-toolbar{gap:10px}
.doc-pills{display:flex;gap:6px;flex-wrap:wrap}
.doc-pill{all:unset;cursor:pointer;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600;color:var(--graphite);display:inline-flex;gap:6px;align-items:center}
.doc-pill .mono{font-size:11px;color:var(--steel);font-weight:400}
.doc-pill:hover{border-color:var(--graphite)}
.doc-pill.active{background:var(--ink);border-color:var(--ink);color:#fff}
.doc-pill.active .mono{color:#c9cacc}
.doc-type-tag{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:6px;background:var(--steel-soft);color:var(--graphite)}
.doc-type-tag.t-receipts{background:var(--green-tint);color:var(--green)}
.doc-type-tag.t-quotes{background:var(--amber-tint);color:var(--amber-tint-text)}
.doc-type-tag.t-po{background:var(--red-tint);color:var(--red-dark)}
.doc-list td{padding-top:10px;padding-bottom:10px}
table.doc-lines td{vertical-align:middle}
.line-doc-text{font-size:11px;color:var(--steel);font-style:italic;margin:3px 2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-totals td{border-bottom:none;padding-top:6px;padding-bottom:6px}
.q-totals td.tot-label{font-family:'Inter',system-ui,sans-serif;font-size:12.5px;color:var(--steel);font-weight:600}
.q-totals tr.tot-grand td.tot-label{color:var(--ink);font-size:14px}
.q-totals tr.tot-grand td{border-top:1.5px solid var(--ink);font-size:15px;font-weight:700;color:var(--ink)}
button.doc-chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;background:var(--steel-soft);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:11.5px;margin:0 4px 4px 0;color:var(--ink)}
button.doc-chip:hover{border-color:var(--graphite)}
/* Intake review */
.modal-box.modal-wide{max-width:1180px;width:96%;max-height:92vh}
.intake-reading{display:flex;gap:16px;align-items:center;padding:20px 6px}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--steel-soft);border-top-color:var(--red);animation:ds-spin .8s linear infinite;flex:0 0 auto}
@keyframes ds-spin{to{transform:rotate(360deg)}}
.intake-review{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px;align-items:start}
.ir-preview{position:sticky;top:0;border:1px solid var(--line);border-radius:var(--radius-md);background:#f3f1ee;height:72vh;overflow:auto;display:flex;align-items:flex-start;justify-content:center}
.ir-preview img{max-width:100%;display:block}
.ir-preview iframe{width:100%;height:100%;border:0;background:#fff}
.ir-preview pre{white-space:pre-wrap;font-size:11.5px;padding:12px;margin:0;width:100%}
.ir-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 14px;margin:12px 0 14px}
.ir-grid label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--steel)}
.ir-grid input,.ir-grid select{text-transform:none;letter-spacing:0;font-weight:400;width:100%}
.ir-lines td{vertical-align:top;padding:6px 6px}
.ir-lines tr.is-skip td{opacity:.55}
.ir-lines tr.is-new td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
.ir-newitem{display:grid;grid-template-columns:3fr 2fr;gap:6px;margin-top:6px}
.ir-totals{margin:12px 0 0 auto;max-width:360px;display:flex;flex-direction:column;gap:6px}
.ir-totals>div{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--steel)}
.ir-totals .ir-grand{border-top:1.5px solid var(--ink);padding-top:8px;font-size:16px;color:var(--ink);font-weight:700}
.ir-match{font-size:12px;font-weight:600;margin-left:auto}
.ir-match.ok{color:var(--green)}
.ir-match.bad{color:var(--red)}
.ir-options{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:13px}
.ir-options label{display:flex;gap:8px;align-items:center;cursor:pointer}
.ir-options input{min-height:0}
.ir-drive{margin-top:10px;padding:8px 10px;background:var(--steel-soft);border-radius:8px;word-break:break-all}
.callout.green-callout{background:var(--green-tint);border-color:#bfe0c9;color:#185c2f}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.settings-row:last-child{border-bottom:0}
@media (max-width:900px){.intake-review{grid-template-columns:1fr}.ir-preview{position:static;height:300px}}
.exp-section{margin-bottom:16px}
.exp-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--graphite);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.exp-label .note{text-transform:none;letter-spacing:0;font-weight:400}
.exp-quick{margin-left:auto;display:flex;gap:2px}
.exp-quick .btn{text-transform:none;letter-spacing:0;font-weight:500}
.exp-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px 14px}
.exp-cols label,.exp-radios label{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
.exp-cols input,.exp-radios input{min-height:0}
.exp-radios{display:flex;flex-wrap:wrap;gap:8px 20px}
/* ---- Suppliers: contact cards ---- */
.sup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;align-items:start}
.sup-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:14px 14px 0;display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s}
.sup-card:hover{box-shadow:var(--shadow-md)}
.sup-card-head{display:flex;align-items:flex-start;gap:10px}
.sup-avatar{flex:0 0 40px;height:40px;border-radius:10px;background:var(--red-tint);color:var(--red);font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;letter-spacing:.02em}
.sup-title{flex:1;min-width:0}
.sup-name{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.sup-specs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.sup-spec{font-size:10.5px;font-weight:600;background:var(--steel-soft);color:var(--graphite);border-radius:10px;padding:1px 8px}
.sup-edit{min-height:26px;padding:3px 8px}
.sup-contact{display:flex;flex-direction:column;gap:3px}
.sup-line{display:flex;gap:8px;align-items:baseline;font-size:12.5px;line-height:1.4;min-width:0}
.sup-ico{flex:0 0 16px;text-align:center;font-size:11.5px;color:var(--steel)}
.sup-val{min-width:0;overflow-wrap:anywhere}
.sup-val a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--steel)}
.sup-val a:hover{color:var(--red);border-bottom-color:var(--red)}
.sup-empty{color:#a6a9ae;font-style:italic}
.sup-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--graphite)}
.sup-meta b{font-weight:600;color:var(--steel);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.sup-stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--radius-sm);background:#fbfaf8}
.sup-stats>div{padding:6px 4px;text-align:center;border-left:1px solid var(--line);min-width:0}
.sup-stats>div:first-child{border-left:none}
.sup-stats b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sup-stats span{display:block;font-size:9.5px;color:var(--steel);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
.sup-items{display:flex;flex-wrap:wrap;gap:4px}
.sup-item{font-size:11px;background:#f3f1ee;border:1px solid var(--line);border-radius:12px;padding:1px 8px;color:var(--graphite)}
.sup-item .mono{color:var(--steel);font-size:10.5px}
.sup-item.more{background:transparent;cursor:help}
.sup-notes{font-size:12px;color:var(--graphite);background:var(--amber-tint);border:1px solid var(--amber-tint-border);border-radius:var(--radius-sm);padding:6px 9px;white-space:pre-wrap}
.sup-card .sup-docs-details{margin:0 -14px;border-top:1px solid var(--line)}
.sup-card .sup-docs-details summary{padding:8px 14px}
.sup-doc-list{padding:0 8px 8px}
.sup-doc-line{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:62px 1fr 52px 74px 70px;gap:6px;align-items:center;padding:5px 6px;border-radius:5px;font-size:11.5px}
.sup-doc-line:hover{background:var(--steel-soft)}
.sup-doc-line .doc-type-tag{font-size:10px}
.sup-doc-num{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sup-doc-date{color:var(--steel);font-size:10.5px}
.sup-doc-total{text-align:right;font-size:11px}
.sup-doc-status{font-size:10.5px;color:var(--steel);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sup-doc-line.is-cancelled .sup-doc-num,.sup-doc-line.is-cancelled .sup-doc-total{text-decoration:line-through;color:var(--steel)}
.sup-form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.sup-form-field label{display:block;font-size:11px;font-weight:600;color:var(--graphite);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.sup-form-field.wide{grid-column:1/-1}
@media (max-width:640px){.sup-form{grid-template-columns:1fr}}
/* ---- BOM: compact recipe view ---- */
.rcp-head{gap:12px;align-items:flex-start}
.rcp-head .note b{font-weight:600}
.rcp-body{padding:8px 16px 14px}
.rcp-list{display:flex;flex-direction:column}
.rcp-row{display:flex;align-items:baseline;gap:6px;font-size:12.5px;line-height:1.35;padding:4px 0;border-bottom:1px solid #f1efec}
.rcp-row:last-child{border-bottom:none}
.rcp-row.is-asm .rcp-name{font-weight:600}
.rcp-row.is-incl{color:var(--steel);font-size:12px}
.rcp-name{min-width:0;overflow-wrap:anywhere}
.rcp-qty{flex:0 0 auto;font-size:11px;font-weight:600;color:var(--red);background:var(--red-tint);border-radius:9px;padding:0 6px;line-height:1.55}
.rcp-row.is-incl .rcp-qty{color:var(--steel);background:var(--steel-soft)}
.rcp-dots{flex:1;min-width:12px;border-bottom:1px dotted #d6d3ce;transform:translateY(-3px)}
.rcp-unit{flex:0 0 auto;font-size:11px;color:var(--steel);white-space:nowrap}
.rcp-unit.rcp-missing{color:var(--red);font-weight:600}
.rcp-ext{flex:0 0 74px;text-align:right;font-size:12px}
.rcp-toggle{all:unset;cursor:pointer;flex:0 0 14px;text-align:center;font-size:10px;color:var(--steel);transition:transform .12s}
.rcp-toggle.is-collapsed{transform:rotate(-90deg)}
.rcp-toggle-sp{flex:0 0 14px}
.rcp-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:10px;border-top:2px solid var(--ink);font-weight:600;font-size:13px}
.rcp-total b{font-size:15px}
.rcp-warn{font-size:12px;color:var(--red);margin:10px 0 0}
/* ---- Planned orders: as-of counts ---- */
.asof{all:unset;cursor:pointer;display:block;margin-left:auto;font-family:'Inter',system-ui,sans-serif;font-size:10px;color:var(--steel);white-space:nowrap;line-height:1.3}
.asof:hover{text-decoration:underline}
.asof.stale{color:var(--amber)}
.plan-toggle{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
.plan-toggle input{min-height:0}
.plan-stale-note{font-size:12px;color:var(--amber-tint-text);background:var(--amber-tint);border:1px solid var(--amber-tint-border);border-radius:14px;padding:3px 10px}
.item-asof{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:10.5px;color:var(--steel)}
.item-asof input{font-size:11px;padding:2px 4px;min-height:0;height:24px;width:auto}
/* ---- Documents: cancelled ---- */
.status-badge.cancelled{background:#ececec;color:#6b6f76;text-decoration:line-through}
.doc-list tr.is-cancelled td{color:var(--steel)}
.doc-list tr.is-cancelled td:nth-child(2),.doc-list tr.is-cancelled td:nth-child(6){text-decoration:line-through}
.doc-pill.pill-cancelled.active{background:var(--graphite);border-color:var(--graphite)}
.cancel-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f1f0ee;border:1px solid var(--line);border-left:4px solid var(--steel);border-radius:var(--radius-sm);padding:10px 14px;margin:0 0 14px;font-size:13px}
.detail-drawer.is-cancelled .detail-drawer-head h2{color:var(--steel)}
.cancel-warn{font-size:12.5px;background:var(--amber-tint);border:1px solid var(--amber-tint-border);color:var(--amber-tint-text);border-radius:var(--radius-sm);padding:8px 10px}
.cancel-reason-cell{display:block;font-size:10.5px;color:var(--steel);margin-top:2px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---- Shipments ---- */
.ship-table-wrap{overflow-x:auto}
table.ship-table{table-layout:auto;min-width:100%}
.ship-table th{cursor:pointer;user-select:none}
.ship-table th .sort-ind{font-size:9px;color:var(--steel);margin-left:3px}
.ship-table td.wrap{white-space:normal;min-width:160px;max-width:260px}
.ship-dir{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:6px}
.ship-dir.in{background:var(--green-tint);color:var(--green)}
.ship-dir.out{background:var(--red-tint);color:var(--red-dark)}
.status-badge.ship-transit{background:#e6effa;color:#24589c}
.status-badge.ship-late{background:var(--red-tint);color:var(--red-dark)}
.ship-date-range{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--steel);flex-wrap:wrap}
.ship-date-range input,.ship-date-range select{min-height:32px;padding:5px 8px;font-size:12.5px}
.filter-dropdown.is-on summary{border-color:var(--ink);background:var(--ink);color:#fff}
.filter-dropdown.dd-right .filter-options{left:auto;right:0}
.ship-dir-toggle{display:flex;gap:6px;flex-wrap:wrap}
.ship-dir-toggle label{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;font-size:13px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);margin:0}
.ship-dir-toggle label.on{border-color:var(--ink);background:var(--steel-soft)}
.ship-dir-toggle small{display:block;color:var(--steel);font-size:11.5px}
.ship-sub{font-size:11px;color:var(--steel);display:block}
.ship-clip{font-size:11px;color:var(--steel);margin-left:6px;white-space:nowrap}
.ship-docs-box{display:flex;flex-direction:column;gap:8px}
.ship-doc-wrap{display:inline-flex;align-items:center;margin:0 4px 4px 0}
.ship-doc-wrap .doc-chip{margin:0}
.ship-doc-x{all:unset;cursor:pointer;font-size:13px;line-height:1;color:var(--steel);padding:0 5px}
.ship-doc-x:hover{color:var(--red)}
.ship-po-docs{font-size:12px;color:var(--steel)}
.status-badge.ship-cond-bad{background:var(--red-tint);color:var(--red-dark)}
.client-avatar{background:var(--ink)!important;color:#fff!important}
.client-card-actions{display:flex}
/* Uniform card size: every supplier/client card shows the same fixed rows; extras live behind the expand arrow */
.sup-card .sup-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal}
.sup-card .sup-title .sup-specs{flex-wrap:nowrap;overflow:hidden;height:18px;margin-top:4px}
.sup-card .sup-spec{white-space:nowrap}
.sup-card .sup-contact .sup-val{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal}
.sup-card-head .sup-head-btns{display:flex;gap:4px;flex:0 0 auto}
.sup-more{display:flex;flex-direction:column;gap:10px;padding:2px 14px 10px}
.sup-more .sup-line .sup-val{white-space:normal;overflow-wrap:anywhere}
.sup-more-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);margin-bottom:4px}
.sup-more .sup-doc-list{padding:0;margin:0 -6px}
/* Dashboard: shipments out */
.dash-ship-table td{vertical-align:middle}
.dash-ship-table tr.dash-ship-row{cursor:pointer}
.dash-ship-table tr.dash-ship-row:hover td{background:var(--steel-soft)}
.dash-ship-table .doc-type-tag{font-size:10px;padding:2px 6px}
.dash-ship-late{color:var(--red-dark);font-weight:600}
.dash-ship-table a.dash-ship-track{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--steel)}
.sup-card .sup-stats span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-ship-contents{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Shipment form: pick-from-list helper */
.ship-pick-row{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}
.ship-pick-row input[list]{flex:1 1 220px;min-width:0}
.ship-pick-row input[type=number]{width:70px}
.sup-doc-line.view-client-ship{grid-template-columns:38px 1fr 46px 62px 66px}
.view-client-ship .doc-type-tag{justify-self:start;padding:2px 6px}
.doc-type-tag.t-ship-out{background:var(--red-tint);color:var(--red-dark)}
.doc-type-tag.t-ship-in{background:var(--green-tint);color:var(--green)}
.ship-total-line{font-size:12.5px;color:var(--steel);padding:9px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
</style>
</head>

// One-time, idempotent, additive migration: brings existing saved DBs up to date with the
// LH/RH Wheelbase Assembly split and the MFG / Hadlock bench products, WITHOUT touching or
// deleting anything already saved (on-hand counts, notes, POs, old Standard/Heavy-Duty Bench, etc.).
function migrateMfgHadlock(db){
  if(!db || !Array.isArray(db.items)) return db;
  const byId=id=>db.items.find(i=>i.id===id);

  // Rename the old generic "Wheel Set" item to "LH Wheelbase Assembly" if it hasn't been already
  // (runs every time, independent of whether the RH sibling below already exists) — leaves any
  // custom rename the user made alone.
  {
    const lh0=byId('i-wheelset');
    if(lh0 && lh0.name==='Wheel Set') lh0.name='LH Wheelbase Assembly';
  }

  // Make sure the RH Wheelbase Assembly exists alongside the LH one, with matching price breaks,
  // and fix any product recipe still using the old single-Wheel-Set line (qtyPer 4/6) into 1 LH + 1 RH.
  const mkTiers=()=>[{id:uid(),minQty:50,price:235},{id:uid(),minQty:100,price:225},{id:uid(),minQty:150,price:210},{id:uid(),minQty:250,price:185}];
  if(!byId('i-wheelset-rh')){
    const lh=byId('i-wheelset');
    if(lh){
      if(!Array.isArray(lh.priceBreaks) || !lh.priceBreaks.length) lh.priceBreaks=mkTiers();
      db.items.push(mkItem('i-wheelset-rh','RH Wheelbase Assembly','set',{
        onHand:lh.onHand||0, leadTimeDays:lh.leadTimeDays||0, safetyStock:lh.safetyStock||0,
        lines:(lh.lines||[]).map(l=>Object.assign({},l)),
        priceBreaks:mkTiers(),
        links:(lh.links||[]).map(l=>Object.assign({},l,{id:uid()})),
        notes:'Vendor sells LH and RH Wheelbase Assemblies as separate SKUs, ordered together in one bundled order. Added automatically to match your LH Wheelbase Assembly — double-check on-hand/safety stock for the RH side.'
      }));
      db.items.forEach(it=>{
        if(!Array.isArray(it.lines) || !it.lines.length) return;
        const wsLine=it.lines.find(l=>l.childId==='i-wheelset');
        const hasRh=it.lines.some(l=>l.childId==='i-wheelset-rh');
        if(wsLine && !hasRh){ wsLine.qtyPer=1; it.lines.push({childId:'i-wheelset-rh',qtyPer:1}); }
      });
    }
  } else {
    // RH already existed (created by an earlier version of this app, before price-break tiers were
    // added here) — backfill the same 50/100/150/250 tiers from the pricing letter onto it if it's
    // still sitting with no price breaks of its own. Only fills a gap; never overwrites tiers the
    // user already entered for RH.
    const rh=byId('i-wheelset-rh');
    const lh=byId('i-wheelset');
    if(rh && (!Array.isArray(rh.priceBreaks) || !rh.priceBreaks.length)){
      rh.priceBreaks = (lh && Array.isArray(lh.priceBreaks) && lh.priceBreaks.length)
        ? lh.priceBreaks.map(t=>Object.assign({},t,{id:uid()}))
        : mkTiers();
    }
    // Same gap-fill for supplier links: LH and RH are bought together as one bundled order, so they
    // should carry the same per-unit cost. Earlier versions of this migration created the RH item
    // without copying LH's link at all (RH ends up with no supplier chip), and even where a matching
    // supplier link was later added to RH by hand, it can sit with no $ cost typed in yet (RH's chip
    // then shows the supplier name with no price, unlike LH's). Fill in whichever piece is missing —
    // never touch a cost you've already entered on RH's own link.
    if(rh && lh && Array.isArray(lh.links) && lh.links.length){
      if(!Array.isArray(rh.links) || !rh.links.length){
        rh.links = lh.links.map(l=>Object.assign({},l,{id:uid()}));
      } else {
        rh.links.forEach(rl=>{
          if(Number(rl.cost)) return;
          const match=lh.links.find(ll=>ll.supplierId===rl.supplierId && Number(ll.cost));
          if(match) rl.cost=match.cost;
        });
      }
    }
  }

  // Add the new MFG / Hadlock vendor-specific component items if they aren't already there.
  const newParts=[
    ['i-manifold-mfg','MFG Manifold',{standardCost:603.36,notes:'From MFG ROM Quote (Rev G, 2/10/2026). 2 required per MFG bench — this is the part the Hot Hats attach into; distinct from the Hot Hats item itself.',links:[{id:uid(),supplierId:'s-mfg',cost:603.36,url:'',phone:'',contactType:'link',notes:'MFG ROM Quote Rev G.'}]}],

    ['i-manifold-hadlock','Hadlock Manifold',{standardCost:661.88,notes:'From Premix Hadlock pricing letter (8/29/2025). 2 required per Hadlock bench — the part the Hot Hats attach into; distinct from the Hot Hats item.',links:[{id:uid(),supplierId:'s-zherco',cost:661.88,url:'',phone:'',contactType:'link',notes:'Premix Hadlock pricing letter, 8/29/2025.'}]}],

  newParts.forEach(([id,name,opts])=>{ if(!byId(id)) db.items.push(mkItem(id,name,'ea',Object.assign({onHand:0,leadTimeDays:0,safetyStock:0},opts))); });

  if(!byId('i-hadlock-assembly-holes')) db.items.push(mkItem('i-hadlock-assembly-holes','Hadlock Complete Bench Assembly — With Holes','ea',{onHand:0,leadTimeDays:0,safetyStock:0,
    lines:[{childId:'i-benchshell-hadlock',qtyPer:1},{childId:'i-manifold-hadlock',qtyPer:2},{childId:'i-footdeck-hadlock',qtyPer:1}],
    standardCost:4837.45,
    notes:'From Premix Hadlock pricing letter (8/29/2025): "Complete Bench with 2 manifolds, 1 foot deck, with holes." Priced as a bundle — the Bench Shell / Manifold / Foot Deck are shown for reference but don\'t need their own pricing.'}));

    standardCost:4554.87,
    notes:'From Premix Hadlock pricing letter (8/29/2025): "Complete Bench with 2 manifolds, 1 foot deck, no holes." Priced as a bundle, same reasoning as the with-holes version.'}));

  // Add the 4 new top-level bench products if missing. Old Standard Bench / Heavy-Duty Bench (if

    {childId:'i-cap12',qtyPer:3},{childId:'i-cap6',qtyPer:3},{childId:'i-helmetbox',qtyPer:1}
  ]}));
  if(!byId('b-mfg-noholes')) db.items.push(mkItem('b-mfg-noholes','MFG Bench — No Holes','ea',{isProduct:true,lines:[
    {childId:'i-diffuser',qtyPer:2},{childId:'i-wheelset',qtyPer:1},{childId:'i-wheelset-rh',qtyPer:1},
    {childId:'i-benchframe-mfg-noholes',qtyPer:1},{childId:'i-manifold-mfg',qtyPer:2},{childId:'i-footrest-mfg',qtyPer:1},
    {childId:'i-hothat',qtyPer:1},{childId:'i-handles',qtyPer:2},{childId:'i-flange12',qtyPer:3},{childId:'i-flange6',qtyPer:3},

function ensureShape(){
  if(!Array.isArray(DB.items)) DB.items=[];
  if(!Array.isArray(DB.suppliers)) DB.suppliers=[];
  if(!Array.isArray(DB.demandPlan)) DB.demandPlan=[];
  if(!Array.isArray(DB.purchaseOrders)) DB.purchaseOrders=[];
  if(!Array.isArray(DB.quotes)) DB.quotes=[];
  if(!Array.isArray(DB.receipts)) DB.receipts=[];
  if(!Array.isArray(DB.deliveries)) DB.deliveries=[];
  if(!Array.isArray(DB.bookings)) DB.bookings=[];
  if(!Array.isArray(DB.shipments)) DB.shipments=[];
  if(!Array.isArray(DB.clients)) DB.clients=[];
  DB.shipments.forEach(normalizeShipment);
  purgeRetiredEquipment();
  if(!DB.lists || typeof DB.lists!=='object') DB.lists={};
  delete DB.lists.conferences; // retired with the Equipment/Availability Calendar feature
  var DEFAULT_PO_STATUS=['Requested','Sent to Finance','PO Issued','Ordered','Received'];
  if(!Array.isArray(DB.lists.poStatus) || !DB.lists.poStatus.length) DB.lists.poStatus=DEFAULT_PO_STATUS.slice();
  // One-time migration to the 5-stage request workflow (Requested -> Sent to Finance -> PO
  // Issued -> Ordered -> Received). Runs once per saved DB: remaps any PO still sitting on an
  // old stage name to its closest new equivalent, then swaps the status list itself. Guarded by
  // a flag so it never re-runs and clobbers a status list the user has since customized on the
  // Settings tab.
  if(!DB._poStatusMigratedV2){
    var OLD_TO_NEW_PO_STATUS={'Awaiting Approval':'Sent to Finance','Open':'Ordered','Partially Received':'Ordered','Closed':'Received'};
    var hadOldStages=DB.lists.poStatus.some(function(s){return OLD_TO_NEW_PO_STATUS[s];});
    if(hadOldStages){
      DB.purchaseOrders.forEach(function(po){ if(OLD_TO_NEW_PO_STATUS[po.status]) po.status=OLD_TO_NEW_PO_STATUS[po.status]; });
      DB.lists.poStatus=DEFAULT_PO_STATUS.slice();
    }
    DB._poStatusMigratedV2=true;
  }
  if(!Array.isArray(DB.lists.quoteStatus) || !DB.lists.quoteStatus.length) DB.lists.quoteStatus=['Open','Expired','Converted to PO'];
  if(!Array.isArray(DB.lists.itemGroups)) DB.lists.itemGroups=['Wheel Assembly','Bench Hardware','MFG Parts','Hadlock Parts'];
  if(!DB.horizonDays) DB.horizonDays=90;
  DB.items.forEach(i=>{
    if(i.leadTimeDays===undefined || i.leadTimeDays===null) i.leadTimeDays='';
    else if(typeof i.leadTimeDays==='number') i.leadTimeDays=String(i.leadTimeDays);
    if(typeof i.safetyStock!=='number') i.safetyStock=0;
    if(typeof i.onHand!=='number') i.onHand=0;
    if(typeof i.minOrderQty!=='number') i.minOrderQty=1;
    if(!Array.isArray(i.lines)) i.lines=[];
    if(!Array.isArray(i.links)) i.links=[];
    if(!Array.isArray(i.docs)) i.docs=[];
    if(!i.uom) i.uom='ea';
    if(typeof i.isProduct!=='boolean') i.isProduct=false;
    if(typeof i.notes!=='string') i.notes='';
    if(!i.category) i.category=i.isProduct?'product':'part';
    if(typeof i.itemGroup!=='string') i.itemGroup='';
    if(i.lastPurchaseDate===undefined) i.lastPurchaseDate=null;
    if(i.lastPurchaseQty===undefined) i.lastPurchaseQty=null;
    if(i.reorderCadenceDays===undefined) i.reorderCadenceDays=null;
    if(i.onHandAsOf===undefined) i.onHandAsOf=null;
    i.locations=null;
  });
  DB.purchaseOrders.forEach(po=>{
    if(!Array.isArray(po.lines)) po.lines=[];
    if(!Array.isArray(po.docs)) po.docs=[];
    if(!po.status) po.status=DB.lists.poStatus[0];
    if(!po.poNumber) po.poNumber='';
    if(typeof po.requestedBy!=='string') po.requestedBy='';
    if(typeof po.approvedBy!=='string') po.approvedBy='';
    if(po.orderTotal===undefined) po.orderTotal=null;
    po.lines.forEach(l=>{
      if(typeof l.received!=='boolean') l.received=false;
      if(l.receivedAt===undefined) l.receivedAt=null;
    });
  });
  DB.quotes.forEach(q=>{
    if(!Array.isArray(q.lines)) q.lines=[];
    if(!Array.isArray(q.docs)) q.docs=[];
    if(!q.status) q.status=DB.lists.quoteStatus[0];
    if(!q.quoteNumber) q.quoteNumber='';
    if(!q.notes) q.notes='';
    if(q.orderTotal===undefined) q.orderTotal=null;
  });
  DB.receipts.forEach(r=>{
    if(!Array.isArray(r.lines)) r.lines=[];
    if(!Array.isArray(r.docs)) r.docs=[];
    if(!r.receiptNumber) r.receiptNumber='';
    if(r.poId===undefined) r.poId='';
    if(!r.notes) r.notes='';
    if(typeof r.orderLink!=='string') r.orderLink='';
    if(typeof r.appliedToStock!=='boolean') r.appliedToStock=false;
    if(r.appliedAt===undefined) r.appliedAt=null;
    if(typeof r.requestedBy!=='string') r.requestedBy='';
    if(r.orderTotal===undefined) r.orderTotal=null;
    r.lines.forEach(l=>{
      if(typeof l.received!=='boolean') l.received=false;
      if(l.receivedAt===undefined) l.receivedAt=null;
    });
  });
  DB.deliveries.forEach(d=>{
    if(!Array.isArray(d.lines)) d.lines=[];
    if(!Array.isArray(d.docs)) d.docs=[];
    if(typeof d.label!=='string') d.label='';
    if(!d.deliveryDate) d.deliveryDate=todayISO();
    if(typeof d.notes!=='string') d.notes='';
    if(typeof d.appliedToStock!=='boolean') d.appliedToStock=false;
    if(d.appliedAt===undefined) d.appliedAt=null;
  });
  [DB.purchaseOrders, DB.quotes, DB.receipts].forEach(list=>list.forEach(d=>{
    if(typeof d.cancelled!=='boolean') d.cancelled=false;
    if(d.extraCharges===undefined || d.extraCharges===null){
      const sub=docLinesSubtotal(d);
      d.extraCharges=(d.orderTotal!=null && Number(d.orderTotal)>0) ? round2(Number(d.orderTotal)-sub) : 0;
    }
    d.orderTotal=null;
  }));

/* Makes dropEl accept drag-and-drop of one or more files, feeding them into fileInput's normal
   'change' handler (so every existing upload path — items, equipment, PO/quote/receipt, Add
   Document — gets drag-and-drop for free without duplicating its logic). */
function enableFileDrop(dropEl, fileInput){
  if(!dropEl || !fileInput) return;
  const stop=e=>{ e.preventDefault(); e.stopPropagation(); };
  ['dragenter','dragover'].forEach(evt=>dropEl.addEventListener(evt, e=>{ stop(e); dropEl.classList.add('drag-over'); }));
  ['dragleave','dragend'].forEach(evt=>dropEl.addEventListener(evt, e=>{ stop(e); dropEl.classList.remove('drag-over'); }));
  dropEl.addEventListener('drop', e=>{
    stop(e);
    dropEl.classList.remove('drag-over');
    const dt=e.dataTransfer;
    if(dt && dt.files && dt.files.length){
      fileInput.files=dt.files;
      fileInput.dispatchEvent(new Event('change', {bubbles:true}));
    }
  });
}
function isImageDoc(d){

/* Quotes/Receipts are kept as historical records for now and do NOT feed price history yet
   (by user's request — they want them purely as reference/archive for this pass).
   Flip this to true once you're ready to have Quotes/Receipts contribute to price history. */
const INCLUDE_QUOTES_RECEIPTS_IN_PRICE_HISTORY = false;
function priceHistoryFor(itemId){
  const rows=[];
  DB.purchaseOrders.forEach(po=>{
    if(po.cancelled) return;
    (po.lines||[]).forEach(l=>{
      if(l.itemId===itemId && Number(l.unitPrice)>0){
        rows.push({date:po.orderDate, supplier:(supplierById(po.supplierId)||{}).name||'—', qty:l.qty, unitPrice:l.unitPrice, poNumber:po.poNumber, source:'PO', reliability:2});
      }
    });
  });
  if(INCLUDE_QUOTES_RECEIPTS_IN_PRICE_HISTORY){
    DB.quotes.forEach(q=>{
      if(q.cancelled) return;
      (q.lines||[]).forEach(l=>{
        if(l.itemId===itemId && Number(l.unitPrice)>0){
          rows.push({date:q.quoteDate, supplier:(supplierById(q.supplierId)||{}).name||'—', qty:l.qty, unitPrice:l.unitPrice, poNumber:q.quoteNumber, source:'Quote', reliability:1});
        }
      });
    });
    DB.receipts.forEach(r=>{
      if(r.cancelled) return;
      (r.lines||[]).forEach(l=>{
        if(l.itemId===itemId && Number(l.unitPrice)>0){
          rows.push({date:r.receiptDate, supplier:(supplierById(r.supplierId)||{}).name||'—', qty:l.qty, unitPrice:l.unitPrice, poNumber:r.receiptNumber, source:'Receipt', reliability:3});
        }
      });
    });
  }
  rows.sort((a,b)=> (b.reliability-a.reliability) || (b.date||'').localeCompare(a.date||''));
  return rows;
}
/* Broader than priceHistoryFor(): every PO and Receipt line for this item, regardless of
   whether a price was ever logged on it -- this answers "did we order it and when", not
   "what did it cost", so it deliberately does NOT feed resolvePartCost()/BOM costing (that
   still calls priceHistoryFor(), which stays priced-only on purpose -- a priceless line
   becoming the "most recent price" would silently zero out a cost rollup). Quotes are left
   out too -- a quote isn't an order that happened, just an estimate. */
function orderHistoryFor(itemId){
  const rows=[];
  DB.purchaseOrders.forEach(po=>{
    if(po.cancelled) return;
    (po.lines||[]).forEach(l=>{
      if(l.itemId===itemId){
        rows.push({date:po.orderDate, supplier:(supplierById(po.supplierId)||{}).name||'—', qty:l.qty, unitPrice:l.unitPrice, poNumber:po.poNumber, source:'PO', reliability:2});
      }
    });
  });
  DB.receipts.forEach(r=>{
    if(r.cancelled) return;
    (r.lines||[]).forEach(l=>{
      if(l.itemId===itemId){
        rows.push({date:r.receiptDate, supplier:(supplierById(r.supplierId)||{}).name||'—', qty:l.qty, unitPrice:l.unitPrice, poNumber:r.receiptNumber, source:'Receipt', reliability:3});
      }
    });
  });
  rows.sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.reliability-a.reliability));
  return rows;
}
function renderHistoryTable(rows){
  return '<table><thead><tr><th>Date</th><th>Supplier</th><th class="num">Qty</th><th class="num">Unit Price</th><th>Source</th><th>PO #</th></tr></thead><tbody>'+
    rows.map(r=>'<tr><td class="mono">'+fmtDate(r.date)+'</td><td>'+r.supplier+'</td><td class="num mono">'+r.qty+'</td><td class="num mono">'+(Number(r.unitPrice)>0?'$'+Number(r.unitPrice).toFixed(2):'—')+'</td><td class="mono">'+(r.source||'PO')+'</td><td class="mono">'+(r.poNumber||'')+'</td></tr>').join('')

/* ---------------- MRP engine (multi-level, low-level-code based) ---------------- */
let MRP_RESULT=null;

// Lead time is a free-text field (e.g. "2 weeks", "10 business days", "call supplier").
// For planning math we pull the first number out of it, converting weeks/months to days.
function parseLeadDays(v){
  if(v===undefined || v===null || v==='') return 0;
  if(typeof v==='number') return v;
  const s=String(v).toLowerCase();
  const m=s.match(/-?\d+(\.\d+)?/);
  if(!m) return 0;
  let n=parseFloat(m[0]);
  if(/week/.test(s)) n*=7;
  else if(/month/.test(s)) n*=30;
  return n;
}

function computeLLC(){
  const llc={};
  DB.items.forEach(i=>llc[i.id]=0);
  let changed=true, guard=0;
  while(changed && guard<50){
    changed=false; guard++;
    DB.items.forEach(i=>{
      (i.lines||[]).forEach(line=>{
        const childLevel=(llc[i.id]||0)+1;
        if((llc[line.childId]||0) < childLevel){ llc[line.childId]=childLevel; changed=true; }
      });
    });
  }
  return llc;
}

function receiptsForItem(itemId){
  const closed=closedStatusName();
  const receipts=[];
  DB.purchaseOrders.forEach(po=>{
    if(po.status===closed || po.cancelled) return;
    (po.lines||[]).forEach(l=>{ if(l.itemId===itemId) receipts.push({qty:Number(l.qty)||0, date:po.expectedDate||po.orderDate||todayISO()}); });
  });
  return receipts;
}

function runMRP(){
  const llc=computeLLC();
  const levels=Array.from(new Set(Object.values(llc))).sort((a,b)=>a-b);
  const demandByItem={};
  DB.demandPlan.forEach(d=>{
    const prod=itemById(d.productId);
    if(!prod || !d.needDate || !d.qty) return;
    if(!demandByItem[prod.id]) demandByItem[prod.id]=[];
    demandByItem[prod.id].push({qty:Number(d.qty), dueDate:d.needDate, source:(d.label?d.label+' — ':'')+prod.name+' x'+d.qty});
  });

  const today=todayISO();
  const resultsByItem={};

  levels.forEach(level=>{
    DB.items.filter(i=>llc[i.id]===level).forEach(item=>{
      const need=(demandByItem[item.id]||[]).slice().sort((a,b)=>a.dueDate<b.dueDate?-1:1);
      const receipts=receiptsForItem(item.id).sort((a,b)=>a.date<b.date?-1:1);
      let projected=Number(item.onHand)||0;
      const plannedOrders=[];
      const events=[];
      receipts.forEach(r=>events.push({type:'receipt', date:r.date, qty:r.qty}));
      need.forEach(n=>events.push({type:'demand', date:n.dueDate, qty:n.qty, source:n.source}));
      events.sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:(a.type==='receipt'?-1:1)));
      let minProjected=projected;
      events.forEach(ev=>{
        if(ev.type==='receipt'){ projected+=ev.qty; }
        else{
          projected-=ev.qty;
          if(projected<item.safetyStock){
            const shortfall=item.safetyStock-projected;
            const releaseDate=addDays(ev.date, -parseLeadDays(item.leadTimeDays));
            plannedOrders.push({qty:Math.ceil(shortfall), dueDate:ev.date, releaseDate, source:ev.source});
            projected+=shortfall;
          }
        }
        if(projected<minProjected) minProjected=projected;
      });
      const totalGross=need.reduce((s,n)=>s+n.qty,0);
      const suggestedQty=plannedOrders.reduce((s,o)=>s+o.qty,0);
      let earliestRelease=null;
      plannedOrders.forEach(o=>{ if(!earliestRelease||o.releaseDate<earliestRelease) earliestRelease=o.releaseDate; });
      let status='none';
      if(plannedOrders.length){ status = earliestRelease<today?'late':(earliestRelease<=addDays(today,14)?'soon':'ok'); }
      else if(need.length){ status='covered'; }
      const needSources=need.map(n=>n.source);
      resultsByItem[item.id]={item, totalGross, suggestedQty, earliestRelease, plannedOrders, status, demandCount:need.length, needSources, level};

      if(item.lines && item.lines.length){
        plannedOrders.forEach(order=>{
          item.lines.forEach(line=>{
            const childQty=order.qty*Number(line.qtyPer||0);
            if(childQty<=0) return;
            if(!demandByItem[line.childId]) demandByItem[line.childId]=[];
            demandByItem[line.childId].push({qty:childQty, dueDate:order.releaseDate, source:item.name+' (build '+order.qty+')'+(order.source?' ← '+order.source:'')});
          });
        });
      }
    });
  });

  const results=Object.values(resultsByItem);

  // Group each part with the top-level planned order that's actually driving its demand,
  // so e.g. "Foam Cushion" and "Leg Assembly" sit right next to the "Standard Chair" order
  // that needs them, instead of being sorted independently by their own urgency/date.
  const rank={late:0,soon:1,ok:2,covered:3,none:4};
  function rootSourceOf(r){
    const src = r.plannedOrders.length ? r.plannedOrders[0].source : (r.needSources[0]||'');
    if(!src) return r.item.name;
    const parts=src.split(' ← ');
    return parts[parts.length-1].trim() || r.item.name;
  }
  const groupMeta={};
  results.forEach(r=>{
    r._rootKey=rootSourceOf(r);
    const g=groupMeta[r._rootKey] || (groupMeta[r._rootKey]={rank:99, earliest:null});
    const sr=rank[r.status];
    if(sr<g.rank) g.rank=sr;
    if(r.earliestRelease && (!g.earliest || r.earliestRelease<g.earliest)) g.earliest=r.earliestRelease;
  });
  results.sort((a,b)=>{
    if(a._rootKey!==b._rootKey){
      const ga=groupMeta[a._rootKey], gb=groupMeta[b._rootKey];
      if(ga.rank!==gb.rank) return ga.rank-gb.rank;
      if(ga.earliest && gb.earliest) return ga.earliest<gb.earliest?-1:(ga.earliest>gb.earliest?1:a._rootKey.localeCompare(b._rootKey));
      if(ga.earliest) return -1;
      if(gb.earliest) return 1;
      return a._rootKey.localeCompare(b._rootKey);
    }
    // same order group: parent product before the components it needs (lower BOM level first)
    if(a.level!==b.level) return a.level-b.level;
    if(rank[a.status]!==rank[b.status]) return rank[a.status]-rank[b.status];
    if(a.earliestRelease && b.earliestRelease) return a.earliestRelease<b.earliestRelease?-1:1;
    return 0;
  });
  MRP_RESULT=results;
  return results;
}

function fmtShortDate(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function statCard(value,label,cls){
  return '<div class="stat-card '+(cls||'')+'"><span class="stat-num">'+value+'</span><span class="stat-label">'+escAttr(label)+'</span></div>';
}
/* Simple 8-week bar chart of planned orders by earliest release week, colored by urgency.
   Plain HTML/CSS bars — no external charting library. */
function plannedOrdersWeekChart(res){
  const today=todayISO();
  const buckets=[];
  for(let w=0;w<8;w++) buckets.push({start:addDays(today,w*7), count:0, status:'ok'});
  const rank={late:2,soon:1,ok:0};
  res.filter(r=>r.plannedOrders.length && r.earliestRelease).forEach(r=>{
    const days=Math.round((new Date(r.earliestRelease+'T00:00:00')-new Date(today+'T00:00:00'))/86400000);
    const idx=Math.floor(days/7);
    if(idx<0 || idx>=buckets.length) return;
    buckets[idx].count++;
    if(rank[r.status]>rank[buckets[idx].status]) buckets[idx].status=r.status;
  });
  const max=Math.max(1, ...buckets.map(b=>b.count));
  const colorFor={late:'var(--red)',soon:'var(--amber)',ok:'var(--graphite)'};
  const cols=buckets.map((b,i)=>{
    const h=b.count?Math.max(8,Math.round(b.count/max*100)):3;
    const label=i===0?'This wk':fmtShortDate(b.start);
    return '<div class="weekbar-col">'+
      '<span class="weekbar-count">'+(b.count||'')+'</span>'+
      '<div class="weekbar" style="height:'+h+'%;background:'+(b.count?colorFor[b.status]:'var(--steel-soft)')+'"></div>'+
      '<span class="weekbar-label">'+label+'</span>'+
    '</div>';
  }).join('');
  return '<div class="chart-card"><h3>Planned orders — next 8 weeks</h3><div class="weekbars">'+cols+'</div></div>';
}
/* Compact "Action Required" row — used only on the Dashboard. Purely presentational: every
   value it shows is read from the same filters already computed for the KPI row / MRP result,

function actionRow(sev, text, btnLabel, btnCls){
  return '<div class="action-row '+(sev?'sev-'+sev:'')+'"><span class="dot"></span><span class="action-text">'+text+'</span>'+
    (btnLabel? '<button class="btn sm action-go '+(btnCls||'')+'">'+btnLabel+'</button>' : '')+'</div>';

function itemPicture(it){
  if(!it) return '';
  if(typeof it.imageUrl==='string') return it.imageUrl;
  return ITEM_PICTURES[it.id]||'';
}
const PIC_PLACEHOLDER='&#9634;';
function itemPicHtml(it, cls){
  const src=itemPicture(it);
  if(!src) return '<span class="'+cls+' is-empty" aria-hidden="true">'+PIC_PLACEHOLDER+'</span>';
  return '<span class="'+cls+'"><img src="'+escAttr(src)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add(\'is-empty\');this.parentNode.innerHTML=\''+PIC_PLACEHOLDER+'\'"></span>';
}
async function imageFileToDataURL(file, maxEdge){
  const bmp=await createImageBitmap(file);
  const scale=Math.min(1, maxEdge/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas'); c.width=Math.round(bmp.width*scale); c.height=Math.round(bmp.height*scale);
  const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.85);
}
function openItemPictureModal(it){
  openModal('Picture — '+it.name,
    '<p class="note" style="margin-top:0">Paste a link to an image (right-click a product photo → <i>Copy image address</i>), or upload a photo.</p>'+
    '<label class="note" style="display:block;margin-bottom:4px">Image link</label>'+
    '<input type="text" id="pic-url" placeholder="https://..." value="'+escAttr(/^data:/.test(itemPicture(it))?'':itemPicture(it))+'" style="width:100%">'+
    '<div style="margin:12px 0"><label class="btn sm" style="position:relative">Upload a photo…<input type="file" id="pic-file" accept="image/*" style="position:absolute;opacity:0;width:1px;height:1px"></label> <span class="note" id="pic-msg"></span></div>'+
    '<div class="toolbar" style="justify-content:flex-end;margin:16px 0 0"><button class="btn" id="pic-cancel">Cancel</button><button class="btn accent" id="pic-save">Save picture</button></div>');
  let uploaded=null;
  document.getElementById('pic-cancel').addEventListener('click', closeModal);
  document.getElementById('pic-file').addEventListener('change', async e=>{
    const f=e.target.files[0]; if(!f) return;
    const msg=document.getElementById('pic-msg');
    try{ uploaded=await imageFileToDataURL(f, 400); msg.textContent=f.name+' ready — click Save picture.'; }
    catch(err){ msg.textContent='That photo could not be opened. Try a JPG or PNG.'; }
  });
  document.getElementById('pic-save').addEventListener('click',()=>{
    const url=document.getElementById('pic-url').value.trim();
    it.imageUrl = uploaded || url;
    save(); closeModal(); renderItems();
  });
}
/* One item as a small card ("box") — name, stock, price, supplier, reorder badge. */
function itemTileHtml(it){
  const s=cadenceStatus(it);
  const supplier=primarySupplierForItem(it);
  const price=Number(effectiveStandardCost(it))||0;
  const badge = s.cls==='none' ? '' : '<span class="badge '+s.cls+'" title="'+escAttr(s.title||'')+'">'+s.text+'</span>';
  return '<button type="button" class="item-tile'+(selectedItem===it.id?' is-selected':'')+(s.cls==='late'?' is-late':(s.cls==='soon'?' is-soon':''))+'" data-id="'+it.id+'">'+
    itemPicHtml(it,'it-pic')+
    '<span class="it-name">'+escAttr(it.name)+'</span>'+
    '<span class="it-stock"><b class="it-onhand">'+fmtQty(Number(it.onHand)||0)+'</b> '+escAttr(it.uom||'ea')+' on hand</span>'+
    '<span class="it-meta"><span class="it-price mono'+(price?'':' is-empty')+'">'+(price?'$'+price.toFixed(2):'No price')+'</span><span class="it-sup">'+(supplier?escAttr(supplier.name):'No supplier')+'</span></span>'+
    (badge?'<span class="it-badge">'+badge+'</span>':'')+
  '</button>';
}
/* One category as a box on the Items home screen. */
function catTileHtml(key, items){
  const late=items.filter(it=>cadenceStatus(it).cls==='late').length;
  const soon=items.filter(it=>cadenceStatus(it).cls==='soon').length;
  const value=items.reduce((s,it)=>s+(Number(it.onHand)||0)*(Number(effectiveStandardCost(it))||0),0);
  const flags = !items.length ? '<span class="note">Empty</span>'
    : (late||soon) ? ((late?'<span class="badge late">'+late+' past due</span>':'')+(soon?'<span class="badge soon">'+soon+' due soon</span>':''))
    : '<span class="badge ok">All good</span>';
  const preview=items.slice(0,4).map(it=>escAttr(it.name)).join(' · ')+(items.length>4?' …':'');
  return '<button type="button" class="cat-tile" data-key="'+escAttr(key)+'">'+
    '<span class="ct-head"><span class="ct-name">'+escAttr(itemCatLabel(key))+'</span><span class="ct-count mono">'+items.length+'</span></span>'+
    '<span class="ct-preview">'+(preview||'No items yet')+'</span>'+
    '<span class="ct-foot">'+flags+(value>0?'<span class="ct-value mono">$'+Math.round(value).toLocaleString('en-US')+' on hand</span>':'')+'</span>'+
  '</button>';
}
function renderItems(){
  const el=document.getElementById('panel-items');
  const allParts=DB.items.filter(it=>!it.isProduct && it.category!=='equipment');
  const knownGroups=DB.lists.itemGroups||[];
  const q=(itemsToolbar.q||'').trim().toLowerCase();
  const supFilter=itemsToolbar.supplier||[];
  const filtering=!!(q || itemsToolbar.status || supFilter.length);
  const parts=allParts.filter(it=>{
    if(q && !((it.name||'').toLowerCase().includes(q) || (it.notes||'').toLowerCase().includes(q))) return false;
    if(itemsToolbar.status && cadenceStatus(it).cls!==itemsToolbar.status) return false;
    if(supFilter.length && !itemsSupplierIdsOf(it).some(id=>supFilter.includes(id))) return false;
    return true;
  });
  if(selectedItem && !itemById(selectedItem)) selectedItem=null;
  if(itemsToolbar.cat && itemsToolbar.cat!=='__uncategorized__' && !knownGroups.includes(itemsToolbar.cat)) itemsToolbar.cat='';
  // Arriving with an item already picked (e.g. from the Dashboard) opens its category.
  if(selectedItem && !itemsToolbar.cat && !filtering){ const sel=itemById(selectedItem); if(sel && !sel.isProduct) itemsToolbar.cat=itemCatKey(sel); }
  document.getElementById('page-actions').innerHTML=
    '<button class="btn" id="add-item-group">+ New category</button>'+
    '<button class="btn" id="export-pdf-items">Export</button>'+
    '<button class="btn accent" id="add-item">+ New item</button>';
  const groupKeys=knownGroups.concat(['__uncategorized__']);
  let mainHtml='', countLabel='';
  if(filtering){
    // Search / filter results: every match across all categories, still grouped so it reads cleanly.
    const keys=groupKeys.filter(k=>parts.some(it=>itemCatKey(it)===k));
    countLabel=parts.length+' match'+(parts.length===1?'':'es');
    mainHtml = keys.length ? keys.map(k=>{
      const rows=parts.filter(it=>itemCatKey(it)===k);
      return '<div class="item-group-label">'+escAttr(itemCatLabel(k))+' <span class="mono">'+rows.length+'</span></div><div class="item-grid">'+rows.map(itemTileHtml).join('')+'</div>';
    }).join('') : '<div class="empty-state card"><div class="empty-title">No items match</div><div class="empty-sub">Try a different search or clear the filters.</div></div>';
  } else if(itemsToolbar.cat){
    const rows=allParts.filter(it=>itemCatKey(it)===itemsToolbar.cat);
    countLabel=rows.length+' item'+(rows.length===1?'':'s');
    mainHtml='<div class="items-crumb"><button class="btn sm" id="items-back">&larr; All categories</button><h2>'+escAttr(itemCatLabel(itemsToolbar.cat))+'</h2><span class="toolbar-count">'+countLabel+'</span><div class="toolbar-spacer"></div><button class="btn sm accent" id="add-item-here">+ Add item here</button></div>'+
      (rows.length ? '<div class="item-grid">'+rows.map(itemTileHtml).join('')+'</div>'
        : '<div class="empty-state card"><div class="empty-title">Nothing in this category yet</div><div class="empty-sub">Use “+ Add item here”, or pick this category on an existing item.</div></div>');
  } else {
    const keys=groupKeys.filter(k=>k!=='__uncategorized__' || allParts.some(it=>itemCatKey(it)===k));
    countLabel=allParts.length+' items in '+keys.length+' categor'+(keys.length===1?'y':'ies');
    mainHtml='<div class="cat-grid">'+keys.map(k=>catTileHtml(k, allParts.filter(it=>itemCatKey(it)===k))).join('')+
      '<button type="button" class="cat-tile cat-tile-new" id="cat-tile-new"><span class="ct-plus">+</span><span>New category</span></button></div>';
  }
  el.innerHTML=
    '<div class="toolbar no-print">'+
      '<div class="search-input"><input type="text" id="items-search" placeholder="Search all items..." value="'+escAttr(itemsToolbar.q||'')+'"></div>'+
      filterDropdownHtml('items-sup-filter', supFilter)+
      '<select id="items-status-filter">'+ITEMS_STATUS_FILTER_OPTS.map(([v,l])=>'<option value="'+v+'" '+(itemsToolbar.status===v?'selected':'')+'>'+l+'</option>').join('')+'</select>'+
      (filtering?'<button class="btn sm subtle" id="items-clear">Clear</button>':'')+
      '<div class="toolbar-spacer"></div>'+
      '<span class="toolbar-count">'+countLabel+'</span>'+
    '</div>'+
    (selectedItem
      ? '<div class="items-split"><div class="items-main">'+mainHtml+'</div><div id="item-detail">'+renderItemCard(itemById(selectedItem))+'</div></div>'
      : '<div class="items-main">'+mainHtml+'</div><div id="item-detail"></div>');

  el.querySelectorAll('.cat-tile[data-key]').forEach(t=>t.addEventListener('click',()=>{ itemsToolbar.cat=t.dataset.key; selectedItem=null; renderItems(); window.scrollTo(0,0); }));
  const newCatTile=document.getElementById('cat-tile-new'); if(newCatTile) newCatTile.addEventListener('click', openAddItemGroupModal);
  const backBtn=document.getElementById('items-back'); if(backBtn) backBtn.addEventListener('click',()=>{ itemsToolbar.cat=''; selectedItem=null; renderItems(); });
  const addHere=document.getElementById('add-item-here'); if(addHere) addHere.addEventListener('click', openAddItemModal);
  const clearBtn=document.getElementById('items-clear'); if(clearBtn) clearBtn.addEventListener('click',()=>{ itemsToolbar.q=''; itemsToolbar.status=''; itemsToolbar.supplier=[]; renderItems(); });
  el.querySelectorAll('.item-tile').forEach(t=>t.addEventListener('click',()=>{
    selectedItem = selectedItem===t.dataset.id ? null : t.dataset.id;
    renderItems();
    if(selectedItem && window.innerWidth<=1000){ const d=document.getElementById('item-detail'); if(d) d.scrollIntoView({behavior:'smooth', block:'start'}); }
  }));
  document.getElementById('add-item').addEventListener('click', openAddItemModal);
  document.getElementById('add-item-group').addEventListener('click', openAddItemGroupModal);
  document.getElementById('export-pdf-items').addEventListener('click',()=>{
    openItemsExportModal({
      catKey: (!filtering && itemsToolbar.cat) ? itemsToolbar.cat : '',
      filtered: filtering ? parts.slice() : null
    });
  });
  const itemsSearchEl=document.getElementById('items-search'); if(itemsSearchEl) itemsSearchEl.addEventListener('input',e=>{ const pos=e.target.selectionStart; itemsToolbar.q=e.target.value; renderItems(); refocusSearch('items-search',pos); });
  const itemsStatusFilterEl=document.getElementById('items-status-filter'); if(itemsStatusFilterEl) itemsStatusFilterEl.addEventListener('change',e=>{ itemsToolbar.status=e.target.value; renderItems(); });
  const supDD=document.getElementById('items-sup-filter');
  if(supDD){
    const reapplySup=()=>{ renderItems(); const nd=document.getElementById('items-sup-filter'); if(nd) nd.open=true; };
    const allCb=supDD.querySelector('.filter-all-cb');
    const optCbs=supDD.querySelectorAll('.filter-opt-cb');
    if(allCb) allCb.addEventListener('change',e=>{ if(e.target.checked){ itemsToolbar.supplier=[]; reapplySup(); } else if(optCbs.length===0){ e.target.checked=true; } });
    optCbs.forEach(cb=>cb.addEventListener('change',()=>{
      itemsToolbar.supplier=[...supDD.querySelectorAll('.filter-opt-cb:checked')].map(c=>c.value);
      reapplySup();
    }));
  }
  wireItemCard();
}

function loadItemExportPrefs(){ try{ return JSON.parse(localStorage.getItem(ITEM_EXPORT_PREF))||null; }catch(e){ return null; } }
function saveItemExportPrefs(p){ try{ localStorage.setItem(ITEM_EXPORT_PREF, JSON.stringify(p)); }catch(e){} }
function openItemsExportModal(ctx){
  const prefs=loadItemExportPrefs()||{};
  const chosen=new Set(prefs.cols || ITEM_EXPORT_COLS.filter(c=>c.def).map(c=>c.key));
  const allParts=DB.items.filter(it=>!it.isProduct);
  const scopes=[['all','All items ('+allParts.length+')']];
  if(ctx.catKey){ const n=allParts.filter(it=>itemCatKey(it)===ctx.catKey).length; scopes.unshift(['cat','Just '+itemCatLabel(ctx.catKey)+' ('+n+')']); }
  if(ctx.filtered){ scopes.unshift(['filtered','Current search results ('+ctx.filtered.length+')']); }
  const scopeDefault=scopes[0][0];
  openModal('Export items',
    '<div class="exp-section"><div class="exp-label">Which items</div><div class="exp-radios">'+
      scopes.map(([v,l])=>'<label><input type="radio" name="exp-scope" value="'+v+'" '+(v===scopeDefault?'checked':'')+'> '+escAttr(l)+'</label>').join('')+
    '</div></div>'+
    '<div class="exp-section"><div class="exp-label">Columns <span class="note">— Item name is always included</span>'+
      '<span class="exp-quick"><button type="button" class="btn sm subtle" id="exp-all">Select all</button><button type="button" class="btn sm subtle" id="exp-none">Clear</button></span></div>'+
      '<div class="exp-cols">'+ITEM_EXPORT_COLS.map(c=>'<label><input type="checkbox" class="exp-col" value="'+c.key+'" '+(chosen.has(c.key)?'checked':'')+'> '+escAttr(c.label)+'</label>').join('')+'</div></div>'+
    '<div class="exp-section"><div class="exp-label">Format</div><div class="exp-radios">'+
      '<label><input type="radio" name="exp-fmt" value="pdf" '+(prefs.fmt!=='csv'?'checked':'')+'> PDF</label>'+
      '<label><input type="radio" name="exp-fmt" value="csv" '+(prefs.fmt==='csv'?'checked':'')+'> Excel (CSV)</label>'+
    '</div></div>'+
    '<div class="toolbar" style="justify-content:flex-end;margin:16px 0 0"><button class="btn" id="exp-cancel">Cancel</button><button class="btn accent" id="exp-go">Export</button></div>');
  document.getElementById('exp-all').addEventListener('click',()=>document.querySelectorAll('.exp-col').forEach(c=>c.checked=true));
  document.getElementById('exp-none').addEventListener('click',()=>document.querySelectorAll('.exp-col').forEach(c=>c.checked=false));
  document.getElementById('exp-cancel').addEventListener('click', closeModal);
  document.getElementById('exp-go').addEventListener('click',()=>{
    const scope=(document.querySelector('input[name="exp-scope"]:checked')||{}).value||'all';
    const fmt=(document.querySelector('input[name="exp-fmt"]:checked')||{}).value||'pdf';
    const keys=[...document.querySelectorAll('.exp-col:checked')].map(c=>c.value);
    saveItemExportPrefs({cols:keys, fmt});
    const cols=ITEM_EXPORT_COLS.filter(c=>keys.includes(c.key));
    let list = scope==='filtered' ? ctx.filtered : scope==='cat' ? allParts.filter(it=>itemCatKey(it)===ctx.catKey) : allParts;
    const order=(DB.lists.itemGroups||[]).concat(['__uncategorized__']);
    list=list.slice().sort((a,b)=>(order.indexOf(itemCatKey(a))-order.indexOf(itemCatKey(b))) || (a.name||'').localeCompare(b.name||''));
    const head=['Item'].concat(cols.map(c=>c.label));
    const body=list.map(it=>[it.name].concat(cols.map(c=>String(c.get(it)))));
    const title='Dragon Seats - Items'+(scope==='cat'?' - '+itemCatLabel(ctx.catKey):'');
    closeModal();
    if(fmt==='csv'){
      const esc=v=>{ const s=String(v==null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
      const csv='﻿'+[head].concat(body).map(r=>r.map(esc).join(',')).join('\r\n');
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
      a.download=title.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'-'+todayISO()+'.csv'; a.click();
    } else {
      exportTablePDF(title, head.map(pdfSafe), body.map(r=>r.map(pdfSafe)), {rightCols:[0].concat(cols.map((c,i)=>c.num?i+1:-1)).filter(i=>i>0)});
    }
  });
}

/* Update one row of the Items list in place (on hand / price) without re-rendering the
   whole tab, so the cursor isn't pulled out of the next box in the item panel. */
function refreshItemListRow(it){
  const tile=document.querySelector('.item-tile[data-id="'+it.id+'"]');
  if(!tile) return;
  const price=Number(effectiveStandardCost(it))||0;
  const oh=tile.querySelector('.it-onhand'); if(oh) oh.textContent=fmtQty(Number(it.onHand)||0);
  const pr=tile.querySelector('.it-price'); if(pr){ pr.textContent=price?'$'+price.toFixed(2):'No price'; pr.classList.toggle('is-empty', !price); }
}

    card.querySelector('.f-lastdate').addEventListener('change',e=>{ it.lastPurchaseDate=e.target.value||null; save(); renderItems(); });

    card.querySelector('.f-cadence').addEventListener('change',e=>{ it.reorderCadenceDays=e.target.value===''?null:(Number(e.target.value)||0); save(); renderItems(); });

    const histBtn=card.querySelector('.item-history-btn');

      openModal('Order history — '+it.name, body);
