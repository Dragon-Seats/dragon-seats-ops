function quoteLineTotal(q){ return (q.lines||[]).reduce((s,l)=>s+Number(l.qty||0)*Number(l.unitPrice||0),0); }
/* Updates the Line Total cells, Items subtotal and the Quote total placeholder in place,
   so editing qty/price doesn't need a full re-render (which would steal focus mid-typing). */
function quoteDisplayTotal(q){ return docTotal(q); }
function renderQuoteCard(q){
  const converted=q.status==='Converted to PO';
  return '<div class="detail-drawer po-card" data-id="'+q.id+'">'+
    '<div class="detail-drawer-head"><div><h2>Quote '+escAttr(q.quoteNumber||'(no number)')+' <span class="status-badge '+(converted?'closed':(q.status===DB.lists.quoteStatus[0]?'open':''))+'">'+escAttr(q.status)+'</span></h2><div class="sub">'+escAttr((supplierById(q.supplierId)||{}).name||'No supplier')+'</div></div>'+
    '<div class="row-actions no-print">'+'<button class="btn sm doc-pdf" title="Download this document as a PDF">Download PDF</button>'+(!converted?'<button class="btn sm accent convert-quote">Convert to PO</button>':'')+'<button class="btn sm danger del-quote">Delete quote</button><button type="button" class="detail-drawer-close quote-detail-close" title="Close">✕</button></div></div>'+
    '<div class="detail-section">'+
      '<div class="detail-section-title">Notes</div>'+
      '<input class="f-ponotes" style="width:100%" value="'+escAttr(q.notes||'')+'">'+
    '</div>'+
    '<div class="detail-section">'+
      '<div class="detail-section-title">Quote information</div>'+
      '<div class="po-meta detail-grid">'+
        '<div><label>Quote #</label><input class="f-qnum" value="'+escAttr(q.quoteNumber||'')+'"></div>'+
        '<div><label>Supplier</label>'+supplierSelectSimple(q.supplierId)+'</div>'+
        '<div><label>Quote date</label><input class="f-qdate" type="date" value="'+(q.quoteDate||'')+'"></div>'+
        '<div><label>Valid until</label><input class="f-vuntil" type="date" value="'+(q.validUntil||'')+'"></div>'+
        '<div><label>Status</label><select class="f-status">'+DB.lists.quoteStatus.map(s=>'<option value="'+escAttr(s)+'" '+(s===q.status?'selected':'')+'>'+escAttr(s)+'</option>').join('')+'</select></div>'+
      '</div>'+
    '</div>'+
    '<div class="detail-section">'+
      '<div class="detail-section-title">Line items</div>'+
      docLinesTableHtml(q, false)+
      '<button class="btn sm po-add-line no-print" style="margin-top:8px">+ Add line item</button>'+
    '</div>'+
    '<div class="detail-section">'+
      '<div class="detail-section-title">Attachments</div>'+
      '<div class="dropzone-mini file-btn">'+docChips(q.docs)+'<label class="btn sm no-print">+ Add file<input type="file" class="po-file" style="position:absolute;opacity:0;width:1px;height:1px"></label></div>'+
    '</div>'+
  '</div>';
}
function wireQuotes(){
  const list=document.getElementById('quote-detail');
  if(!list) return;
  list.querySelectorAll('.po-card').forEach(card=>{
    const id=card.dataset.id; const q=quoteById(id);
    const closeBtn=card.querySelector('.quote-detail-close');
    const pdfBtn=card.querySelector('.doc-pdf'); if(pdfBtn) pdfBtn.addEventListener('click',()=>exportDocPDF('quote', q));
    if(closeBtn) closeBtn.addEventListener('click',()=>{ selectedQuote=null; renderQuotes(); });
    card.querySelector('.f-qnum').addEventListener('change',e=>{q.quoteNumber=e.target.value; save(); renderQuotes();});
    card.querySelector('.supplier-select').addEventListener('change',e=>{q.supplierId=e.target.value; repriceDocLines(q); save(); renderQuotes(); });
    card.querySelector('.f-qdate').addEventListener('change',e=>{q.quoteDate=e.target.value; save();});
    card.querySelector('.f-vuntil').addEventListener('change',e=>{q.validUntil=e.target.value; save();});
    card.querySelector('.f-status').addEventListener('change',e=>{q.status=e.target.value; save(); renderQuotes(); renderCounts();});
    card.querySelector('.f-extra').addEventListener('input',e=>{ q.extraCharges=round2(e.target.value); save(); refreshDocTotals(card,q); });
    card.querySelector('.f-ponotes').addEventListener('change',e=>{q.notes=e.target.value; save();});
    const conv=card.querySelector('.convert-quote');
    if(conv) conv.addEventListener('click',()=>{
      confirmModal('Create a new Purchase Order pre-filled from this quote? The quote will be kept as history and marked Converted to PO.', ()=>{
        const po={
          id:uid(), poNumber:'', supplierId:q.supplierId, orderDate:todayISO(), expectedDate:addDays(todayISO(),14),
          status:DB.lists.poStatus[0], lines:(q.lines||[]).map(l=>({id:uid(), itemId:l.itemId, qty:l.qty, unitPrice:l.unitPrice, priceAuto:false, received:false, receivedAt:null})),
          docs:(q.docs||[]).slice(), notes:'Converted from quote '+(q.quoteNumber||q.id), extraCharges:Number(q.extraCharges)||0
        };
        DB.purchaseOrders.unshift(po);
        q.status='Converted to PO';
        save(); renderQuotes(); renderCounts();
      }, {okLabel:'Convert'});
    });
    card.querySelector('.del-quote').addEventListener('click',()=>{ confirmModal('Delete this quote?', ()=>{ DB.quotes=DB.quotes.filter(x=>x.id!==id); save(); renderQuotes(); renderCounts(); }); });
    card.querySelector('.po-add-line').addEventListener('click',()=>{ q.lines=q.lines||[]; q.lines.push(newDocLine(q)); save(); renderQuotes(); });
    card.querySelectorAll('.po-lines-tbody tr').forEach(tr=>{
      const i=Number(tr.dataset.i);
      const isel=tr.querySelector('.item-select');
      if(isel) isel.addEventListener('change',e=>{ q.lines[i].itemId=e.target.value; q.lines[i].unitPrice=docLinePrice(e.target.value, q.supplierId); q.lines[i].priceAuto=true; save(); renderQuotes(); });
      const qf=tr.querySelector('.f-qty'); if(qf) qf.addEventListener('input',e=>{ q.lines[i].qty=Number(e.target.value)||0; save(); refreshDocTotals(card,q); });
      const pf=tr.querySelector('.f-price'); if(pf) pf.addEventListener('input',e=>{ q.lines[i].unitPrice=round2(e.target.value); q.lines[i].priceAuto=false; save(); refreshDocTotals(card,q); });
      const df=tr.querySelector('.po-del-line'); if(df) df.addEventListener('click',()=>{ q.lines.splice(i,1); save(); renderQuotes(); });
    });
    enableFileDrop(card.querySelector('.file-btn'), card.querySelector('.po-file'));
    card.querySelector('.po-file').addEventListener('change', async e=>{
      const f=e.target.files[0]; if(!f) return;
      q.docs.push(await attachFileTo('quotes', q, f));
      save(); renderQuotes();
    });
  });
}

/* ---------------- Receipts tab ---------------- */
function receiptLineTotal(r){ return (r.lines||[]).reduce((s,l)=>s+Number(l.qty||0)*Number(l.unitPrice||0),0); }
/* Same as quotes: a typed-in receipt total (freight, tax, lump sum) wins over the summed lines.
   Display only -- line prices still feed price history / BOM costing untouched. */
function receiptDisplayTotal(r){ return docTotal(r); }
function renderReceiptCard(r){
  const applied=!!r.appliedToStock;
  return '<div class="detail-drawer po-card" data-id="'+r.id+'">'+
    '<div class="detail-drawer-head"><div><h2>Receipt '+escAttr(r.receiptNumber||'(no number)')+' <span class="status-badge '+(applied?'closed':'open')+'">'+(applied?'Added to inventory':'Pending — not in stock')+'</span></h2><div class="sub">'+escAttr((supplierById(r.supplierId)||{}).name||'No supplier')+(applied? ' · added '+fmtDate(r.appliedAt):'')+'</div></div>'+
    '<div class="row-actions no-print">'+
      '<button class="btn sm doc-pdf" title="Download this document as a PDF">Download PDF</button>'+
      (applied
        ? '<button class="btn sm undo-receipt">Undo — remove from stock</button>'
        : '<button class="btn sm accent apply-receipt">Add to inventory</button>')+
      '<button class="btn sm danger del-receipt">Delete receipt</button><button type="button" class="detail-drawer-close receipt-detail-close" title="Close">✕</button></div></div>'+
    '<div class="detail-section">'+
      '<div class="detail-section-title">Notes</div>'+
      '<input class="f-ponotes" style="width:100%" value="'+escAttr(r.notes||'')+'">'+
    '</div>'+
    '<div class="detail-section">'+
      '<div class="detail-section-title">Receipt information</div>'+
      '<div class="po-meta detail-grid">'+
        '<div><label>Receipt #</label><input class="f-rnum" value="'+escAttr(r.receiptNumber||'')+'"></div>'+
        '<div><label>Supplier</label>'+supplierSelectSimple(r.supplierId)+'</div>'+
        '<div><label>Receipt date</label><input class="f-rdate" type="date" value="'+(r.receiptDate||'')+'"></div>'+
        '<div><label>Linked PO (optional)</label><select class="f-poid"><option value="">— none —</option>'+DB.purchaseOrders.map(po=>'<option value="'+po.id+'" '+(po.id===r.poId?'selected':'')+'>PO '+escAttr(po.poNumber||po.id)+'</option>').join('')+'</select></div>'+
      '</div>'+
    '</div>'+
    '<div class="detail-section">'+
      '<div class="detail-section-title">Line items</div>'+
      docLinesTableHtml(r, true)+
      '<button class="btn sm po-add-line no-print" style="margin-top:8px">+ Add line item</button>'+
    '</div>'+
    '<div class="detail-section">'+
      '<div class="detail-section-title">Attachments</div>'+
      '<div class="dropzone-mini file-btn">'+docChips(r.docs)+'<label class="btn sm no-print">+ Add file<input type="file" class="po-file" style="position:absolute;opacity:0;width:1px;height:1px"></label></div>'+
    '</div>'+
  '</div>';
}
function wireReceipts(){
  const list=document.getElementById('receipt-detail');
  if(!list) return;
  list.querySelectorAll('.po-card').forEach(card=>{
    const id=card.dataset.id; const r=receiptById(id);
    const closeBtn=card.querySelector('.receipt-detail-close');
    const pdfBtn=card.querySelector('.doc-pdf'); if(pdfBtn) pdfBtn.addEventListener('click',()=>exportDocPDF('receipt', r));
    if(closeBtn) closeBtn.addEventListener('click',()=>{ selectedReceipt=null; renderReceipts(); });
    card.querySelector('.f-rnum').addEventListener('change',e=>{r.receiptNumber=e.target.value; save(); renderReceipts();});
    card.querySelector('.supplier-select').addEventListener('change',e=>{r.supplierId=e.target.value; repriceDocLines(r); save(); renderReceipts(); });
    card.querySelector('.f-rdate').addEventListener('change',e=>{r.receiptDate=e.target.value; save(); renderReceipts();});
    card.querySelector('.f-poid').addEventListener('change',e=>{r.poId=e.target.value; save();});
    card.querySelector('.f-ponotes').addEventListener('change',e=>{r.notes=e.target.value; save();});
    card.querySelector('.f-extra').addEventListener('input',e=>{ r.extraCharges=round2(e.target.value); save(); refreshDocTotals(card,r); });
    card.querySelector('.del-receipt').addEventListener('click',()=>{ confirmModal('Delete this receipt?', ()=>{ DB.receipts=DB.receipts.filter(x=>x.id!==id); save(); renderReceipts(); renderCounts(); }); });
    const applyBtn=card.querySelector('.apply-receipt');
    if(applyBtn) applyBtn.addEventListener('click',()=>{
      const warn = r.poId ? ' This receipt is linked to a PO — if that PO was already received to stock, adding this too will double-count it.' : '';
      confirmModal('Add any remaining line-item quantities on this receipt to on-hand stock? Lines already checked in individually won\'t be double-counted.'+warn, ()=>{
        (r.lines||[]).forEach(l=>{
          if(l.received) return;
          const it=itemById(l.itemId); if(it){ it.onHand=(Number(it.onHand)||0)+Number(l.qty||0); recordPurchase(it, l.qty, r.receiptDate||todayISO()); }
          l.received=true; l.receivedAt=r.receiptDate||todayISO();
        });
        r.appliedToStock=true; r.appliedAt=todayISO();
        // Matching this receipt to its PO is what closes the loop on the request — flip the
        // linked PO straight to the terminal status so it doesn't have to be updated twice.
        const linkedPo=r.poId?poById(r.poId):null;
        if(linkedPo) linkedPo.status=closedStatusName();
        save(); renderReceipts(); renderCounts(); runMRP();
      }, {okLabel:'Add to inventory'});
    });
    const undoBtn=card.querySelector('.undo-receipt');
    if(undoBtn) undoBtn.addEventListener('click',()=>{
      confirmModal('Remove this receipt\'s quantities back out of on-hand stock? Only do this if it was applied by mistake.', ()=>{
        (r.lines||[]).forEach(l=>{ const it=itemById(l.itemId); if(it) it.onHand=(Number(it.onHand)||0)-Number(l.qty||0); l.received=false; l.receivedAt=null; });
        r.appliedToStock=false; r.appliedAt=null;
        // Reverse the auto-close too, so the PO doesn't sit marked Received with nothing behind it.
        const linkedPo=r.poId?poById(r.poId):null;
        const statuses=DB.lists.poStatus||[];
        if(linkedPo && linkedPo.status===closedStatusName() && statuses.length>1) linkedPo.status=statuses[statuses.length-2];
        save(); renderReceipts(); renderCounts(); runMRP();
      }, {okLabel:'Undo'});
    });
    card.querySelector('.po-add-line').addEventListener('click',()=>{ r.lines=r.lines||[]; r.lines.push(newDocLine(r)); save(); renderReceipts(); });
    card.querySelectorAll('.po-lines-tbody tr').forEach(tr=>{
      const i=Number(tr.dataset.i);
      const isel=tr.querySelector('.item-select');
      if(isel) isel.addEventListener('change',e=>{ r.lines[i].itemId=e.target.value; r.lines[i].unitPrice=docLinePrice(e.target.value, r.supplierId); r.lines[i].priceAuto=true; save(); renderReceipts(); });
      const qf=tr.querySelector('.f-qty'); if(qf) qf.addEventListener('input',e=>{ r.lines[i].qty=Number(e.target.value)||0; save(); refreshDocTotals(card,r); });
      const pf=tr.querySelector('.f-price'); if(pf) pf.addEventListener('input',e=>{ r.lines[i].unitPrice=round2(e.target.value); r.lines[i].priceAuto=false; save(); refreshDocTotals(card,r); });
      const df=tr.querySelector('.po-del-line'); if(df) df.addEventListener('click',()=>{ r.lines.splice(i,1); save(); renderReceipts(); });
      const addInv=tr.querySelector('.line-add-inventory');
      if(addInv) addInv.addEventListener('click',()=>{
        const l=r.lines[i]; const it=itemById(l.itemId);
        if(it){ it.onHand=(Number(it.onHand)||0)+Number(l.qty||0); recordPurchase(it, l.qty, r.receiptDate||todayISO()); }
        l.received=true; l.receivedAt=r.receiptDate||todayISO();
        save(); renderReceipts(); renderCounts(); runMRP();
      });
      const undoRecv=tr.querySelector('.line-undo-receive');
      if(undoRecv) undoRecv.addEventListener('click',()=>{
        const l=r.lines[i]; const it=itemById(l.itemId);
        if(it) it.onHand=(Number(it.onHand)||0)-Number(l.qty||0);
        l.received=false; l.receivedAt=null;
        save(); renderReceipts(); renderCounts(); runMRP();
      });
    });
    enableFileDrop(card.querySelector('.file-btn'), card.querySelector('.po-file'));
    card.querySelector('.po-file').addEventListener('change', async e=>{
      const f=e.target.files[0]; if(!f) return;
      r.docs.push(await attachFileTo('receipts', r, f));
      save(); renderReceipts();
    });
  });
}

/* ---------------- PDF export helper (jsPDF, bundled offline) ---------------- */
function pdfAvailable(){ return !!(window.jspdf && window.jspdf.jsPDF); }
function exportTablePDF(title, head, body, opts){
  if(!pdfAvailable()){ alertModal("PDF library didn't load — try Print instead."); return; }
  const jsPDFCtor = window.jspdf.jsPDF;
  const doc = new jsPDFCtor({orientation:'landscape'});
  doc.setFontSize(14); doc.text(title, 14, 16);
  doc.setFontSize(9); doc.text('Dragon Seats MRP — generated '+new Date().toLocaleString(), 14, 22);
  const colStyles={}; ((opts&&opts.rightCols)||[]).forEach(i=>{ colStyles[i]={halign:'right'}; });
  doc.autoTable({ head:[head], body, startY:28, styles:{fontSize:8}, headStyles:{fillColor:[170,2,1]}, columnStyles:colStyles,
    didParseCell:d=>{ if(d.section==='head' && colStyles[d.column.index]) d.cell.styles.halign='right'; } });
  doc.save(title.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.pdf');
}

/* ---------------- Single-document PDF (PO / Quote / Receipt) ----------------
   One clean, emailable PDF per document. Read-only: never changes the record. */
function pdfSafe(s){
  // jsPDF's built-in Helvetica only covers Latin-1; swap the common typographic
  // characters used around the app so they don't render as garbage.
  return String(s==null?'':s)
    .replace(/[–—−]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"')
    .replace(/…/g,'...').replace(/[·•]/g,'-').replace(/→/g,'->').replace(/[✓✔]/g,'')
    .replace(/[^\x00-\xFF]/g,'');
}
function pdfMoney(n){ return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function exportDocPDF(type, rec){
  if(!rec) return;
  if(!pdfAvailable()){ alertModal("PDF library didn't load -- try Print instead."); return; }
  const jsPDFCtor=window.jspdf.jsPDF;
  const doc=new jsPDFCtor({orientation:'portrait', unit:'mm', format:'letter'});
  const pageW=doc.internal.pageSize.getWidth(), pageH=doc.internal.pageSize.getHeight();
  const M=14, RED=[170,2,1], STEEL=[110,110,110];
  const now=new Date();
  const createdStr=now.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'})+' '+now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  const supplier=supplierById(rec.supplierId)||null;
  const lines=rec.lines||[];

  // --- per-type fields ---
  let title, number, status, purchasedISO, meta=[], subtotal, total, totalLabel, showStock=true;
  if(type==='po'){
    title='PURCHASE ORDER'; number=rec.poNumber; status=rec.status;
    purchasedISO=rec.orderDate||'';
    subtotal=poLineTotal(rec); total=poDisplayTotal(rec); totalLabel='Order total';
    meta=[['Order date', fmtDate(rec.orderDate)], ['Expected date', fmtDate(rec.expectedDate)], ['Approved by (Finance)', rec.approvedBy||'-']];
  } else if(type==='quote'){
    title='QUOTE'; number=rec.quoteNumber; status=rec.status; showStock=false;
    purchasedISO='';
    subtotal=quoteLineTotal(rec); total=quoteDisplayTotal(rec); totalLabel='Quote total';
    meta=[['Quote date', fmtDate(rec.quoteDate)], ['Valid until', fmtDate(rec.validUntil)]];
  } else {
    title='RECEIPT'; number=rec.receiptNumber; status=rec.appliedToStock?'Added to inventory':'Pending - not in stock';
    purchasedISO=rec.receiptDate||'';
    subtotal=receiptLineTotal(rec); total=receiptDisplayTotal(rec); totalLabel='Receipt total';
    const linkedPo=rec.poId?poById(rec.poId):null;
    meta=[['Purchase date', fmtDate(rec.receiptDate)], ['Added to inventory', rec.appliedToStock?fmtDate(rec.appliedAt):'Not yet'],
          ['Linked PO', linkedPo?((/^po/i.test(linkedPo.poNumber||'')?'':'PO ')+(linkedPo.poNumber||'(no number)')):'-']];
  }

  // --- header ---
  let y=16;
  let textX=M;
  try{
    const logo=document.querySelector('.sb-brand img');
    if(logo && logo.src && logo.src.indexOf('data:image/png')===0){ doc.addImage(logo.src,'PNG',M,9,17,13); textX=M+20; }
  }catch(e){ /* logo is optional */ }
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(0);
  doc.text('Dragon Seats', textX, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...STEEL);
  doc.text('MRP Planner', textX, y+5);
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(...RED);
  doc.text(title, pageW-M, y, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(0);
  doc.text(pdfSafe('# '+(number||'(no number)')), pageW-M, y+6, {align:'right'});
  doc.setFontSize(8.5); doc.setTextColor(...STEEL);
  doc.text(pdfSafe('Status: '+(status||'-')), pageW-M, y+11, {align:'right'});
  doc.text('PDF created: '+createdStr, pageW-M, y+15.5, {align:'right'});
  y=36;
  doc.setDrawColor(...RED); doc.setLineWidth(0.6); doc.line(M, y, pageW-M, y);
  y+=7;

  // --- supplier (left) + document info (right) ---
  const colR=pageW/2+4;
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...STEEL);
  doc.text('SUPPLIER', M, y); doc.text('DETAILS', colR, y);
  let yl=y+5, yr=y+5;
  doc.setTextColor(0); doc.setFontSize(10.5);
  doc.text(pdfSafe(supplier?supplier.name:'No supplier'), M, yl); yl+=5;
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  if(supplier){ [supplier.contact, supplier.email, supplier.phone].filter(Boolean).forEach(v=>{ doc.text(pdfSafe(v), M, yl); yl+=4.5; }); }
  meta.forEach(([k,v])=>{
    doc.setTextColor(...STEEL); doc.text(pdfSafe(k), colR, yr);
    doc.setTextColor(0); doc.text(pdfSafe(v), pageW-M, yr, {align:'right'});
    yr+=5;
  });
  y=Math.max(yl,yr)+4;

  // --- line items ---
  const stockCell=l=>{
    if(l.received) return l.receivedAt?fmtDate(l.receivedAt):'Yes (date not recorded)';
    if(type==='po' && rec.status===closedStatusName()) return 'Received';
    return 'Not yet';
  };
  const head=['Item','Qty','Unit price','Amount'];
  if(showStock){ head.push('Purchased','Put Into Stock'); }
  const body=lines.map(l=>{
    const it=itemById(l.itemId);
    const qty=Number(l.qty||0), price=Number(l.unitPrice||0);
    const row=[pdfSafe(it?it.name:'(item removed)'), pdfSafe(fmtQty(qty)+' '+((it&&it.uom)||'ea')), pdfMoney(price), pdfMoney(qty*price)];
    if(showStock){ row.push(purchasedISO?fmtDate(purchasedISO):'-', stockCell(l)); }
    return row;
  });
  if(!body.length) body.push([{content:'No line items on this document.', colSpan:head.length, styles:{textColor:STEEL, fontStyle:'italic'}}]);

  const foot=[];
  const extra=Number(rec.extraCharges)||0;
  const tail=showStock?[{content:'', colSpan:2}]:[];
  const footRow=(label,val)=>[{content:label, colSpan:3, styles:{halign:'right'}}, {content:pdfMoney(val), styles:{halign:'right'}}].concat(tail);
  if(extra){ foot.push(footRow('Subtotal', subtotal)); foot.push(footRow('Tax, shipping & other', extra)); }
  foot.push(footRow('Total', total));

  const colStyles= showStock
    ? {0:{cellWidth:'auto'},1:{halign:'right',cellWidth:22},2:{halign:'right',cellWidth:24},3:{halign:'right',cellWidth:26},4:{cellWidth:24},5:{cellWidth:26}}
    : {0:{cellWidth:'auto'},1:{halign:'right',cellWidth:28},2:{halign:'right',cellWidth:30},3:{halign:'right',cellWidth:32}};
  doc.autoTable({
    head:[head], body, foot, startY:y,
    margin:{left:M, right:M, bottom:18},
    styles:{fontSize:9, cellPadding:2.2, overflow:'linebreak'},
    headStyles:{fillColor:RED, textColor:255, fontStyle:'bold'},
    footStyles:{fillColor:[247,246,244], textColor:[23,24,26], fontStyle:'bold'},
    columnStyles:colStyles,
    didParseCell:d=>{ if(d.section==='head' && d.column.index>=1 && d.column.index<=3) d.cell.styles.halign='right'; },
    showFoot:'lastPage'
  });
  y=doc.lastAutoTable.finalY+8;

  // --- notes ---
  const notes=pdfSafe(rec.notes||'').trim();
  if(notes){
    const wrapped=doc.splitTextToSize(notes, pageW-2*M);
    if(y+8+wrapped.length*4.5>pageH-20){ doc.addPage(); y=20; }
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...STEEL);
    doc.text('NOTES', M, y); y+=5;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(0);
    doc.text(wrapped, M, y); y+=wrapped.length*4.5+4;
  }
  if(type==='quote'){
    doc.setFontSize(8.5); doc.setTextColor(...STEEL);
    if(y>pageH-24){ doc.addPage(); y=20; }
    doc.text('Quote only - nothing on this document has been purchased or put into stock.', M, y);
  }

  // --- footer on every page ---
  const pages=doc.internal.getNumberOfPages();
  for(let p=1;p<=pages;p++){
    doc.setPage(p);
    doc.setDrawColor(220); doc.setLineWidth(0.2); doc.line(M, pageH-12, pageW-M, pageH-12);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...STEEL);
    doc.text(pdfSafe('Dragon Seats - '+title.charAt(0)+title.slice(1).toLowerCase()+' '+(number||'')+' - PDF created '+createdStr), M, pageH-7);
    doc.text('Page '+p+' of '+pages, pageW-M, pageH-7, {align:'right'});
  }

  const slug={po:'PO',quote:'Quote',receipt:'Receipt'}[type];
  const safeNum=String(number||'no-number').replace(new RegExp('^'+slug+'[\\s#:-]*','i'),'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'');
  doc.save('Dragon-Seats-'+slug+'-'+safeNum+'-'+todayISO()+'.pdf');
}

/* ================= Document pricing & totals =================
   Every PO / Quote / Receipt line carries a unit price. Totals are always calculated:
   Subtotal (qty × price) + Tax/shipping/other = Total. Nothing to type in by hand. */
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
function money(n){ const v=Number(n)||0; return (v<0?'-':'')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function docLinesSubtotal(doc){ return round2((doc&&doc.lines||[]).reduce((s,l)=>s+Number(l.qty||0)*Number(l.unitPrice||0),0)); }
function docTotal(doc){ return round2(docLinesSubtotal(doc)+(Number(doc&&doc.extraCharges)||0)); }
/* Price for an item on a document: that supplier's price on the item if there is one,
   otherwise the item's own price. */
function docLinePrice(itemId, supplierId){
  const it=itemById(itemId); if(!it) return 0;
  const link=(it.links||[]).find(l=>l.supplierId===supplierId && Number(l.cost)>0);
  if(link) return round2(link.cost);
  return round2(Number(effectiveStandardCost(it))||0);
}
/* When a document's supplier changes, re-price the lines that were filled in automatically. */
function repriceDocLines(doc){
  (doc.lines||[]).forEach(l=>{ if(l.priceAuto || !Number(l.unitPrice)) { l.unitPrice=docLinePrice(l.itemId, doc.supplierId); l.priceAuto=true; } });
}
function newDocLine(doc){
  const first=(DB.items.find(i=>!i.isProduct)||DB.items[0]||{}).id||'';
  return {id:uid(), itemId:first, qty:1, unitPrice:docLinePrice(first, doc.supplierId), priceAuto:true, received:false, receivedAt:null};
}

/* ================= Google Drive folder storage =================
   You pick your Drive "Documents" folder once (Settings, or the Documents page). Every
   document is then written straight into it — Google Drive for desktop syncs it up:
     Documents / Receipts|Quotes|Purchase Orders / 2026 / Supplier / 2026-10-27_Supplier_1042.pdf
   The app only keeps the file's path, so the app stays small and fast. */
const DOC_FOLDER_NAMES={receipts:'Receipts', quotes:'Quotes', po:'Purchase Orders', shipments:'Shipments'};
const DOCS_ROOT_KEY='docs-root-handle';
let docsRootInfo={name:'', supported:(typeof window!=='undefined' && 'showDirectoryPicker' in window)};
function safeName(s){ return String(s||'').replace(/[\\/:*?"<>|#%\u0000-\u001f]+/g,' ').replace(/\s+/g,' ').trim().slice(0,60); }
async function loadDocsRootInfo(){
  try{ const h=await idbGet(DOCS_ROOT_KEY); docsRootInfo.name=h&&h.name?h.name:''; }catch(e){ docsRootInfo.name=''; }
  return docsRootInfo;
}
async function chooseDocsRoot(){
  if(!docsRootInfo.supported){ alertModal('Saving into a Google Drive folder needs Chrome or Microsoft Edge. Open the app in one of those to turn this on.'); return null; }
  let h;
  try{ h=await window.showDirectoryPicker({id:'ds-mrp-docs', mode:'readwrite'}); }
  catch(e){ return null; } // cancelled
  await idbSet(DOCS_ROOT_KEY, h);
  docsRootInfo.name=h.name;
  return h;
}
/* Returns the Drive folder handle with write access, or null. `ask` lets the browser show its
   one-click "allow" prompt (only works right after a click). */
async function getDocsRoot(ask){
  if(!docsRootInfo.supported) return null;
  let h=null;
  try{ h=await idbGet(DOCS_ROOT_KEY); }catch(e){ return null; }
  if(!h) return null;
  try{
    let p=await h.queryPermission({mode:'readwrite'});
    if(p!=='granted' && ask) p=await h.requestPermission({mode:'readwrite'});
    return p==='granted'?h:null;
  }catch(e){ return null; }
}
async function driveFileExists(dir, name){ try{ await dir.getFileHandle(name); return true; }catch(e){ return false; } }
/* Writes one file into the Drive folder. Returns the doc entry to keep on the record.
   Falls back to keeping the file inside the app if no Drive folder is connected. */
async function storeDocFile(blob, meta){
  const fallback=async()=>({id:uid(), name:meta.name, dataUrl:await readFileAsDataURL(blob), uploadedAt:todayISO()});
  const root=await getDocsRoot(true);
  if(!root) return fallback();
  try{
    const ext=((meta.name||'').match(/\.[a-z0-9]{1,5}$/i)||[blob.type==='application/pdf'?'.pdf':''])[0].toLowerCase();
    let parts, base;
    if(meta.folderType==='item'){
      parts=['Item Files', safeName(meta.category||'Uncategorized'), safeName(meta.itemName||'Item')];
      base=safeName((meta.name||'file').replace(/\.[a-z0-9]{1,5}$/i,''))||'file';
    } else {
      const date=meta.date||todayISO();
      parts=[DOC_FOLDER_NAMES[meta.folderType]||'Other', date.slice(0,4), safeName(meta.supplierName)||'No supplier'];
      base=[date, safeName(meta.supplierName), safeName(meta.number)].filter(Boolean).join('_');
    }
    let dir=root;
    for(const p of parts) dir=await dir.getDirectoryHandle(p,{create:true});
    let fname=base+ext, n=2;
    while(await driveFileExists(dir,fname)){ fname=base+'-'+n+ext; n++; }
    const fh=await dir.getFileHandle(fname,{create:true});
    const w=await fh.createWritable(); await w.write(blob); await w.close();
    return {id:uid(), name:fname, drivePath:parts.concat([fname]).join('/'), uploadedAt:todayISO()};
  }catch(e){
    console.warn('[dragon-seats] Drive save failed, keeping file in the app', e);
    return fallback();
  }
}
function docRecordMeta(kind, rec){
  const s=supplierById(rec.supplierId);
  if(kind==='po') return {folderType:'po', supplierName:s?s.name:'', date:rec.orderDate, number:rec.poNumber};
  if(kind==='quotes') return {folderType:'quotes', supplierName:s?s.name:'', date:rec.quoteDate, number:rec.quoteNumber};
  if(kind==='receipts') return {folderType:'receipts', supplierName:s?s.name:'', date:rec.receiptDate, number:rec.receiptNumber};
  if(kind==='shipments') return {folderType:'shipments', supplierName:shipCompanyName(rec), date:rec.shipDate||rec.deliveredDate||rec.expectedDate, number:rec.tracking||rec.method};
  return {folderType:'item', category:rec.itemGroup||'Uncategorized', itemName:rec.name};
}
/* Used by every "+ Add file" button (POs, quotes, receipts, items). */
async function attachFileTo(kind, rec, file){
  return storeDocFile(file, Object.assign(docRecordMeta(kind, rec), {name:file.name}));
}
async function openDriveDoc(path){
  const root=await getDocsRoot(true);
  if(!root){ alertModal('This file is saved in your Google Drive documents folder ('+path+'). Connect that folder in Settings → Documents to open it from here.'); return; }
  try{
    const parts=path.split('/'); let dir=root;
    for(const p of parts.slice(0,-1)) dir=await dir.getDirectoryHandle(p);
    const file=await (await dir.getFileHandle(parts[parts.length-1])).getFile();
    const url=URL.createObjectURL(file);
    const w=window.open(url,'_blank');
    if(!w){ const a=document.createElement('a'); a.href=url; a.download=file.name; a.click(); }
  }catch(e){ alertModal('Could not find '+path+' in your Drive documents folder. It may have been moved or renamed.'); }
}
function dataUrlToBlob(dataUrl){
  const [head,b64]=String(dataUrl).split(',');
  const mime=(head.match(/data:([^;]+)/)||[])[1]||'application/octet-stream';
  const bin=atob(b64||''); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
/* Moves every attachment still stored inside the app into the Drive folder. */
function attachmentsInApp(){
  const out=[];
  DB.purchaseOrders.forEach(r=>(r.docs||[]).forEach(d=>{ if(d.dataUrl && !d.drivePath) out.push(['po',r,d]); }));
  DB.quotes.forEach(r=>(r.docs||[]).forEach(d=>{ if(d.dataUrl && !d.drivePath) out.push(['quotes',r,d]); }));
  DB.receipts.forEach(r=>(r.docs||[]).forEach(d=>{ if(d.dataUrl && !d.drivePath) out.push(['receipts',r,d]); }));
  DB.items.forEach(r=>(r.docs||[]).forEach(d=>{ if(d.dataUrl && !d.drivePath) out.push(['item',r,d]); }));
  (DB.shipments||[]).forEach(r=>(r.docs||[]).forEach(d=>{ if(d.dataUrl && !d.drivePath) out.push(['shipments',r,d]); }));
  return out;
}
async function moveAttachmentsToDrive(){
  const root=await getDocsRoot(true);
  if(!root){ alertModal('Choose your Google Drive documents folder first.'); return; }
  const list=attachmentsInApp(); let moved=0, failed=0;
  for(const [kind,rec,d] of list){
    const entry=await storeDocFile(dataUrlToBlob(d.dataUrl), Object.assign(docRecordMeta(kind,rec), {name:d.name}));
    if(entry.drivePath){ d.drivePath=entry.drivePath; d.name=entry.name; delete d.dataUrl; moved++; } else failed++;
  }
  await save();
  renderSettings();
  alertModal('Moved '+moved+' file'+(moved===1?'':'s')+' into your Drive folder.'+(failed?' '+failed+' could not be moved and are still stored in the app.':''), {title:'Done'});
}

/* ================= Auto-read documents (Claude) =================
   Drop a PDF or photo → it is sent to Claude with your own Anthropic API key → supplier,
   number, date, every line item (qty + price) and the totals come back, already matched to
   your catalog. You check it on one screen and save. */
const API_KEY_STORE='ds-mrp-anthropic-key';
const MODEL_STORE='ds-mrp-doc-model';
const DEFAULT_DOC_MODEL='claude-sonnet-4-5';
function getApiKey(){ try{ return localStorage.getItem(API_KEY_STORE)||''; }catch(e){ return ''; } }
function setApiKey(v){ try{ if(v) localStorage.setItem(API_KEY_STORE, v); else localStorage.removeItem(API_KEY_STORE); }catch(e){} }
function getDocModel(){ try{ return localStorage.getItem(MODEL_STORE)||DEFAULT_DOC_MODEL; }catch(e){ return DEFAULT_DOC_MODEL; } }
async function anthropicFetch(path, body){
  const res=await fetch('https://api.anthropic.com'+path, {
    method: body?'POST':'GET',
    headers:{'content-type':'application/json','x-api-key':getApiKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: body?JSON.stringify(body):undefined
  });
  let data=null; try{ data=await res.json(); }catch(e){}
  if(!res.ok){
    const err=new Error((data&&data.error&&data.error.message)||('Request failed ('+res.status+')'));
    err.status=res.status; throw err;
  }
  return data;
}
async function pickNewestModel(){
  const d=await anthropicFetch('/v1/models?limit=100');
  const ids=(d&&d.data||[]).map(m=>m.id);
  return ids.find(id=>/sonnet/i.test(id)) || ids.find(id=>/opus/i.test(id)) || ids[0] || '';
}
function blobToBase64(blob){ return readFileAsDataURL(blob).then(u=>String(u).split(',')[1]||''); }
async function downscaleImage(file, maxEdge){
  let bmp;
  try{ bmp=await createImageBitmap(file); }
  catch(e){
    if(/^image\/(jpeg|png|gif|webp)$/.test(file.type) && file.size<4.5e6) return {mediaType:file.type, base64:await blobToBase64(file)};
    throw new Error('This photo format can’t be opened by the browser (often iPhone HEIC). Export it as JPG, or set the iPhone camera to “Most Compatible”.');
  }
  const scale=Math.min(1, maxEdge/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas'); c.width=Math.round(bmp.width*scale); c.height=Math.round(bmp.height*scale);
  const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.9));
  return {mediaType:'image/jpeg', base64:await blobToBase64(blob)};
}
async function prepareDocFile(file){
  const name=file.name||'document'; const lower=name.toLowerCase(); const type=file.type||'';
  if(type==='application/pdf' || lower.endsWith('.pdf')) return {kind:'pdf', mediaType:'application/pdf', base64:await blobToBase64(file), blob:file, name};
  if(/^text\//.test(type) || /\.(txt|csv)$/.test(lower)) return {kind:'text', text:(await file.text()).slice(0,120000), blob:file, name};
  if(/^image\//.test(type) || /\.(jpe?g|png|gif|webp|heic|heif|bmp)$/.test(lower)){
    const img=await downscaleImage(file, 2200);
    return {kind:'image', mediaType:img.mediaType, base64:img.base64, blob:file, name};
  }
  return {kind:'other', blob:file, name};
}

function normName(s){ return String(s||'').toLowerCase().replace(/&/g,' and ').replace(/\b(inc|llc|ltd|co|corp|corporation|company|the)\b/g,' ').replace(/[^a-z0-9]+/g,''); }
function matchSupplierByName(name){
  const n=normName(name); if(!n) return '';
  const exact=DB.suppliers.find(s=>normName(s.name)===n); if(exact) return exact.id;
  const part=DB.suppliers.find(s=>{ const m=normName(s.name); return m.length>=3 && (n.includes(m) || m.includes(n)); });
  return part?part.id:'';
}
function numOrNull(v){ if(v===null||v===undefined||v==='') return null; const n=Number(String(v).replace(/[$,\s]/g,'')); return isFinite(n)?n:null; }
function normalizeExtraction(x){
  x=x||{};
  const lines=(Array.isArray(x.lines)?x.lines:[]).map(l=>{
    let qty=numOrNull(l.qty), unit=numOrNull(l.unit_price), lt=numOrNull(l.line_total);
    if(qty===null || qty===0) qty = (unit && lt) ? round2(lt/unit) : 1;
    if(unit===null && lt!==null) unit=round2(lt/(qty||1));
    let id=l.catalog_item_id && itemById(l.catalog_item_id) ? l.catalog_item_id : '';
    if(!id){ const n=normName(l.description); const hit=DB.items.find(i=>!i.isProduct && normName(i.name)===n); if(hit) id=hit.id; }
    return {docText:String(l.description||'').trim()+(l.sku?' ('+l.sku+')':''), name:String(l.description||'').trim(), uom:l.uom||'', qty, unitPrice:round2(unit||0), lineTotal:lt, itemId:id, isPart:l.is_inventory_part!==false, category:l.suggested_category||''};
  }).filter(l=>l.name || l.unitPrice);
  let supplierId = x.supplier_id && supplierById(x.supplier_id) ? x.supplier_id : matchSupplierByName(x.supplier_name);
  const map={receipt:'receipts', quote:'quotes', po:'po'};
  return {
    type: map[x.doc_type]||'receipts', supplierId, supplierName:(x.supplier_name||'').trim(),
    number:(x.doc_number||'').toString().trim(), date:/^\d{4}-\d{2}-\d{2}$/.test(x.doc_date||'')?x.doc_date:'',
    validUntil:/^\d{4}-\d{2}-\d{2}$/.test(x.valid_until||'')?x.valid_until:'',
    lines, tax:numOrNull(x.tax), shipping:numOrNull(x.shipping), other:numOrNull(x.other_charges), total:numOrNull(x.total), notes:x.notes||''
  };
}
async function readDocWithClaude(prep){
  const content=[];
  if(prep.kind==='pdf') content.push({type:'document', source:{type:'base64', media_type:'application/pdf', data:prep.base64}});
  else if(prep.kind==='image') content.push({type:'image', source:{type:'base64', media_type:prep.mediaType, data:prep.base64}});
  else if(prep.kind==='text') content.push({type:'text', text:'DOCUMENT TEXT ('+prep.name+'):\n'+prep.text});
  else throw new Error('This file type can’t be read automatically. Save it as a PDF or a photo and drop that in instead.');
  content.push({type:'text', text:docReadPrompt(prep.name)});
  const body=m=>({model:m, max_tokens:8000, tools:[DOC_READ_TOOL], tool_choice:{type:'tool', name:'record_document'}, messages:[{role:'user', content}]});
  const model=getDocModel(); let data;
  try{ data=await anthropicFetch('/v1/messages', body(model)); }
  catch(e){
    if(e.status===404 || (e.status===400 && /model/i.test(e.message||''))){
      const m2=await pickNewestModel();
      if(!m2 || m2===model) throw e;
      try{ localStorage.setItem(MODEL_STORE, m2); }catch(_){}
      data=await anthropicFetch('/v1/messages', body(m2));
    } else throw e;
  }
  const tu=(data&&data.content||[]).find(b=>b.type==='tool_use');
  if(!tu) throw new Error('The document came back unreadable. Try a clearer photo or the PDF.');
  return normalizeExtraction(tu.input);
}
function friendlyReadError(e){
  const m=(e&&e.message)||String(e);
  if(e&&e.status===401) return 'Your API key was not accepted. Check it in Settings → Documents.';
  if(e&&e.status===429) return 'Too many requests right now — wait a few seconds and try again.';
  if(e&&(e.status===529||e.status>=500)) return 'The reading service is busy. Try again in a minute.';
  if(/Failed to fetch|NetworkError/i.test(m)) return 'Could not reach the reading service — check your internet connection.';
  return m;
}

function setSupplierPrice(itemId, supplierId, price, source){
  const it=itemById(itemId); if(!it || !supplierId || !(price>0)) return;
  it.links=it.links||[];
  const link=it.links.find(l=>l.supplierId===supplierId);
  if(link){ link.cost=round2(price); }
  else it.links.push({id:uid(), supplierId, cost:round2(price), url:'', phone:'', contactType:'link', notes:'Price from '+source});
  if(!Number(it.standardCost)) it.standardCost=round2(price);
}
async function commitIntake(rv, prep, previewUrl){
  const btn=document.getElementById('ir-save'); if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  const rootPromise=getDocsRoot(true); // ask for Drive access right away, while the click still counts
  // supplier
  let supplierId=rv.supplierId;
  if(supplierId==='__new__'){
    const name=(rv.newSupplierName||'').trim()||'New supplier';
    const existing=DB.suppliers.find(s=>normName(s.name)===normName(name));
    if(existing) supplierId=existing.id;
    else { const s={id:uid(), name, contact:'', email:'', phone:'', specialty:'', notes:'Added from '+prep.name}; DB.suppliers.push(s); supplierId=s.id; }
  }
  const supplier=supplierById(supplierId);
  const label={receipts:'receipt',quotes:'quote',po:'PO'}[rv.type]+' '+(rv.number||prep.name);
  // lines
  const lines=[]; let skipped=0; const skippedNames=[];
  rv.lines.forEach(l=>{
    const qty=Number(l.qty)||0, price=round2(l.unitPrice);
    if(l.itemSel==='__skip__'){ skipped+=qty*price; if(l.docText) skippedNames.push(l.docText); return; }
    let itemId=l.itemSel;
    if(itemId==='__new__'){
      const name=(l.newName||l.docText||'New item').trim();
      const it=mkItem(uid(), name, (l.uom&&l.uom.length<=12?l.uom:'ea'), {itemGroup:l.newCat||'', standardCost:price, notes:'Added from '+label});
      DB.items.push(it); itemId=it.id;
    }
    if(!itemById(itemId)) return;
    lines.push({id:uid(), itemId, qty, unitPrice:price, priceAuto:false, docText:l.docText||'', received:false, receivedAt:null});
    if(rv.updatePrices && price>0) setSupplierPrice(itemId, supplierId, price, label);
  });
  const extra=round2((Number(rv.extra)||0)+skipped);
  const notes='Read from '+prep.name+(skippedNames.length?' · Not tracked: '+skippedNames.join('; '):'');
  const date=rv.date||todayISO();
  await rootPromise;
  const entry=await storeDocFile(prep.blob, {folderType:rv.type, supplierName:supplier?supplier.name:'', date, number:rv.number, name:prep.name});
  let rec;
  if(rv.type==='quotes'){
    rec={id:uid(), quoteNumber:rv.number, supplierId, quoteDate:date, validUntil:rv.validUntil||addDays(date,30), status:DB.lists.quoteStatus[0], lines, docs:[entry], notes, extraCharges:extra};
    DB.quotes.unshift(rec);
  } else if(rv.type==='po'){
    rec={id:uid(), poNumber:rv.number, supplierId, orderDate:date, expectedDate:addDays(date,14), status:DB.lists.poStatus[0], requestedBy:'', approvedBy:'', lines, docs:[entry], notes, extraCharges:extra};
    DB.purchaseOrders.unshift(rec);
  } else {
    rec={id:uid(), receiptNumber:rv.number, supplierId, receiptDate:date, poId:'', orderLink:'', requestedBy:'', lines, docs:[entry], notes, appliedToStock:false, appliedAt:null, extraCharges:extra};
    if(rv.addToStock){
      rec.lines.forEach(l=>{ const it=itemById(l.itemId); if(it){ it.onHand=(Number(it.onHand)||0)+Number(l.qty||0); recordPurchase(it, l.qty, date); } l.received=true; l.receivedAt=date; });
      rec.appliedToStock=true; rec.appliedAt=todayISO();
    }
    DB.receipts.unshift(rec);
  }
  if(previewUrl) URL.revokeObjectURL(previewUrl);
  await save();
  closeModal();
  openDocRecord(rv.type, rec.id); currentTab='docs'; setTab('docs'); renderCounts();
}

    : '';
  openModal('Cancel '+docTypeLabel(type),
    '<p class="note" style="font-size:13.5px;color:var(--ink);margin-top:0">The '+docTypeLabel(type)+' stays on file under <b>Cancelled</b> so there’s a record of it, but it no longer counts toward open orders, planning or pricing. You can restore it later.</p>'+
    stockNote+
    '<label class="note" style="display:block;margin:10px 0 4px">Reason (optional)</label>'+
    '<input type="text" id="cancel-reason" placeholder="e.g. Supplier out of stock, ordered elsewhere, duplicate" style="width:100%;box-sizing:border-box">'+
    '<div class="toolbar" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="cancel-keep">Keep it</button><button class="btn accent" id="cancel-go">Cancel '+docTypeLabel(type)+'</button></div>');
  const inp=document.getElementById('cancel-reason'); inp.focus();
  const go=()=>{
    recvd.forEach(l=>{ const it=itemById(l.itemId); if(it) it.onHand=(Number(it.onHand)||0)-Number(l.qty||0); l.received=false; l.receivedAt=null; });
    if(type==='receipts' && rec.appliedToStock){
      rec.appliedToStock=false; rec.appliedAt=null;
      const linkedPo=rec.poId?poById(rec.poId):null;
      const statuses=DB.lists.poStatus||[];
      if(linkedPo && linkedPo.status===closedStatusName() && statuses.length>1) linkedPo.status=statuses[statuses.length-2];
    }
    rec.cancelled=true; rec.cancelledAt=todayISO(); rec.cancelReason=inp.value.trim();
    save(); closeModal(); renderDocs(); renderCounts();
  };
  document.getElementById('cancel-go').addEventListener('click',go);
  document.getElementById('cancel-keep').addEventListener('click',closeModal);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } });
}

function decorateDocCancel(type, rec){
  const card=document.querySelector('#docs-home .detail-drawer');
  if(!card || !rec) return;
  const actions=card.querySelector('.detail-drawer-head .row-actions');
  if(isCancelled(rec)){
    card.classList.add('is-cancelled');
    ['.receive-po','.convert-quote','.apply-receipt','.undo-receipt','.line-add-inventory','.line-undo-receive'].forEach(s=>card.querySelectorAll(s).forEach(b=>b.remove()));
    const h2=card.querySelector('.detail-drawer-head h2 .status-badge');
    if(h2){ h2.className='status-badge cancelled'; h2.textContent='Cancelled'; }
    const banner=document.createElement('div');
    banner.className='cancel-banner';
    banner.innerHTML='<div><b>Cancelled '+fmtDate(rec.cancelledAt)+'</b>'+(rec.cancelReason?' — '+escAttr(rec.cancelReason):'')+'<div class="note">Not counted in open orders, planning or pricing.</div></div><button class="btn sm no-print" id="doc-restore">Restore</button>';
    card.querySelector('.detail-drawer-head').insertAdjacentElement('afterend', banner);

  } else if(actions){

    btn.className='btn sm cancel-doc'; btn.textContent='Cancel '+(type==='po'?'PO':type==='quotes'?'quote':'receipt');
    btn.title='Cancel instead of deleting — keeps a record';

function findDuplicateItems(){
  const nameGroups={};
  DB.items.forEach(it=>{
    const key=(it.name||'').trim().toLowerCase();
    if(!key) return;
    (nameGroups[key]=nameGroups[key]||[]).push(it);
  });
  const nameDupes=Object.values(nameGroups).filter(g=>g.length>1);

  const usageByItem={};
  DB.items.filter(i=>i.isProduct).forEach(p=>{
    const {breakdown}=computeProductCost(p);
    breakdown.forEach(r=>{
      (usageByItem[r.item.id]=usageByItem[r.item.id]||[]).push({product:p.name, type:r.type, vias:Array.from(r.vias)});
    });
  });
  const mixedUsage=Object.entries(usageByItem)
    .filter(([id,uses])=>uses.some(u=>u.type==='included') && uses.some(u=>u.type!=='included'))
    .map(([id,uses])=>({item:itemById(id), uses}))
    .filter(x=>x.item);

  // Sub-assemblies (items with their own recipe) that have NO price of their own — these get
  // fully decomposed into individually-priced components instead of showing as one bundle line.
  const unpricedAssemblies=DB.items
    .filter(it=>!it.isProduct && Array.isArray(it.lines) && it.lines.length && resolvePartCost(it).type==='none')
    .map(it=>({item:it, childCount:it.lines.length}));

  return {nameDupes, mixedUsage, unpricedAssemblies};
}
function renderDataAudit(){
  const {nameDupes, mixedUsage, unpricedAssemblies}=findDuplicateItems();
  if(!nameDupes.length && !mixedUsage.length && !unpricedAssemblies.length){
    return '';
  }
  let html='';
  if(unpricedAssemblies.length){
    html+='<div style="margin-bottom:12px"><b>Sub-assembly not grouped as a bundle</b> ('+unpricedAssemblies.length+')'+
      '<ul style="margin:6px 0 0 18px;padding:0">'+unpricedAssemblies.map(x=>
        '<li style="margin-bottom:2px">'+escAttr(x.item.name)+' — '+x.childCount+' component'+(x.childCount>1?'s':'')+', no price of its own</li>'
      ).join('')+'</ul></div>';
  }
  if(nameDupes.length){
    html+='<div style="margin-bottom:12px"><b>Same name, multiple entries</b> ('+nameDupes.length+')'+
      '<ul style="margin:6px 0 0 18px;padding:0">'+nameDupes.map(g=>
        '<li style="margin-bottom:2px">'+escAttr(g[0].name)+' — '+g.length+' entries</li>'
      ).join('')+'</ul></div>';
  }
  if(mixedUsage.length){
    html+='<div><b>Bundled in one place, listed separately in another</b> ('+mixedUsage.length+')'+
      '<ul style="margin:6px 0 0 18px;padding:0">'+mixedUsage.map(x=>
        '<li style="margin-bottom:2px">'+escAttr(x.item.name)+'</li>'
      ).join('')+'</ul></div>';
  }
  html+=helpNote('What do these mean?',
    '<b>Sub-assembly not grouped as a bundle</b> — this item has its own recipe (so it\'s a sub-assembly, not a raw part) but no price of its own (no Standard Cost, pack price, price breaks, PO/receipt history, or link cost). So instead of showing as one bundle-priced line, every component underneath needs its own price. If this should be one bundle price, open it on the Items tab and set a Standard Cost, pack price, or price breaks directly on it.<br><br>'+
    '<b>Same name, multiple entries</b> — these look like duplicates. Pick which one to keep, move any real data (on-hand, notes, links) onto it, then delete the rest from the Items tab.<br><br>'+
    '<b>Bundled in one place, listed separately in another</b> — this part is already covered by a bundle price under one product, but also shows up needing its own price under another. If it\'s really the same physical part, remove the separate line or fold it into the bundle; if it\'s legitimately priced separately for that other product, no action needed.'
  );
  return html;
}

    '<div class="card"><div class="card-head"><h3>Purchase order statuses</h3></div><div class="card-body">'+

      '<div class="toolbar no-print"><input id="new-status-input" placeholder="New status name" style="width:220px"><button class="btn sm" id="add-status-btn">+ Add</button></div>'+
      helpNote('How does this work?', 'These are the status options available on each Purchase Order. The <b>last one in this list</b> is treated as "received / closed" — hitting "Receive" on a PO sets it to that status and adds its quantities to stock.')+
    '</div></div>'+
    '<div class="card"><div class="card-head"><h3>Item categories</h3></div><div class="card-body">'+
      '<div id="item-group-list"></div>'+
      '<div class="toolbar no-print"><input id="new-item-group-input" placeholder="New category name" style="width:220px"><button class="btn sm" id="add-item-group-btn">+ Add</button></div>'+

    '</div></div>';
  document.getElementById('export-data').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});

  });
  document.getElementById('import-data').addEventListener('click',()=>document.getElementById('import-file').click());
  document.getElementById('import-file').addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=()=>{ try{ DB=migrateToV2(JSON.parse(reader.result)); ensureShape(); save(); runMRP(); renderTab(currentTab); renderCounts(); alertModal('Import complete.'); }catch(err){ alertModal('Could not read that file as JSON.'); } };
    reader.readAsText(f);
  });
  document.getElementById('reset-sample').addEventListener('click',()=>{
    confirmModal('Reset all MRP data to the sample starting point? This cannot be undone.', ()=>{
      DB=sample(); ensureShape(); save(); runMRP(); renderTab(currentTab); renderCounts();
    }, {okLabel:'Reset'});
  });
  wireDocsSettingsCard();
  renderStatusList();
  document.getElementById('add-status-btn').addEventListener('click',()=>{
    const inp=document.getElementById('new-status-input');

  document.getElementById('add-item-group-btn').addEventListener('click',()=>{
    const inp=document.getElementById('new-item-group-input');

    inp.value=''; save(); renderItemGroupList();
  });
}

/* ---------------- Collapsible sidebar groups ----------------
   Pure UI preference, not app data — kept in localStorage rather than DB so it's not part
   of export/import backups. Undefined/missing = expanded (matches the old always-open look). */
const NAV_STATE_KEY='dragon-seats-mrp-navstate-v1';
function loadNavState(){ try{ return JSON.parse(localStorage.getItem(NAV_STATE_KEY))||{}; }catch(e){ return {}; } }
function saveNavState(){ try{ localStorage.setItem(NAV_STATE_KEY, JSON.stringify(navState)); }catch(e){} }
let navState=loadNavState();
const TAB_GROUP={items:'catalog',bom:'catalog',suppliers:'catalog',demand:'planning',plan:'planning'};
function applyNavState(){
  ['catalog','planning'].forEach(g=>{
    const expanded=navState[g]!==false;
    const sub=document.querySelector('.sb-subgroup[data-group="'+g+'"]');
    const toggle=document.querySelector('.sb-group-toggle[data-group="'+g+'"]');

function toggleNavGroup(g){
