  saveNavState();
  applyNavState();
}

/* ---------------- Shipments ----------------
   Tracks material shipments in both directions:
   - inbound: deliveries coming to us (FedEx, UPS, freight, supplier drop-off...)
   - outbound: parts we ship or drop off at a manufacturer
   Data lives in DB.shipments (saved + exported with everything else).
   Row filters and visible columns are per-browser view preferences (localStorage). */
const SHIP_METHODS=['FedEx','UPS','USPS','Freight / LTL','We dropped off','They dropped off','We picked up','Other'];
const SHIP_STATUSES=['Scheduled','In transit','Delivered','Cancelled'];
const SHIP_CONDITIONS=['','OK','Damaged','Short','Damaged & short'];
const SHIP_DIRECTIONS=[['inbound','Inbound'],['outbound','Outbound']];
/* [key, header label, default visible] — order here is column order in the table. */
const SHIP_COLUMNS=[
  ['direction','Direction',true],
  ['method','Method',true],
  ['company','Company',true],
  ['contents','What’s shipping',true],
  ['contact','Contact',true],
  ['phone','Phone / email',false],
  ['address','Address',true],
  ['shipDate','Ship / drop date',true],
  ['deliveryDate','Delivery date',true],
  ['price','Price',true],
  ['tracking','Tracking #',true],
  ['po','Linked PO',false],
  ['receivedBy','Received by',false],
  ['packages','Packages / weight',false],
  ['condition','Condition',false],
  ['docs','Files',false],
  ['status','Status',true],
  ['notes','Notes',false]
];
const SHIP_PREFS_KEY='dragon-seats-mrp-shipments-view';

function normalizeShipment(sh){
  if(sh.direction!=='outbound') sh.direction='inbound';
  ['method','supplierId','clientId','companyName','contact','phone','email','address','shipDate','expectedDate','deliveredDate','tracking','poId','contents','notes','receivedBy','packages','weight','condition'].forEach(k=>{
    if(typeof sh[k]!=='string') sh[k]= (sh[k]==null?'':String(sh[k]));
  });
  if(!sh.method) sh.method='FedEx';
  if(!SHIP_STATUSES.includes(sh.status)) sh.status='Scheduled';
  if(sh.price===undefined || sh.price==='' ) sh.price=null;
  if(sh.price!=null) sh.price=Number(sh.price)||0;
  if(!SHIP_CONDITIONS.includes(sh.condition)) sh.condition='';
  if(!Array.isArray(sh.docs)) sh.docs=[];
  if(!sh.createdAt) sh.createdAt=new Date().toISOString();
}
function shipPackagesText(sh){ return [sh.packages, sh.weight].filter(Boolean).join(' · '); }
function shipmentById(id){ return (DB.shipments||[]).find(s=>s.id===id); }
/* Clients (customers we ship to). Kept in DB.clients; created from the shipment form. */
function clientById(id){ return (DB.clients||[]).find(c=>c.id===id); }
function shipCompanyName(sh){
  const sup=sh.supplierId?supplierById(sh.supplierId):null;
  if(sup) return sup.name||'';
  const cl=sh.clientId?clientById(sh.clientId):null;
  if(cl) return cl.name||'';
  return sh.companyName||'';
}
function shipCompanyKey(sh){ return sh.supplierId || (sh.clientId?'client:'+sh.clientId:'__other'); }
function shipDeliveryDate(sh){ return sh.deliveredDate || sh.expectedDate || ''; }
function shipIsLate(sh){
  return sh.status!=='Delivered' && sh.status!=='Cancelled' && !sh.deliveredDate && sh.expectedDate && sh.expectedDate<todayISO();
}
function shipTrackingUrl(sh){
  const t=(sh.tracking||'').trim(); if(!t) return '';
  const e=encodeURIComponent(t);
  if(sh.method==='FedEx') return 'https://www.fedex.com/fedextrack/?trknbr='+e;
  if(sh.method==='UPS') return 'https://www.ups.com/track?tracknum='+e;
  if(sh.method==='USPS') return 'https://tools.usps.com/go/TrackConfirmAction?tLabels='+e;
  return '';
}

/* ---- view preferences (filters + visible columns), remembered in this browser ---- */
function shipDefaultPrefs(){
  return {
    q:'', direction:[], method:[], status:[], supplier:[],
    dateField:'shipDate', from:'', to:'',
    cols:SHIP_COLUMNS.filter(c=>c[2]).map(c=>c[0]),
    sortKey:'shipDate', sortDir:'desc'
  };
}
function loadShipPrefs(){
  const d=shipDefaultPrefs();
  try{
    const saved=JSON.parse(localStorage.getItem(SHIP_PREFS_KEY)||'null');
    if(saved && typeof saved==='object'){
      Object.keys(d).forEach(k=>{ if(saved[k]!==undefined && typeof saved[k]===typeof d[k] && Array.isArray(saved[k])===Array.isArray(d[k])) d[k]=saved[k]; });
    }
  }catch(e){}
  d.cols=d.cols.filter(k=>SHIP_COLUMNS.some(c=>c[0]===k));
  return d;
}
function saveShipPrefs(){ try{ localStorage.setItem(SHIP_PREFS_KEY, JSON.stringify(shipView)); }catch(e){} }
let shipView=loadShipPrefs();
function shipFiltersActive(){
  return !!(shipView.q.trim() || shipView.direction.length || shipView.method.length || shipView.status.length || shipView.supplier.length || shipView.from || shipView.to);
}

/* Generic multi-select checkbox dropdown (same look as the Documents supplier filter).
   An empty selection means "all". */
function shipCheckDropdownHtml(id, title, options, selected, allLabel, extraCls){
  const n=selected.length;
  const label= n===0 ? title+': All' : n===1 ? title+': '+((options.find(o=>o[0]===selected[0])||[])[1]||'1') : title+': '+n;
  return '<details class="filter-dropdown'+(n?' is-on':'')+(extraCls?' '+extraCls:'')+'" id="'+id+'">'+
    '<summary>'+escAttr(label)+'</summary>'+
    '<div class="filter-options">'+
      '<label class="filter-opt"><input type="checkbox" class="filter-all-cb" '+(n===0?'checked':'')+'> '+escAttr(allLabel||'All')+'</label>'+
      '<div class="filter-opt-divider"></div>'+
      (options.length ? options.map(o=>'<label class="filter-opt"><input type="checkbox" class="filter-opt-cb" value="'+escAttr(o[0])+'" '+(selected.includes(o[0])?'checked':'')+'> '+escAttr(o[1])+'</label>').join('') : '<div class="note" style="padding:5px 8px">Nothing to filter yet.</div>')+
    '</div>'+
  '</details>';
}
function wireShipCheckDropdown(id, key){
  const dd=document.getElementById(id); if(!dd) return;
  const reopen=()=>{ renderShipments(); const nd=document.getElementById(id); if(nd) nd.open=true; };
  const allCb=dd.querySelector('.filter-all-cb');
  if(allCb) allCb.addEventListener('change',e=>{
    if(e.target.checked){ shipView[key]=[]; saveShipPrefs(); reopen(); } else e.target.checked=true;
  });
  dd.querySelectorAll('.filter-opt-cb').forEach(cb=>cb.addEventListener('change',()=>{
    shipView[key]=[...dd.querySelectorAll('.filter-opt-cb:checked')].map(c=>c.value);
    saveShipPrefs(); reopen();
  }));
}

function shipFilteredRows(){
  const v=shipView, q=v.q.trim().toLowerCase();
  return (DB.shipments||[]).filter(sh=>{
    if(v.direction.length && !v.direction.includes(sh.direction)) return false;
    if(v.method.length && !v.method.includes(sh.method)) return false;
    if(v.status.length){
      const st = shipIsLate(sh) ? ['Late', sh.status] : [sh.status];
      if(!st.some(x=>v.status.includes(x))) return false;
    }
    if(v.supplier.length && !v.supplier.includes(shipCompanyKey(sh))) return false;
    if(v.from || v.to){
      const d = v.dateField==='deliveryDate' ? shipDeliveryDate(sh) : sh.shipDate;
      if(!d) return false;
      if(v.from && d<v.from) return false;
      if(v.to && d>v.to) return false;
    }
    if(q){
      const po=sh.poId?poById(sh.poId):null;
      const hay=[shipCompanyName(sh), sh.contact, sh.phone, sh.email, sh.address, sh.tracking, sh.contents, sh.notes, sh.method, sh.status, sh.receivedBy, sh.condition, (sh.docs||[]).map(d=>d.name).join(' '), po?po.poNumber:''].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function shipSortValue(sh, key){
  switch(key){
    case 'company': return shipCompanyName(sh).toLowerCase();
    case 'deliveryDate': return shipDeliveryDate(sh);
    case 'price': return sh.price==null ? -Infinity : Number(sh.price);
    case 'po': { const po=sh.poId?poById(sh.poId):null; return po?(po.poNumber||''):''; }
    case 'phone': return (sh.phone||sh.email||'').toLowerCase();
    case 'docs': return (sh.docs||[]).length;
    case 'packages': return shipPackagesText(sh).toLowerCase();
    default: return String(sh[key]||'').toLowerCase();
  }
}

function shipCellHtml(sh, key){
  switch(key){
    case 'direction': return sh.direction==='outbound' ? '<span class="ship-dir out">Outbound</span>' : '<span class="ship-dir in">Inbound</span>';
    case 'method': return escAttr(sh.method);
    case 'company': { const n=(sh.docs||[]).length; return escAttr(shipCompanyName(sh)||'—')+(n?'<span class="ship-clip" title="'+n+' file'+(n===1?'':'s')+' attached">📎'+(n>1?n:'')+'</span>':''); }
    case 'contents': return escAttr(sh.contents||'—');
    case 'contact': return escAttr(sh.contact||'—');
    case 'phone': return escAttr([sh.phone,sh.email].filter(Boolean).join(' · ')||'—');
    case 'address': return escAttr(sh.address||'—');
    case 'shipDate': return fmtDate(sh.shipDate);
    case 'deliveryDate':
      if(sh.deliveredDate) return fmtDate(sh.deliveredDate)+'<span class="ship-sub">delivered</span>';
      if(sh.expectedDate) return fmtDate(sh.expectedDate)+'<span class="ship-sub">expected</span>';
      return '—';
    case 'price': return sh.price==null ? '—' : money(sh.price);
    case 'tracking': {
      if(!sh.tracking) return '—';
      const u=shipTrackingUrl(sh);
      return u ? '<a href="'+escAttr(u)+'" target="_blank" rel="noopener" class="ship-track-link">'+escAttr(sh.tracking)+'</a>' : escAttr(sh.tracking);
    }
    case 'po': { const po=sh.poId?poById(sh.poId):null; return po ? escAttr(po.poNumber||'(PO, no number)') : '—'; }
    case 'status': {
      if(shipIsLate(sh)) return '<span class="status-badge ship-late" style="margin-left:0">Late</span>';
      const cls = sh.status==='Delivered'?'closed':sh.status==='In transit'?'ship-transit':sh.status==='Cancelled'?'cancelled':'open';
      return '<span class="status-badge '+cls+'" style="margin-left:0">'+escAttr(sh.status)+'</span>';
    }
    case 'notes': return escAttr(sh.notes||'—');
    case 'receivedBy': return escAttr(sh.receivedBy||'—');
    case 'packages': return escAttr(shipPackagesText(sh)||'—');
    case 'condition': return sh.condition ? '<span class="status-badge '+(sh.condition==='OK'?'closed':'ship-cond-bad')+'" style="margin-left:0">'+escAttr(sh.condition)+'</span>' : '—';
    case 'docs': { const d=sh.docs||[]; return d.length ? '<span class="ship-docs-cell">'+docChips(d)+'</span>' : '—'; }
  }
  return '';
}
function shipCellText(sh, key){
  switch(key){
    case 'direction': return sh.direction==='outbound'?'Outbound':'Inbound';
    case 'company': return shipCompanyName(sh);
    case 'phone': return [sh.phone,sh.email].filter(Boolean).join(' / ');
    case 'shipDate': return sh.shipDate?fmtDate(sh.shipDate):'';
    case 'deliveryDate': return sh.deliveredDate?fmtDate(sh.deliveredDate)+' (delivered)':sh.expectedDate?fmtDate(sh.expectedDate)+' (expected)':'';
    case 'price': return sh.price==null?'':money(sh.price);
    case 'po': { const po=sh.poId?poById(sh.poId):null; return po?(po.poNumber||'PO'):''; }
    case 'status': return shipIsLate(sh)?'Late':sh.status;
    case 'packages': return shipPackagesText(sh);
    case 'docs': return (sh.docs||[]).map(d=>d.name).join(', ');
    default: return String(sh[key]||'');
  }
}

function renderShipments(){
  const el=document.getElementById('panel-shipments'); if(!el) return;
  const v=shipView;
  const all=DB.shipments||[];
  const rows=shipFilteredRows();
  const dir=v.sortDir==='asc'?1:-1;
  rows.sort((a,b)=>{
    const x=shipSortValue(a,v.sortKey), y=shipSortValue(b,v.sortKey);
    if(x<y) return -1*dir; if(x>y) return 1*dir;
    return (b.createdAt||'').localeCompare(a.createdAt||'');
  });
  const cols=SHIP_COLUMNS.filter(c=>v.cols.includes(c[0]));
  const totalPrice=round2(rows.reduce((s,sh)=>s+(sh.price==null?0:Number(sh.price)),0));
  const supplierOpts=DB.suppliers.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(s=>[s.id,s.name||'(unnamed)']);
  (DB.clients||[]).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'')).forEach(c=>supplierOpts.push(['client:'+c.id,(c.name||'(unnamed)')+' (client)']));
  if(all.some(sh=>!sh.supplierId && !sh.clientId)) supplierOpts.push(['__other','One-off (not in a list)']);
  const usedMethods=SHIP_METHODS.concat(all.map(sh=>sh.method).filter(m=>m && !SHIP_METHODS.includes(m)));
  const uniqMethods=[...new Set(usedMethods)];

  document.getElementById('page-actions').innerHTML='<button class="btn accent" id="add-shipment">+ New shipment</button>';
  el.innerHTML=
    '<div class="toolbar no-print">'+
      '<div class="search-input"><input type="text" id="ship-search" placeholder="Search company, tracking, address..." value="'+escAttr(v.q)+'"></div>'+
      shipCheckDropdownHtml('ship-f-direction','Direction',SHIP_DIRECTIONS,v.direction,'Both directions')+
      shipCheckDropdownHtml('ship-f-method','Method',uniqMethods.map(m=>[m,m]),v.method,'All methods')+
      shipCheckDropdownHtml('ship-f-status','Status',SHIP_STATUSES.map(s=>[s,s]).concat([['Late','Late (past expected date)']]),v.status,'All statuses')+
      shipCheckDropdownHtml('ship-f-supplier','Company',supplierOpts,v.supplier,'All companies')+
    '</div>'+
    '<div class="toolbar no-print">'+
      '<span class="ship-date-range">'+
        '<select id="ship-date-field" title="Which date the range applies to">'+
          '<option value="shipDate"'+(v.dateField==='shipDate'?' selected':'')+'>Ship / drop date</option>'+
          '<option value="deliveryDate"'+(v.dateField==='deliveryDate'?' selected':'')+'>Delivery date</option>'+
        '</select>'+
        'from <input type="date" id="ship-from" value="'+escAttr(v.from)+'"> to <input type="date" id="ship-to" value="'+escAttr(v.to)+'">'+
      '</span>'+
      (shipFiltersActive()?'<button class="btn sm subtle" id="ship-clear">Clear filters</button>':'')+
      '<div class="toolbar-spacer"></div>'+
      '<span class="toolbar-count">'+rows.length+(rows.length!==all.length?' of '+all.length:'')+' shipment'+(all.length===1?'':'s')+'</span>'+
      '<details class="filter-dropdown dd-right" id="ship-cols"><summary>Columns: '+cols.length+' of '+SHIP_COLUMNS.length+'</summary><div class="filter-options">'+
        SHIP_COLUMNS.map(c=>'<label class="filter-opt"><input type="checkbox" class="ship-col-cb" value="'+c[0]+'" '+(v.cols.includes(c[0])?'checked':'')+'> '+escAttr(c[1])+'</label>').join('')+
        '<div class="filter-opt-divider"></div><button class="btn sm subtle" id="ship-cols-reset" style="width:100%">Reset to default</button>'+
      '</div></details>'+
      '<button class="btn" id="ship-export">Export PDF</button>'+
    '</div>'+
    '<div class="card"><div class="card-body" style="padding:0">'+
    (rows.length
      ? '<div class="ship-table-wrap"><table class="list-table ship-table"><thead><tr>'+
          cols.map(c=>'<th data-sort="'+c[0]+'"'+(c[0]==='price'?' class="num"':'')+'>'+escAttr(c[1])+(v.sortKey===c[0]?'<span class="sort-ind">'+(v.sortDir==='asc'?'▲':'▼')+'</span>':'')+'</th>').join('')+
        '</tr></thead><tbody>'+
        rows.map(sh=>'<tr class="list-row" data-id="'+escAttr(sh.id)+'">'+
          cols.map(c=>'<td'+(c[0]==='price'?' class="num mono"':(c[0]==='address'||c[0]==='contents'||c[0]==='notes'||c[0]==='docs')?' class="wrap"':(c[0]==='shipDate'||c[0]==='deliveryDate')?' class="mono"':'')+'>'+shipCellHtml(sh,c[0])+'</td>').join('')+
        '</tr>').join('')+
        '</tbody></table></div>'+
        '<div class="ship-total-line"><span>'+rows.length+' shown</span><span>Total shipping cost shown: <b class="mono">'+money(totalPrice)+'</b></span></div>'
      : '<div class="empty-state"><div class="empty-icon">&#9992;</div><div class="empty-title">'+(all.length?'No shipments match these filters':'No shipments yet')+'</div><div class="empty-sub">'+(all.length?'Try clearing a filter or the date range.':'Add a FedEx delivery or a drop-off with + New shipment.')+'</div></div>')+
    '</div></div>';

  document.getElementById('add-shipment').addEventListener('click',()=>openShipmentModal(null));
  const s=document.getElementById('ship-search');
  s.addEventListener('input',e=>{ const pos=e.target.selectionStart; v.q=e.target.value; saveShipPrefs(); renderShipments(); refocusSearch('ship-search',pos); });
  wireShipCheckDropdown('ship-f-direction','direction');
  wireShipCheckDropdown('ship-f-method','method');
  wireShipCheckDropdown('ship-f-status','status');
  wireShipCheckDropdown('ship-f-supplier','supplier');
  document.getElementById('ship-date-field').addEventListener('change',e=>{ v.dateField=e.target.value; saveShipPrefs(); renderShipments(); });
  document.getElementById('ship-from').addEventListener('change',e=>{ v.from=e.target.value; saveShipPrefs(); renderShipments(); });
  document.getElementById('ship-to').addEventListener('change',e=>{ v.to=e.target.value; saveShipPrefs(); renderShipments(); });
  const clr=document.getElementById('ship-clear');
  if(clr) clr.addEventListener('click',()=>{ Object.assign(v,{q:'',direction:[],method:[],status:[],supplier:[],from:'',to:''}); saveShipPrefs(); renderShipments(); });
  const colsDd=document.getElementById('ship-cols');
  colsDd.querySelectorAll('.ship-col-cb').forEach(cb=>cb.addEventListener('change',()=>{
    const picked=[...colsDd.querySelectorAll('.ship-col-cb:checked')].map(c=>c.value);
    if(!picked.length){ cb.checked=true; return; } // always keep at least one column
    v.cols=picked; saveShipPrefs(); renderShipments();
    const nd=document.getElementById('ship-cols'); if(nd) nd.open=true;
  }));
  document.getElementById('ship-cols-reset').addEventListener('click',()=>{
    v.cols=shipDefaultPrefs().cols; saveShipPrefs(); renderShipments();
    const nd=document.getElementById('ship-cols'); if(nd) nd.open=true;
  });
  el.querySelectorAll('.ship-table th[data-sort]').forEach(th=>th.addEventListener('click',()=>{
    const k=th.dataset.sort;
    if(v.sortKey===k) v.sortDir = v.sortDir==='asc'?'desc':'asc';
    else { v.sortKey=k; v.sortDir = (k==='shipDate'||k==='deliveryDate'||k==='price')?'desc':'asc'; }
    saveShipPrefs(); renderShipments();
  }));
  el.querySelectorAll('.ship-track-link, .ship-docs-cell a.doc-chip').forEach(a=>a.addEventListener('click',e=>e.stopPropagation()));
  el.querySelectorAll('.ship-table tr.list-row').forEach(tr=>tr.addEventListener('click',()=>openShipmentModal(shipmentById(tr.dataset.id))));
  document.getElementById('ship-export').addEventListener('click',()=>{
    const head=cols.map(c=>c[1]);
    const body=rows.map(sh=>cols.map(c=>shipCellText(sh,c[0])));
    const priceIdx=cols.findIndex(c=>c[0]==='price');
    if(priceIdx>=0 && rows.length) body.push(cols.map((c,i)=>i===0?'TOTAL':i===priceIdx?money(totalPrice):''));
    exportTablePDF('Dragon Seats - Shipments', head.map(pdfSafe), body.map(r=>r.map(pdfSafe)), {rightCols:priceIdx>=0?[priceIdx]:[]});
  });
}

function rerenderAfterShipmentChange(){
  if(currentTab==='suppliers') renderSuppliers();
  else if(currentTab==='dash') renderDash();
  else renderShipments();
}
function openShipmentModal(existing, preset){
  const sh=existing ? Object.assign({},existing) : Object.assign({direction:'inbound', method:'FedEx', status:'Scheduled', shipDate:todayISO(), price:null}, preset||{});
  if(!existing && sh.clientId){ const pc=clientById(sh.clientId); if(pc){ sh.direction='outbound'; ['contact','phone','email','address'].forEach(k=>{ if(!sh[k]) sh[k]=pc[k]||''; }); } }
  const isOther = existing ? (!sh.supplierId && !sh.clientId) : false;
  let shipDocs=(existing && Array.isArray(existing.docs)) ? existing.docs.slice() : [];
  const f=(id,label,inner,wide)=>'<div class="sup-form-field'+(wide?' wide':'')+'"><label for="'+id+'">'+label+'</label>'+inner+'</div>';
  const txt=(id,val,ph,type)=>'<input type="'+(type||'text')+'" id="'+id+'" style="width:100%;box-sizing:border-box" placeholder="'+escAttr(ph||'')+'" value="'+escAttr(val==null?'':val)+'">';
  const clientsSorted=(DB.clients||[]).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const supOpts='<option value="">— Choose a client or supplier —</option>'+
    '<optgroup label="Clients">'+
      clientsSorted.map(c=>'<option value="client:'+escAttr(c.id)+'"'+(c.id===sh.clientId?' selected':'')+'>'+escAttr(c.name)+'</option>').join('')+
      '<option value="__newclient">+ New client (type a name)</option>'+
    '</optgroup>'+
    '<optgroup label="Suppliers / manufacturers">'+
      DB.suppliers.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(s=>'<option value="'+escAttr(s.id)+'"'+(s.id===sh.supplierId?' selected':'')+'>'+escAttr(s.name)+'</option>').join('')+
    '</optgroup>'+
    '<option value="__other"'+(isOther?' selected':'')+'>One-off (not saved to a list — type a name)</option>';
  const methodList=[...new Set(SHIP_METHODS.concat(sh.method&&!SHIP_METHODS.includes(sh.method)?[sh.method]:[]))];
  openModal(existing?'Edit shipment':'New shipment',
    '<div class="sup-form">'+
      '<div class="sup-form-field wide"><label>Direction</label><div class="ship-dir-toggle">'+
        '<label class="'+(sh.direction==='inbound'?'on':'')+'"><input type="radio" name="ship-dir" value="inbound"'+(sh.direction==='inbound'?' checked':'')+'><span><b>Inbound</b><small>Materials coming to us</small></span></label>'+
        '<label class="'+(sh.direction==='outbound'?'on':'')+'"><input type="radio" name="ship-dir" value="outbound"'+(sh.direction==='outbound'?' checked':'')+'><span><b>Outbound</b><small>We ship / drop off to a manufacturer</small></span></label>'+
      '</div></div>'+
      f('ship-m-method','Method','<select id="ship-m-method" style="width:100%">'+methodList.map(m=>'<option'+(m===sh.method?' selected':'')+'>'+escAttr(m)+'</option>').join('')+'</select>')+
      f('ship-m-status','Status','<select id="ship-m-status" style="width:100%">'+SHIP_STATUSES.map(s=>'<option'+(s===sh.status?' selected':'')+'>'+s+'</option>').join('')+'</select>')+
      f('ship-m-supplier','<span id="ship-m-company-label">'+(sh.direction==='outbound'?'Shipping to':'Coming from')+'</span>','<select id="ship-m-supplier" style="width:100%">'+supOpts+'</select>', true)+
      '<div class="sup-form-field wide'+(isOther?'':' hidden')+'" id="ship-m-company-wrap"><label for="ship-m-company" id="ship-m-company-lbl">Company name</label>'+txt('ship-m-company',sh.companyName,'e.g. Local powder coater')+'</div>'+
      f('ship-m-contact','Contact',txt('ship-m-contact',sh.contact,'Contact person'))+
      f('ship-m-phone','Phone',txt('ship-m-phone',sh.phone,'(555) 555-5555'))+
      f('ship-m-email','Email',txt('ship-m-email',sh.email,'name@company.com'), true)+
      f('ship-m-address','Address',txt('ship-m-address',sh.address,'Street, City, State ZIP'), true)+
      f('ship-m-contents','What’s shipping',txt('ship-m-contents',sh.contents,'Type anything, or add items from your list below')+
        '<div class="ship-pick-row no-print"><input type="text" list="ship-m-itemlist" id="ship-m-pick" placeholder="Pick an item from your list (or type one)…">'+
        '<input type="number" id="ship-m-pick-qty" min="0" step="any" placeholder="Qty">'+
        '<button type="button" class="btn sm" id="ship-m-pick-add">+ Add</button></div>'+
        '<datalist id="ship-m-itemlist">'+DB.items.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(i=>'<option value="'+escAttr(i.name||'')+'">'+(i.isProduct?'Product':escAttr(i.category||'Item'))+'</option>').join('')+'</datalist>', true)+
      f('ship-m-shipDate','Ship / drop-off date',txt('ship-m-shipDate',sh.shipDate,'','date'))+
      f('ship-m-price','Price ($)',txt('ship-m-price',sh.price==null?'':sh.price,'0.00','number'))+
      f('ship-m-expectedDate','Expected delivery',txt('ship-m-expectedDate',sh.expectedDate,'','date'))+
      f('ship-m-deliveredDate','Delivered on',txt('ship-m-deliveredDate',sh.deliveredDate,'','date'))+
      f('ship-m-tracking','Tracking #',txt('ship-m-tracking',sh.tracking,'Optional'))+
      f('ship-m-po','Linked PO (optional)','<select id="ship-m-po" style="width:100%"></select>')+
      f('ship-m-receivedBy','Received / signed by',txt('ship-m-receivedBy',sh.receivedBy,'Who signed for it'))+
      f('ship-m-condition','Condition on arrival','<select id="ship-m-condition" style="width:100%">'+SHIP_CONDITIONS.map(c=>'<option value="'+escAttr(c)+'"'+(c===(sh.condition||'')?' selected':'')+'>'+(c||'—')+'</option>').join('')+'</select>')+
      f('ship-m-packages','Packages / pallets',txt('ship-m-packages',sh.packages,'e.g. 3 boxes, 1 pallet'))+
      f('ship-m-weight','Weight',txt('ship-m-weight',sh.weight,'e.g. 420 lb'))+
      f('ship-m-notes','Notes','<textarea id="ship-m-notes" rows="2" style="width:100%;box-sizing:border-box" placeholder="—">'+escAttr(sh.notes||'')+'</textarea>', true)+
      '<div class="sup-form-field wide"><label>Receipts &amp; files</label><div class="ship-docs-box">'+
        '<div class="dropzone-mini file-btn" id="ship-m-drop"><span id="ship-m-docs"></span><label class="btn sm no-print">+ Add file<input type="file" id="ship-m-file" multiple style="position:absolute;opacity:0;width:1px;height:1px"></label><span class="note">Shipping receipt, BOL, packing slip, delivery photos — or drop files here</span></div>'+
        '<div class="ship-po-docs" id="ship-m-po-docs"></div>'+
      '</div></div>'+
    '</div>'+
    '<div class="toolbar" style="margin-top:16px">'+
      (existing?'<button class="btn subtle danger" id="ship-m-delete">Delete shipment</button>':'')+
      '<div class="toolbar-spacer"></div><button class="btn" id="ship-m-cancel">Cancel</button><button class="btn accent" id="ship-m-save">Save</button></div>',
    {wide:true});
  const $=id=>document.getElementById(id);
  $('ship-m-price').step='0.01'; $('ship-m-price').min='0';
  // Direction toggle styling + label
  document.querySelectorAll('input[name="ship-dir"]').forEach(r=>r.addEventListener('change',()=>{
    document.querySelectorAll('.ship-dir-toggle label').forEach(l=>l.classList.toggle('on', l.querySelector('input').checked));
    $('ship-m-company-label').textContent = r.value==='outbound'?'Shipping to':'Coming from';
  }));
  // Linked-PO choices follow the chosen supplier (all POs when none chosen)
  const fillPoOptions=()=>{
    const supId=$('ship-m-supplier').value;
    const pos=DB.purchaseOrders.filter(p=>!p.cancelled && (!supId || supId==='__other' || supId==='__newclient' || supId.startsWith('client:') || p.supplierId===supId || p.id===sh.poId))
      .slice().sort((a,b)=>(b.orderDate||'').localeCompare(a.orderDate||''));
    const cur=$('ship-m-po').value || sh.poId || '';
    $('ship-m-po').innerHTML='<option value="">None</option>'+pos.map(p=>'<option value="'+escAttr(p.id)+'"'+(p.id===cur?' selected':'')+'>'+escAttr((p.poNumber||'(no number)')+' · '+((supplierById(p.supplierId)||{}).name||'No supplier')+(p.orderDate?' · '+fmtDate(p.orderDate):''))+'</option>').join('');
  };
  fillPoOptions();
  // ---- attached files (receipts, BOL, photos...) ----
  const renderShipDocs=()=>{
    const box=$('ship-m-docs'); if(!box) return;
    box.innerHTML = shipDocs.length ? shipDocs.map((d,i)=>'<span class="ship-doc-wrap">'+docChips([d])+'<button type="button" class="ship-doc-x" data-i="'+i+'" title="Remove from this shipment (the file stays in Drive)">×</button></span>').join('') : '<span class="note">no files</span>';
    box.querySelectorAll('.ship-doc-x').forEach(b=>b.addEventListener('click',e=>{ e.preventDefault(); shipDocs.splice(Number(b.dataset.i),1); renderShipDocs(); }));
  };
  const renderPoDocs=()=>{
    const box=$('ship-m-po-docs'); if(!box) return;
    const po=$('ship-m-po').value?poById($('ship-m-po').value):null;
    if(!po){ box.innerHTML=''; return; }
    const poDocs=(po.docs||[]);
    const recDocs=(DB.receipts||[]).filter(r=>r.poId===po.id && !r.cancelled).reduce((a,r)=>a.concat(r.docs||[]),[]);
    box.innerHTML = (poDocs.length||recDocs.length)
      ? 'Files on linked PO '+escAttr(po.poNumber||'')+':<br>'+(poDocs.length?docChips(poDocs):'')+(recDocs.length?docChips(recDocs):'')
      : 'Linked PO '+escAttr(po.poNumber||'')+' has no files attached.';
  };
  renderShipDocs(); renderPoDocs();
  $('ship-m-po').addEventListener('change',renderPoDocs);
  enableFileDrop($('ship-m-drop'), $('ship-m-file'));
  $('ship-m-file').addEventListener('change', async e=>{
    const files=[...(e.target.files||[])]; if(!files.length) return;
    const supVal=$('ship-m-supplier').value;
    const metaRec={supplierId: (supVal==='__other'||supVal==='__newclient'||supVal.startsWith('client:'))?'':supVal,
      clientId: supVal.startsWith('client:')?supVal.slice(7):'',
      companyName: (supVal==='__other'||supVal==='__newclient')?$('ship-m-company').value.trim():'',
      shipDate:$('ship-m-shipDate').value, deliveredDate:$('ship-m-deliveredDate').value, expectedDate:$('ship-m-expectedDate').value,
      tracking:$('ship-m-tracking').value.trim(), method:$('ship-m-method').value};
    const box=$('ship-m-docs'); if(box) box.insertAdjacentHTML('beforeend','<span class="note ship-saving"> saving…</span>');
    for(const f of files){ try{ shipDocs.push(await attachFileTo('shipments', metaRec, f)); }catch(err){ console.warn('[dragon-seats] shipment file attach failed', err); } }
    e.target.value='';
    renderShipDocs();
  });
  // Picking a supplier fills contact, phone, email and address from the Suppliers list (still editable)
  $('ship-m-supplier').addEventListener('change',e=>{
    const val=e.target.value;
    const typed = val==='__other' || val==='__newclient';
    $('ship-m-company-wrap').classList.toggle('hidden', !typed);
    $('ship-m-company-lbl').textContent = val==='__newclient' ? 'New client name' : 'Company name';
    $('ship-m-company').placeholder = val==='__newclient' ? 'e.g. Smith Racing — saved to your clients list' : 'e.g. Local powder coater';
    if(typed){ $('ship-m-company').focus(); }
    const sup = val.startsWith('client:') ? clientById(val.slice(7)) : (val && !typed) ? supplierById(val) : null;
    if(sup){
      $('ship-m-contact').value=sup.contact||'';
      $('ship-m-phone').value=sup.phone||'';
      $('ship-m-email').value=sup.email||'';
      $('ship-m-address').value=sup.address||'';
    }
    fillPoOptions(); renderPoDocs();
  });
  // Add a listed (or typed) item to "What's shipping" — the text box stays free-form
  const addPicked=()=>{
    const name=$('ship-m-pick').value.trim(); if(!name){ $('ship-m-pick').focus(); return; }
    const q=$('ship-m-pick-qty').value.trim();
    const piece=(q?q+' × ':'')+name;
    const cur=$('ship-m-contents').value.trim();
    $('ship-m-contents').value = cur ? cur+', '+piece : piece;
    $('ship-m-pick').value=''; $('ship-m-pick-qty').value=''; $('ship-m-pick').focus();
  };
  $('ship-m-pick-add').addEventListener('click',addPicked);
  ['ship-m-pick','ship-m-pick-qty'].forEach(id=>$(id).addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addPicked(); } }));
  // Entering a delivered date marks it delivered
  $('ship-m-deliveredDate').addEventListener('change',e=>{ if(e.target.value) $('ship-m-status').value='Delivered'; });

  const commit=()=>{
    const supVal=$('ship-m-supplier').value;
    const typedName=$('ship-m-company').value.trim();
    const companyName=supVal==='__other'?typedName:'';
    if(!supVal || ((supVal==='__other'||supVal==='__newclient') && !typedName)){
      const target= !supVal ? $('ship-m-supplier') : $('ship-m-company');
      target.focus(); target.style.borderColor='var(--red)';
      return;
    }
    const isClient = supVal==='__newclient' || supVal.startsWith('client:');
    let clientId='';
    if(supVal==='__newclient'){
      // Reuse a client with the same name instead of making a duplicate
      let cl=(DB.clients||[]).find(c=>(c.name||'').trim().toLowerCase()===typedName.toLowerCase());
      if(!cl){ cl={id:uid(), name:typedName, contact:'', phone:'', email:'', address:'', createdAt:new Date().toISOString()}; DB.clients.push(cl); }
      clientId=cl.id;
    } else if(supVal.startsWith('client:')) clientId=supVal.slice(7);
    // Remember contact details on the client record so they fill in next time
    const cl=clientId?clientById(clientId):null;
    if(cl){
      [['contact','ship-m-contact'],['phone','ship-m-phone'],['email','ship-m-email'],['address','ship-m-address']].forEach(([k,id])=>{ const v=$(id).value.trim(); if(v) cl[k]=v; });
    }
    const priceRaw=$('ship-m-price').value.trim();
    const target=existing || {id:uid(), createdAt:new Date().toISOString()};
    Object.assign(target,{
      direction:(document.querySelector('input[name="ship-dir"]:checked')||{}).value||'inbound',
      method:$('ship-m-method').value,
      status:$('ship-m-status').value,
      supplierId: (supVal==='__other'||isClient)?'':supVal,
      clientId,
      companyName,
      contact:$('ship-m-contact').value.trim(),
      phone:$('ship-m-phone').value.trim(),
      email:$('ship-m-email').value.trim(),
      address:$('ship-m-address').value.trim(),
      contents:$('ship-m-contents').value.trim(),
      shipDate:$('ship-m-shipDate').value,
      expectedDate:$('ship-m-expectedDate').value,
      deliveredDate:$('ship-m-deliveredDate').value,
      price: priceRaw===''?null:round2(priceRaw),
      tracking:$('ship-m-tracking').value.trim(),
      poId:$('ship-m-po').value,
      notes:$('ship-m-notes').value.trim(),
      receivedBy:$('ship-m-receivedBy').value.trim(),
      condition:$('ship-m-condition').value,
      packages:$('ship-m-packages').value.trim(),
      weight:$('ship-m-weight').value.trim(),
      docs:shipDocs.slice()
    });
    normalizeShipment(target);
    if(!existing) DB.shipments.unshift(target);
    save(); closeModal(); rerenderAfterShipmentChange(); renderCounts();
  };
  $('ship-m-save').addEventListener('click',commit);
  $('ship-m-cancel').addEventListener('click',closeModal);
  const del=$('ship-m-delete');
  if(del) del.addEventListener('click',()=>{
    confirmModal('Delete this shipment'+(shipCompanyName(existing)?' ('+shipCompanyName(existing)+')':'')+'? This cannot be undone.',()=>{
      DB.shipments=DB.shipments.filter(x=>x.id!==existing.id); save(); rerenderAfterShipmentChange(); renderCounts();
    });
  });
  if(!existing) $('ship-m-supplier').focus();
}

/* ---------------- init ---------------- */
let currentTab='dash';
async function init(){
  await load();
  runMRP();
  document.querySelectorAll('.tab[data-tab]').forEach(btn=>{
    btn.addEventListener('click',()=>{ currentTab=btn.dataset.tab; if(currentTab==='docs') openDocRecord(null,null); if(currentTab==='items'){ itemsToolbar.cat=''; selectedItem=null; } setTab(currentTab); renderCounts(); });
  });
  document.querySelectorAll('.sb-group-toggle[data-group]').forEach(btn=>{
    btn.addEventListener('click',()=>{ toggleNavGroup(btn.dataset.group); });
  });
  document.querySelectorAll('.subtab[data-subtab]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const val=btn.dataset.subtab;
      if(val==='recipes'||val==='costing'){ setBomSubTab(val); }
      else{ setDocSubTab(val); }
      renderCounts();
    });
  });
  document.getElementById('add-doc-btn').addEventListener('click', openAddDocumentModal);
  document.addEventListener('click', e=>{ const b=e.target.closest && e.target.closest('.drive-doc'); if(b){ e.preventDefault(); e.stopPropagation(); openDriveDoc(b.dataset.path); } });
  await loadDocsRootInfo();
  document.addEventListener('click', e=>{
    document.querySelectorAll('.filter-dropdown[open]').forEach(dd=>{
      if(!dd.contains(e.target)) dd.open=false;
    });
  });
  setTab('dash');
}
init();
</script>
