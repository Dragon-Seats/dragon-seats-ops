    const delBtn=card.querySelector('.del-item');
    if(delBtn) delBtn.addEventListener('click',()=>{
      confirmModal('Delete '+it.name+'? This also removes it from any BOM lines, links, demand plan rows, and PO lines that reference it.', ()=>{
        deleteItemEverywhere(id);
        selectedItem=null;
        save(); renderItems(); renderCounts();
      });
    });
    enableFileDrop(card.querySelector('.file-btn'), card.querySelector('.item-file'));
    const fileInp=card.querySelector('.item-file');
    if(fileInp) fileInp.addEventListener('change', async e=>{
      const f=e.target.files[0]; if(!f) return;
      it.docs.push(await attachFileTo('item', it, f));
      save(); renderItems();
    });
    const addLinkBtn=card.querySelector('.add-link-here');
    if(addLinkBtn) addLinkBtn.addEventListener('click',()=>{
      it.links=it.links||[]; openItemSections.links=true;
      it.links.push({id:uid(), supplierId:'', cost:0, url:'', phone:'', contactType:'link', notes:''});
      save(); renderItems(); renderCounts();
      setTimeout(()=>{
        const freshCard=document.querySelector('.item-card[data-id="'+id+'"]');
        const rows=freshCard? freshCard.querySelectorAll('.link-row .f-value') : [];

    card.querySelectorAll('.link-row').forEach(row=>{
      const linkId=row.dataset.link;
      const link=(it.links||[]).find(l=>l.id===linkId);
      if(!link) return;
      row.querySelectorAll('.seg-btn').forEach(btn=>{
        btn.addEventListener('click',()=>{
          if(link.contactType===btn.dataset.type) return;

          save(); renderItems();

      const valueInput=row.querySelector('.f-value');
      const goLink=row.querySelector('.link-go');

        if(!goLink) return;
        const href = link.contactType==='phone' ? telHref(v) : orderLinkHref(v);
        if(href){ goLink.href=href; goLink.classList.remove('is-disabled'); goLink.tabIndex=0; goLink.setAttribute('aria-disabled','false'); }
        else{ goLink.href='#'; goLink.classList.add('is-disabled'); goLink.tabIndex=-1; goLink.setAttribute('aria-disabled','true'); }
      };

        save();

      row.querySelector('.f-notes').addEventListener('change',e=>{ link.notes=e.target.value; save(); });
      row.querySelector('.del-link').addEventListener('click',()=>{ it.links=it.links.filter(l=>l.id!==linkId); save(); renderItems(); renderCounts(); });
    });
  });
}

let BOM_EDIT={}; // transient UI state (not saved) — which products are open in edit mode on the Recipes view
/* Unit cost of one item as it appears in a recipe: a sub-assembly with its own (bundle) price
   uses that; otherwise it rolls up from its components. Mirrors the Cost Rollup tab's rules. */
function recipeUnitCost(item, ancestry){
  ancestry=ancestry||[];
  if(!item) return {unit:0, missing:true, bundle:false, label:'Missing item'};
  const cyc=ancestry.indexOf(item.id)!==-1;
  if(item.lines && item.lines.length && !cyc){
    const own=resolvePartCost(item);
    if(own.type!=='none') return {unit:own.cost, missing:false, bundle:true, label:own.label};
    let unit=0, missing=false;
    item.lines.forEach(l=>{
      const c=itemById(l.childId);
      const r=recipeUnitCost(c, ancestry.concat(item.id));
      unit+=r.unit*Number(l.qtyPer||0);
      if(r.missing) missing=true;
    });
    return {unit, missing, bundle:false, label:'Sum of components'};
  }
  const r=resolvePartCost(item);
  return {unit:r.cost, missing:r.type==='none', bundle:false, label:r.type==='none'?'No cost data':r.label};
}
/* Flattens a recipe into display/export rows. mult = how many of the parent are being built. */
function recipeRows(parent, mult, depth, ancestry, insideBundle){
  const rows=[];
  (parent.lines||[]).forEach(line=>{
    const child=itemById(line.childId);
    const qtyPer=Number(line.qtyPer||0);
    const qty=qtyPer*mult;
    if(!child){ rows.push({depth, name:'(deleted item)', qtyPer, qty, uom:'', unit:0, ext:0, missing:true, included:insideBundle, label:''}); return; }
    const cyc=ancestry.indexOf(child.id)!==-1;
    const c=recipeUnitCost(child, ancestry);
    const isAsm=!!(child.lines && child.lines.length && !cyc);
    rows.push({depth, item:child, parentId:parent.id, name:child.name, qtyPer, qty, uom:child.uom||'ea', unit:c.unit, ext:c.unit*qty, missing:c.missing, bundle:c.bundle, isAsm, included:insideBundle, label:c.label});
    if(isAsm) recipeRows(child, qty, depth+1, ancestry.concat(child.id), insideBundle||c.bundle).forEach(r=>rows.push(r));
  });
  return rows;
}
function recipeTotal(product){
  return (product.lines||[]).reduce((s,l)=>s+recipeUnitCost(itemById(l.childId),[product.id]).unit*Number(l.qtyPer||0),0);
}
function recipeMissingCount(product){
  return recipeRows(product,1,0,[product.id],false).filter(r=>r.missing && !r.included && !r.isAsm).length;
}

function renderBomProduct(product){
  const editing=!!BOM_EDIT[product.id];
  const total=recipeTotal(product);
  const missing=recipeMissingCount(product);
  const head='<div class="card-head rcp-head">'+
      (editing
        ? '<h3 style="flex:1"><input class="f-pname" value="'+escAttr(product.name)+'" style="font:inherit;font-weight:600;width:100%"></h3>'
        : '<div><h3>'+escAttr(product.name)+'</h3><div class="note">'+(product.lines||[]).length+' component'+((product.lines||[]).length===1?'':'s')+' · material cost <b class="mono" style="color:var(--ink)">'+money(total)+'</b> / unit</div></div>')+
      '<div class="row-actions no-print">'+
        (editing
          ? '<button class="btn sm danger del-product">Delete product</button><button class="btn sm accent bom-done-edit">Done</button>'
          : '<button class="btn sm bom-export-one">Export</button><button class="btn sm bom-start-edit">Edit recipe</button>')+
      '</div></div>';
  if(editing){
    return '<div class="card bom-detail-card" data-id="'+product.id+'">'+head+
      '<div class="card-body">'+
        '<div class="bom-col-head"><span>Component</span><span>Qty / unit</span><span>Supplier link</span><span></span></div>'+
        renderBomLines(product, [product.id])+'</div></div>';
  }
  const rows=recipeRows(product,1,0,[product.id],false);
  const list = rows.length ? rows.map(r=>{
    if(r.depth>0 && r.parentId && isRecipeNestCollapsed(rows, r)) return '';
    const key=(r.parentId||'')+'::'+(r.item?r.item.id:'');
    const toggle = r.isAsm ? '<button type="button" class="rcp-toggle'+(collapsedBomNests[key]?' is-collapsed':'')+'" data-key="'+escAttr(key)+'">▾</button>' : '<span class="rcp-toggle-sp"></span>';
    const price = r.included
      ? '<span class="rcp-unit">incl.</span><span class="rcp-ext"></span>'
      : r.missing && !r.isAsm
        ? '<span class="rcp-unit rcp-missing">no price</span><span class="rcp-ext">—</span>'
        : '<span class="rcp-unit" title="'+escAttr(r.label)+'">'+money(r.unit)+' ea'+(r.bundle?' <span class="bundle-tag">kit</span>':'')+'</span><span class="rcp-ext mono">'+money(r.ext)+'</span>';
    return '<div class="rcp-row'+(r.isAsm?' is-asm':'')+(r.included?' is-incl':'')+'" style="padding-left:'+(r.depth*18)+'px">'+
      toggle+
      '<span class="rcp-name">'+escAttr(r.name)+'</span>'+
      '<span class="rcp-qty mono">×'+fmtQty(r.qty)+(r.uom&&r.uom!=='ea'?' '+escAttr(r.uom):'')+'</span>'+
      '<span class="rcp-dots"></span>'+price+
    '</div>';
  }).join('') : '<p class="note" style="margin:4px 0">No components yet — click Edit recipe to add some.</p>';
  return '<div class="card bom-detail-card" data-id="'+product.id+'">'+head+
    '<div class="card-body rcp-body">'+
      '<div class="rcp-list">'+list+'</div>'+
      (missing?'<p class="rcp-warn">'+missing+' part'+(missing>1?'s have':' has')+' no price yet — total is understated. Add a price on the Items tab or Cost Rollup.</p>':'')+
      '<div class="rcp-total"><span>Material cost per unit</span><b class="mono">'+money(total)+'</b></div>'+
    '</div></div>';
}
/* A nested row is hidden when any ancestor assembly between it and the top is collapsed. */
function isRecipeNestCollapsed(rows, r){
  const idx=rows.indexOf(r);
  let depth=r.depth;
  for(let i=idx-1;i>=0 && depth>0;i--){
    const p=rows[i];
    if(p.depth<depth){
      if(p.isAsm && collapsedBomNests[(p.parentId||'')+'::'+p.item.id]) return true;
      depth=p.depth;
    }
  }
  return false;
}
function wireBOM(){
  const detail=document.getElementById('bom-detail');
  const card=detail.querySelector('.bom-detail-card');
  if(!card) return;
  const id=card.dataset.id; const pr=itemById(id);
  if(!pr) return;
  const on=(sel,fn)=>{ const n=card.querySelector(sel); if(n) n.addEventListener('click',fn); };
  on('.bom-start-edit',()=>{ BOM_EDIT[id]=true; renderBOM(); });
  on('.bom-done-edit',()=>{ BOM_EDIT[id]=false; renderBOM(); });
  on('.bom-export-one',()=>openRecipeExportModal(pr));
  const nameInp=card.querySelector('.f-pname');
  if(nameInp) nameInp.addEventListener('change',e=>{pr.name=e.target.value; save(); renderBOM(); renderCounts();});
  on('.del-product',()=>{
    confirmModal('Delete '+pr.name+'?', ()=>{
      DB.items=DB.items.filter(x=>x.id!==id);
      DB.demandPlan=DB.demandPlan.filter(d=>d.productId!==id);
      if(BOM_SELECTED===id) BOM_SELECTED=null;
      save(); renderBOM(); renderCounts();
    });
  });
  detail.querySelectorAll('.bom-nest-toggle, .rcp-toggle').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const key=btn.dataset.key;
      collapsedBomNests[key]=!collapsedBomNests[key];
      renderBOM();
    });
  });
  detail.querySelectorAll('.bom-row').forEach(row=>{
    const ownerId=row.dataset.owner; const i=Number(row.dataset.i); const owner=itemById(ownerId);
    if(!owner) return;
    const sel=row.querySelector('select');
    if(sel) sel.addEventListener('change',e=>{ owner.lines[i].childId=e.target.value; save(); renderBOM(); });
    row.querySelector('.bom-qtyper').addEventListener('change',e=>{ owner.lines[i].qtyPer=Number(e.target.value)||0; save(); });
    row.querySelector('.bom-del').addEventListener('click',()=>{ owner.lines.splice(i,1); save(); renderBOM(); });
  });
  detail.querySelectorAll('.bom-add').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const owner=itemById(btn.dataset.owner);
      const fallback=DB.items.find(x=>x.id!==owner.id) || owner;
      owner.lines=owner.lines||[];
      owner.lines.push({childId:fallback.id, qtyPer:1});
      save(); renderBOM();
    });
  });
}
/* ---- Recipe export (one recipe or all, PDF or CSV, with or without prices) ---- */

function exportRecipes(list, o){
  if(!list.length){ alertModal('No products to export yet.'); return; }
  const fileBase=(list.length===1?'recipe-'+list[0].name:'recipes-all').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+(o.build>1?'-x'+o.build:'')+'-'+todayISO();
  const sets=list.map(p=>({p, rows:recipeRows(p,o.build,0,[p.id],false).filter(r=>o.nested||r.depth===0), total:recipeTotal(p)*o.build}));
  if(o.fmt==='csv'){
    const esc=v=>{ const s=String(v==null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
    const head=['Product','Component','Level','Qty per unit','Qty total','UOM'].concat(o.prices?['Unit cost','Ext. cost','Cost source']:[]);
    const out=[head];
    sets.forEach(({p,rows,total})=>{
      rows.forEach(r=>out.push([p.name, (r.depth?'  '.repeat(r.depth)+'> ':'')+r.name, r.depth, fmtQty(r.qtyPer), fmtQty(r.qty), r.uom]
        .concat(o.prices?[r.included?'incl.':(r.missing&&!r.isAsm?'':r.unit.toFixed(2)), r.included?'':(r.missing&&!r.isAsm?'':r.ext.toFixed(2)), r.included?'Included in kit price':r.label]:[])));
      if(o.prices) out.push([p.name,'TOTAL MATERIAL COST'+(o.build>1?' (x'+o.build+')':''),'','','','','',total.toFixed(2),'']);
      out.push([]);
    });
    const csv='﻿'+out.map(r=>r.map(esc).join(',')).join('\r\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download=fileBase+'.csv'; a.click();
    return;
  }
  if(!pdfAvailable()){ alertModal("PDF library didn't load — try CSV instead."); return; }
  const doc=new window.jspdf.jsPDF({orientation:'portrait', unit:'mm', format:'letter'});
  const margin=14;
  sets.forEach(({p,rows,total},si)=>{
    if(si>0) doc.addPage();
    doc.setFontSize(9); doc.setTextColor(120); doc.text('DRAGON SEATS  -  RECIPE / BILL OF MATERIALS', margin, 14);
    doc.setTextColor(0); doc.setFontSize(16); doc.setFont(undefined,'bold'); doc.text(pdfSafe(p.name), margin, 22);
    doc.setFont(undefined,'normal'); doc.setFontSize(9); doc.setTextColor(90);
    doc.text('Build quantity: '+o.build+'     Generated '+new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}), margin, 28);
    doc.setTextColor(0);
    const head=['Component','Qty'+(o.build>1?' (x'+o.build+')':'')].concat(o.prices?['Unit cost','Ext. cost']:[]);
    const body=rows.map(r=>{
      const name=(r.depth?'    '.repeat(r.depth)+'- ':'')+pdfSafe(r.name);
      const qty='x'+fmtQty(r.qty)+(r.uom&&r.uom!=='ea'?' '+pdfSafe(r.uom):'');
      const row=[{content:name, styles:{fontStyle:r.isAsm?'bold':'normal', textColor:r.included?[130,130,130]:[20,20,20]}}, qty];
      if(o.prices){
        if(r.included) row.push({content:'incl.', styles:{textColor:[130,130,130]}}, '');
        else if(r.missing && !r.isAsm) row.push({content:'no price', styles:{textColor:[170,2,1]}}, '-');
        else row.push(pdfMoney(r.unit)+(r.bundle?' (kit)':''), pdfMoney(r.ext));
      }
      return row;
    });
    const colStyles={1:{halign:'right', cellWidth:28}};
    if(o.prices){ colStyles[2]={halign:'right', cellWidth:30}; colStyles[3]={halign:'right', cellWidth:30}; }
    doc.autoTable({head:[head], body, startY:33, margin:{left:margin,right:margin}, styles:{fontSize:8.5, cellPadding:1.6}, headStyles:{fillColor:[170,2,1]}, columnStyles:colStyles,
      foot: o.prices?[[{content:'Total material cost'+(o.build>1?' for '+o.build+' units':' per unit'), colSpan:3, styles:{halign:'right'}}, {content:pdfMoney(total), styles:{halign:'right'}}]]:undefined,
      footStyles:{fillColor:[240,238,234], textColor:[20,20,20], fontStyle:'bold'},
      didParseCell:d=>{ if(d.section==='head' && d.column.index>0) d.cell.styles.halign='right'; }});
    if(o.prices){
      const miss=rows.filter(r=>r.missing && !r.isAsm && !r.included).length;
      let y=doc.lastAutoTable.finalY+6;
      doc.setFontSize(8); doc.setTextColor(110);
      doc.text(pdfSafe('Costs use the most recent PO/receipt price, else the standard cost on file. "Kit" = sub-assembly bought at one bundle price; its parts show as incl.'+(miss?' '+miss+' part(s) have no price - total is understated.':'')), margin, y, {maxWidth:188});
      doc.setTextColor(0);
    }
  });
  doc.save(fileBase+'.pdf');
}

function renderBomLines(parent, ancestry){
  const rows=(parent.lines||[]).map((line,i)=>{
    const child=itemById(line.childId);
    const cycle = child && ancestry.indexOf(child.id)!==-1;
    let nested='', nestToggle='';
    if(child && !cycle && child.lines && child.lines.length){
      const nestKey=parent.id+'::'+child.id;
      const nestCollapsed=!!collapsedBomNests[nestKey];
      nestToggle='<button type="button" class="cost-collapse-toggle bom-nest-toggle'+(nestCollapsed?' is-collapsed':'')+'" data-key="'+escAttr(nestKey)+'" title="'+(nestCollapsed?'Expand sub-assembly':'Collapse sub-assembly')+'" aria-expanded="'+(!nestCollapsed)+'">▾</button>';
      nested = nestCollapsed ? '' : '<div class="bom-nest">'+renderBomLines(child, ancestry.concat(child.id))+'</div>';
    }
    else if(cycle){ nested='<div class="bom-nest"><span class="note" style="color:var(--red)">circular reference — not expanding further</span></div>'; }
    return '<div class="bom-row" data-owner="'+parent.id+'" data-i="'+i+'" data-child="'+(child?child.id:'')+'">'+
      itemSelectForBomLine(line.childId, ancestry)+
      '<span class="bom-qty-wrap"><span class="bom-qty-label">Qty</span><input class="bom-qtyper num" type="number" min="0" step="any" value="'+line.qtyPer+'"></span>'+
      '<span class="bom-links">'+(child?linkChipsFor(child):'')+'</span>'+
      nestToggle+
      '<button class="btn sm danger bom-del">Remove</button>'+
    '</div>'+nested;
  }).join('');
  return '<div class="bom-lines">'+rows+'</div><button class="btn sm bom-add no-print" data-owner="'+parent.id+'">+ add component to '+escAttr(parent.name)+'</button>';
}
/* ---------------- BOM Cost Rollup subtab ---------------- */
function fmtQty(n){
  const r=Math.round((Number(n)||0)*100)/100;
  return (r%1===0) ? String(r) : r.toFixed(2);
}
/* Resolves which price-break tier applies to an item, given the quantity you've told it you
   typically order at once (assumedOrderQty). Picks the highest tier whose minQty is at or
   below that assumed quantity — standard "buy more, pay less" volume pricing. Returns null if
   no tiers are defined. */
function sortedTiersOf(item){
  return (item.priceBreaks||[])
    .map(b=>({minQty:Number(b.minQty)||0, price:Number(b.price)||0}))
    .filter(b=>b.price>0)
    .sort((a,b)=>a.minQty-b.minQty);
}
function resolveActiveTier(item){
  const breaks=sortedTiersOf(item);
  if(!breaks.length) return null;
  const assumedQty=Number(item.assumedOrderQty)||breaks[0].minQty||1;
  let applicable=breaks[0];
  breaks.forEach(b=>{ if(assumedQty>=b.minQty) applicable=b; });
  return applicable;
}
/* Shared "Standard Cost" cell — used on both the Items tab and the Cost Rollup breakdown table,
   so pricing works the same way and stays in sync no matter which one you edit from.
   Plain mode: a normal $ input tied to item.standardCost, with a small button next to it for
   pack or volume pricing. Once either is set, that button turns into a badge showing the
   computed per-unit price (and which tier/pack it came from) that reopens the pricing modal. */
function costCellHtml(item){
  const tier=resolveActiveTier(item);
  if(tier){
    const allTiers=sortedTiersOf(item);
    const tierList=allTiers.map(b=>
      '<span class="tier-opt'+(b.minQty===tier.minQty && b.price===tier.price?' is-active':'')+'">'+fmtQty(b.minQty)+'+ @ $'+b.price.toFixed(2)+'</span>'
    ).join('');
    return '<div class="cost-cell" data-item="'+item.id+'">'+
      '<button type="button" class="pack-badge tier-badge pack-edit-btn" title="Priced by volume tier — click to edit which quantity you\'re assuming">'+
        '<span class="pack-unit-price">$'+tier.price.toFixed(3)+'</span>'+
        '<span class="tier-options">'+tierList+'</span>'+
      '</button>'+
    '</div>';
  }
  const packQty=Number(item.packQty)||0;
  if(packQty>0){
    const per=Number(item.packPrice||0)/packQty;
    return '<div class="cost-cell" data-item="'+item.id+'">'+
      '<button type="button" class="pack-badge pack-edit-btn" title="Priced by the pack — click to edit">'+
        '<span class="pack-unit-price">$'+per.toFixed(3)+'</span>'+
        '<span class="pack-tag">'+fmtQty(packQty)+'-pack @ $'+Number(item.packPrice||0).toFixed(2)+'</span>'+
      '</button>'+
    '</div>';
  }
  return '<div class="cost-cell" data-item="'+item.id+'">'+
    '<span class="money-field"><span class="money-prefix">$</span><input class="f-stdcost num money-input" type="number" step="0.01" min="0" value="'+(Number(item.standardCost)||0).toFixed(2)+'" placeholder="0.00"></span>'+
    '<button type="button" class="pack-toggle-btn pack-edit-btn" title="Click for pack or volume pricing">🏷️</button>'+
  '</div>';
}
function wireCostCell(cell, rerenderFn){
  if(!cell) return;
  const item=itemById(cell.dataset.item);
  if(!item) return;
  const input=cell.querySelector('.f-stdcost');
  if(input) input.addEventListener('change',e=>{
    const v=Math.max(0, Number(e.target.value)||0);
    item.standardCost=v; e.target.value=v.toFixed(2); save();
  });
  const editBtn=cell.querySelector('.pack-edit-btn');
  if(editBtn) editBtn.addEventListener('click',()=>{ openItemPricingModal(item, rerenderFn); });
}
/* Combined pricing modal: pack pricing (one multi-pack price divided out) and price breaks
   (a table of quantity tiers, e.g. 50+ @ $235, 100+ @ $225 ...) plus the quantity you tell it
   you typically order, so it knows which tier to use. Price breaks take priority over pack
   pricing when both are set, since they're the more specific data. */
function openItemPricingModal(item, onDone){
  let breaks=(item.priceBreaks||[]).map(b=>({minQty:b.minQty, price:b.price}));
  function tierRowsHtml(){
    if(!breaks.length) return '<tr><td colspan="3" class="note">No price breaks yet — add one below.</td></tr>';
    return breaks.map((b,i)=>
      '<tr data-i="'+i+'">'+
        '<td><input class="pb-minqty" type="number" min="0" step="1" value="'+(b.minQty===''||b.minQty==null?'':b.minQty)+'" placeholder="e.g. 50"></td>'+
        '<td><span class="money-field"><span class="money-prefix">$</span><input class="pb-price money-input" type="number" min="0" step="0.01" value="'+(b.price===''||b.price==null?'':b.price)+'" placeholder="0.00"></span></td>'+
        '<td><button type="button" class="btn sm subtle danger pb-del">Remove</button></td>'+
      '</tr>'
    ).join('');
  }
  const body=
    '<div class="pricing-section">'+
      '<h4>Priced by pack?</h4>'+
      '<p class="note">If '+escAttr(item.name)+' is bought in multi-packs, enter how many come in a pack and the total price for the whole pack.</p>'+
      '<div class="pack-modal-grid">'+
        '<label>Pack quantity<input id="pp-qty" type="number" min="0" step="1" value="'+escAttr(String(item.packQty||''))+'" placeholder="e.g. 10"></label>'+
        '<label>Pack price<span class="money-field"><span class="money-prefix">$</span><input id="pp-price" class="money-input" type="number" min="0" step="0.01" value="'+escAttr(String(item.packPrice||''))+'" placeholder="e.g. 23.67"></span></label>'+
      '</div>'+
      '<p class="pack-result" id="pp-result"></p>'+
      '<button type="button" class="btn sm" id="pp-clear">Clear pack pricing</button>'+
    '</div>'+
    '<div class="pricing-section">'+
      '<h4>Price breaks by quantity</h4>'+
      '<p class="note">If '+escAttr(item.name)+' gets cheaper the more you order at once, list each tier\'s minimum quantity and price per unit — the highest qualifying tier wins. Takes priority over pack pricing above when both are set.</p>'+
      '<table class="pricebreak-table"><thead><tr><th>Qty at least</th><th>Price per unit</th><th></th></tr></thead><tbody id="pb-rows">'+tierRowsHtml()+'</tbody></table>'+
      '<button type="button" class="btn sm" id="pb-add" style="margin-top:8px">+ Add price break</button>'+
      '<div class="pack-modal-grid" style="margin-top:14px">'+
        '<label>Assumed order quantity<input id="pb-assumed" type="number" min="0" step="1" value="'+escAttr(String(item.assumedOrderQty||''))+'" placeholder="e.g. 100"></label>'+
      '</div>'+
      '<p class="pack-result" id="pb-result"></p>'+
      '<button type="button" class="btn sm" id="pb-clear">Clear price breaks</button>'+
    '</div>'+
    '<div class="toolbar" style="justify-content:flex-end;margin-top:16px"><button class="btn accent" id="pp-save">Save</button></div>';
  openModal('Pricing — '+item.name, body);

  const qtyInput=document.getElementById('pp-qty');
  const priceInput=document.getElementById('pp-price');
  const packResultEl=document.getElementById('pp-result');
  function updatePackResult(){
    const q=Number(qtyInput.value)||0, p=Number(priceInput.value)||0;
    packResultEl.textContent = q>0 ? ('= $'+(p/q).toFixed(4)+' per '+(item.uom||'unit')) : 'Enter a pack quantity to see the per-unit price.';
  }
  updatePackResult();
  qtyInput.addEventListener('input', updatePackResult);
  priceInput.addEventListener('input', updatePackResult);
  document.getElementById('pp-clear').addEventListener('click',()=>{ qtyInput.value=''; priceInput.value=''; updatePackResult(); });

  const assumedInput=document.getElementById('pb-assumed');
  const tierResultEl=document.getElementById('pb-result');
  function readBreaksFromDom(){
    breaks=[...document.querySelectorAll('#pb-rows tr[data-i]')].map(tr=>({
      minQty:Number(tr.querySelector('.pb-minqty').value)||0,
      price:Number(tr.querySelector('.pb-price').value)||0
    }));
  }
  function wireTierRows(){
    document.querySelectorAll('#pb-rows .pb-minqty, #pb-rows .pb-price').forEach(inp=>{
      inp.addEventListener('input', updateTierResult);
    });
    document.querySelectorAll('#pb-rows .pb-del').forEach(btn=>{
      btn.addEventListener('click',e=>{
        const tr=e.target.closest('tr'); const i=Number(tr.dataset.i);
        readBreaksFromDom();
        breaks.splice(i,1);
        renderTierRows(); updateTierResult();
      });
    });
  }
  function renderTierRows(){
    document.getElementById('pb-rows').innerHTML=tierRowsHtml();
    wireTierRows();
  }
  function updateTierResult(){
    readBreaksFromDom();
    const sorted=breaks.filter(b=>b.price>0).sort((a,b)=>a.minQty-b.minQty);
    if(!sorted.length){ tierResultEl.textContent='Add at least one price break to see which tier applies.'; return; }
    const assumedQty=Number(assumedInput.value)||sorted[0].minQty||1;
    let applicable=sorted[0];
    sorted.forEach(b=>{ if(assumedQty>=b.minQty) applicable=b; });
    tierResultEl.textContent='= $'+applicable.price.toFixed(4)+' per '+(item.uom||'unit')+' (using the '+fmtQty(applicable.minQty)+'+ tier, assuming '+fmtQty(assumedQty)+' ordered)';
  }
  wireTierRows();
  updateTierResult();
  assumedInput.addEventListener('input', updateTierResult);
  document.getElementById('pb-add').addEventListener('click',()=>{
    readBreaksFromDom();
    breaks.push({minQty:'', price:''});
    renderTierRows(); updateTierResult();
  });
  document.getElementById('pb-clear').addEventListener('click',()=>{
    breaks=[];
    renderTierRows(); updateTierResult();
  });

  document.getElementById('pp-save').addEventListener('click',()=>{
    readBreaksFromDom();
    item.packQty=Number(qtyInput.value)||0;
    item.packPrice=Number(priceInput.value)||0;
    item.priceBreaks=breaks.filter(b=>b.price>0).map(b=>({id:uid(), minQty:b.minQty, price:b.price}));
    item.assumedOrderQty=Number(assumedInput.value)||0;
    save(); closeModal();
    if(onDone) onDone();
  });
}
/* If an item is bought in multi-packs (e.g. balls & rods come 10-to-a-pack for one combined
   price), packQty/packPrice let you enter the pack as it's actually bought and get the true
   per-unit cost automatically. Price breaks (a table of quantity tiers) take priority over pack
   pricing when both are set, since a tier table is the more specific/complete pricing data.
   Clearing both reverts to the plain per-unit standardCost. */
function effectiveStandardCost(item){
  const tier=resolveActiveTier(item);
  if(tier) return tier.price;
  const packQty=Number(item.packQty)||0;
  if(packQty>0) return Number(item.packPrice||0)/packQty;
  return Number(item.standardCost)||0;
}
/* Per-part cost, in priority order:
   1) the most recent actual PO/Receipt price (real purchase history — most trustworthy)
   2) the manually-entered Standard Cost on the item (Items tab, or inline on Cost Rollup) —
      a price-break tier (if your assumed order quantity qualifies for one), a pack quantity/price
      divided out automatically, or a flat per-unit price — since Links entries are mostly just
      ordering links/phone numbers and the cost field there often isn't kept accurate
   3) the cheapest quote sitting on the item's Links tab, as a last-resort fallback */
function resolvePartCost(item){
  const hist=priceHistoryFor(item.id).filter(r=>r.source==='PO'||r.source==='Receipt');
  if(hist.length){
    hist.sort((a,b)=>{
      if(a.date!==b.date) return a.date<b.date?1:-1;
      return (b.reliability||0)-(a.reliability||0);
    });
    const top=hist[0];
    return {
      cost:Number(top.unitPrice)||0,
      label:top.source+' '+fmtDate(top.date)+(top.poNumber?(' (#'+top.poNumber+')'):''),
      type:top.source
    };
  }
  const std=effectiveStandardCost(item);
  if(std>0){
    const tier=resolveActiveTier(item);
    const packQty=Number(item.packQty)||0;
    let label='Standard cost (manual)';
    if(tier){
      label='Standard cost (price break — '+fmtQty(tier.minQty)+'+ units @ $'+tier.price.toFixed(2)+', assuming '+fmtQty(Number(item.assumedOrderQty)||tier.minQty)+' ordered)';
    } else if(packQty>0){
      label='Standard cost (manual — '+fmtQty(packQty)+'-pack @ $'+Number(item.packPrice||0).toFixed(2)+')';
    }
    return {cost:std, label, type:'Standard'};
  }
  const linkCosts=(item.links||[]).map(l=>Number(l.cost)||0).filter(c=>c>0);
  if(linkCosts.length){
    return {cost:Math.min(...linkCosts), label:'Links tab (best known quote)', type:'Link'};
  }
  return {cost:0, label:'No cost data', type:'none'};
}
/* Walks a product's BOM all the way down to individual parts — EXCEPT where a sub-assembly
   (like Wheel Set) is itself priced as a bundle. Some vendors don't sell the individual pieces
   at all; they only quote one price for the whole kit as ordered. So: if a sub-assembly has its
   own resolvable cost (Standard Cost / pack price / PO-Receipt history / Links), that bundle
   price is used for the whole assembly and its components are NOT also costed separately — they
   still show up underneath, dimmed, as "included in the bundle above" for reference. If the
   assembly has no cost of its own, it falls back to decomposing into its components as before. */
function computeItemMaterialCost(item, qtyPerParent, parentName, breakdown, ancestry, source){
  if(!item || ancestry.indexOf(item.id)!==-1) return 0;
  if(item.lines && item.lines.length){
    const bundle=resolvePartCost(item);
    if(bundle.type!=='none'){
      let row=breakdown.find(r=>r.item.id===item.id && r.isBundle);
      if(!row){ row={item, qtyNeeded:0, unitCost:bundle.cost, lineCost:0, label:bundle.label, type:bundle.type, vias:new Set(), isBundle:true, sources:[]}; breakdown.push(row); }
      row.qtyNeeded+=qtyPerParent;
      row.unitCost=bundle.cost;
      row.label=bundle.label;
      row.type=bundle.type;
      row.lineCost=row.unitCost*row.qtyNeeded;
      row.vias.add(parentName);
      if(source) row.sources.push(source);
      item.lines.forEach((line,li)=>{
        const child=itemById(line.childId);
        if(!child) return;
        const childQty=qtyPerParent*Number(line.qtyPer||0);
        let crow=breakdown.find(r=>r.item.id===child.id && r.type==='included' && r.includedIn===item.name);
        if(!crow){ crow={item:child, qtyNeeded:0, unitCost:0, lineCost:0, label:'Included in '+item.name+'\'s price above', type:'included', vias:new Set(), includedIn:item.name, sources:[]}; breakdown.push(crow); }
        crow.qtyNeeded+=childQty;
        crow.vias.add(item.name);
        crow.sources.push({parentId:item.id, lineIndex:li});
      });
      return bundle.cost*qtyPerParent;
    }
    let total=0;
    item.lines.forEach((line,li)=>{
      const child=itemById(line.childId);
      if(!child) return;
      total += computeItemMaterialCost(child, qtyPerParent*Number(line.qtyPer||0), item.name, breakdown, ancestry.concat(item.id), {parentId:item.id, lineIndex:li});
    });
    return total;
  }
  const resolved=resolvePartCost(item);
  const lineCost=resolved.cost*qtyPerParent;
  let row=breakdown.find(r=>r.item.id===item.id && !r.isBundle && r.type!=='included');
  if(!row){ row={item, qtyNeeded:0, unitCost:resolved.cost, lineCost:0, label:resolved.label, type:resolved.type, vias:new Set(), sources:[]}; breakdown.push(row); }
  row.qtyNeeded+=qtyPerParent;
  row.lineCost+=lineCost;
  row.vias.add(parentName);
  if(source) row.sources.push(source);
  return lineCost;
}
/* Sorts priced rows (bundles & plain leaf parts) by cost, then slots each bundle's dimmed
   "included" child rows in right after it, so the table still reads as one coherent tree
   instead of scattering a bundle's components away from the bundle line that prices them. */
function computeProductCost(product){
  const breakdown=[];
  const materialCost=computeItemMaterialCost(product, 1, product.name, breakdown, []);

  const priced=breakdown.filter(r=>r.type!=='included').sort((a,b)=>b.lineCost-a.lineCost);
  const includedRows=breakdown.filter(r=>r.type==='included');
  const placed=new Set();
  const ordered=[];
  priced.forEach(row=>{
    ordered.push(row);
    if(row.isBundle){
      includedRows.forEach(ir=>{
        if(!placed.has(ir) && ir.includedIn===row.item.name){ ordered.push(ir); placed.add(ir); }
      });
    }
  });
  includedRows.forEach(ir=>{ if(!placed.has(ir)) ordered.push(ir); });

  return {materialCost, breakdown:ordered};
}

/* Renders the "Qty / unit" cell as an editable input wired straight to the underlying recipe
   line(s) that produced this row (via row.sources — the same {parentId,lineIndex} tracking that
   powers removeCellHtml below), so nested/included sub-assembly quantities (e.g. Wheel Stem,
   Sliding Plate, Mounting Bar under a bundled LH/RH Wheelbase Assembly) can be adjusted right here
   instead of only from the owning item's own Recipe editor. Falls back to plain read-only text for
   rows with no traceable source line (e.g. a product with an empty recipe). */
function qtyCellHtml(row){
  const uom=escAttr(row.item.uom||'');
  const editableSources=(row.sources||[]).map(s=>{
    const parent=itemById(s.parentId);
    const line=parent && Array.isArray(parent.lines) ? parent.lines[s.lineIndex] : null;
    return line ? {s, parent, line} : null;
  }).filter(Boolean);
  if(!editableSources.length){
    return '<span class="mono">'+fmtQty(row.qtyNeeded)+' '+uom+'</span>';
  }
  if(editableSources.length===1){
    const {s,line}=editableSources[0];
    return '<span class="qty-edit-wrap"><input type="number" step="any" min="0" class="num row-qty-edit" data-parent="'+s.parentId+'" data-line="'+s.lineIndex+'" value="'+line.qtyPer+'"> '+uom+'</span>';
  }
  return editableSources.map(({s,parent,line})=>
    '<div class="qty-edit-wrap" style="margin:2px 0"><input type="number" step="any" min="0" class="num row-qty-edit" data-parent="'+s.parentId+'" data-line="'+s.lineIndex+'" value="'+line.qtyPer+'"> '+uom+' <span class="note">('+escAttr(parent?parent.name:'?')+')</span></div>'
  ).join('');
}
function removeCellHtml(row){
  if(!row.sources || !row.sources.length) return '<span class="note">—</span>';
  if(row.sources.length===1){
    const s=row.sources[0];
    return '<button type="button" class="btn sm danger row-src-del" data-parent="'+s.parentId+'" data-line="'+s.lineIndex+'">Remove</button>';
  }
  return row.sources.map(s=>{
    const parent=itemById(s.parentId);
    return '<button type="button" class="btn sm danger row-src-del" data-parent="'+s.parentId+'" data-line="'+s.lineIndex+'" style="display:block;margin:2px 0">Remove ('+escAttr(parent?parent.name:'?')+')</button>';
  }).join('');
}
function renderProductCostCard(product){
  const {materialCost, breakdown}=computeProductCost(product);

        '<td class="num">'+qtyCellHtml(r)+'</td>'+
        '<td class="num">—</td>'+
        '<td class="num mono">—</td>'+
        '<td class="num mono">—</td>'+
        '<td class="note">'+escAttr(r.label)+'</td>'+

      '<td class="num mono">'+(r.type==='none'?'—':'$'+r.lineCost.toFixed(2))+'</td>'+
      '<td class="note">'+(r.type==='none'?'No cost data yet':escAttr(r.label))+'</td>'+
      '<td class="num">'+removeCellHtml(r)+'</td>'+

  }).join('') : '<tr><td colspan="8" class="note">No components in this recipe yet — add some below.</td></tr>';
  const expanded=product.costRollupExpanded===true;
  return '<div class="card cost-card" data-id="'+product.id+'">'+
    '<div class="card-head">'+
      '<div class="cost-card-title">'+
        '<button type="button" class="cost-collapse-toggle'+(expanded?'':' is-collapsed')+'" title="'+(expanded?'Collapse':'Expand')+'" aria-expanded="'+expanded+'">▾</button>'+
        '<h3>'+escAttr(product.name)+'</h3>'+
      '</div>'+
    '<div class="row-actions no-print"><button class="btn sm danger del-cost-product">Delete product</button></div></div>'+
    '<div class="card-body">'+
      '<div class="cost-details'+(expanded?'':' hidden')+'">'+
        renderCostRecipeEditor(product)+
        (missing.length ? '<p class="cost-warning">'+missing.length+' part'+(missing.length>1?'s':'')+' missing cost data ('+missing.map(r=>escAttr(r.item.name)).join(', ')+') — total below is understated until those get a Standard Cost (below or on the Items tab) or a purchase history.</p>' : '')+
        '<table><colgroup><col style="width:15%"><col style="width:9%"><col style="width:11%"><col style="width:10%"><col style="width:8%"><col style="width:8%"><col style="width:25%"><col style="width:14%"></colgroup>'+
        '<thead><tr><th>Component</th><th>Via</th><th class="num">Qty / unit</th><th class="num">Standard Cost</th><th class="num">Unit Cost</th><th class="num">Line Cost</th><th>Cost Source</th><th class="num">Remove</th></tr></thead>'+
        '<tbody>'+rows+'</tbody></table>'+
      '</div>'+
      '<div class="cost-summary'+(expanded?'':' collapsed-summary')+'">'+
        '<div>Cost / unit: <b>$'+materialCost.toFixed(2)+'</b></div>'+
      '</div>'+
    '</div></div>';
}
function wireBomCosting(){
  document.querySelectorAll('#panel-bom-costing .cost-card').forEach(card=>{
    const id=card.dataset.id; const product=itemById(id);
    if(!product) return;
    const collapseTitle=card.querySelector('.cost-card-title');
    if(collapseTitle) collapseTitle.addEventListener('click',()=>{
      product.costRollupExpanded = !(product.costRollupExpanded===true);
      save(); renderBomCosting();
    });
    card.querySelectorAll('.cost-cell').forEach(cell=>{
      wireCostCell(cell, renderBomCosting);
    });
    const delBtn=card.querySelector('.del-cost-product');
    if(delBtn) delBtn.addEventListener('click',()=>{
      confirmModal('Delete '+product.name+'? This also removes it from the Demand Plan. This cannot be undone.', ()=>{
        DB.items=DB.items.filter(x=>x.id!==id);
        DB.demandPlan=DB.demandPlan.filter(d=>d.productId!==id);
        save(); renderBomCosting(); renderCounts();
      });
    });
    card.querySelectorAll('.cost-recipe-editor .bom-row').forEach(row=>{
      const i=Number(row.dataset.i);
      const sel=row.querySelector('select');
      if(sel) sel.addEventListener('change',e=>{ product.lines[i].childId=e.target.value; save(); renderBomCosting(); });
      const qtyInput=row.querySelector('.bom-qtyper');
      if(qtyInput) qtyInput.addEventListener('change',e=>{ product.lines[i].qtyPer=Number(e.target.value)||0; save(); renderBomCosting(); });
      const rowDelBtn=row.querySelector('.bom-del');
      if(rowDelBtn) rowDelBtn.addEventListener('click',()=>{ product.lines.splice(i,1); save(); renderBomCosting(); });
    });
    const addBtn=card.querySelector('.cost-recipe-editor .bom-add');
    if(addBtn) addBtn.addEventListener('click',()=>{
      const fallback=DB.items.find(x=>x.id!==product.id) || product;
      product.lines=product.lines||[];
      product.lines.push({childId:fallback.id, qtyPer:1});
      save(); renderBomCosting();
    });
    card.querySelectorAll('table .row-src-del').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const parentId=btn.dataset.parent;
        const lineIndex=Number(btn.dataset.line);
        const parent=itemById(parentId);
        if(!parent || !Array.isArray(parent.lines) || !parent.lines[lineIndex]) return;
        const child=itemById(parent.lines[lineIndex].childId);
        confirmModal('Remove '+(child?child.name:'this component')+' from '+parent.name+'\'s recipe? This cannot be undone.', ()=>{
          parent.lines.splice(lineIndex,1);
          save(); renderBomCosting();
        });
      });
    });
    card.querySelectorAll('table .row-qty-edit').forEach(inp=>{
      inp.addEventListener('change',e=>{
        const parentId=inp.dataset.parent;
        const lineIndex=Number(inp.dataset.line);
        const parent=itemById(parentId);
        if(!parent || !Array.isArray(parent.lines) || !parent.lines[lineIndex]) return;
        parent.lines[lineIndex].qtyPer=Math.max(0, Number(e.target.value)||0);
        save(); renderBomCosting();
      });
    });
  });
}

function supplierInitials(name){
  const w=String(name||'?').replace(/[^A-Za-z0-9 ]/g,' ').trim().split(/\s+/).filter(Boolean);
  return ((w[0]||'?')[0]+((w[1]||'')[0]||'')).toUpperCase();
}
function itemsSuppliedBy(s){
  return DB.items.filter(i=>(i.links||[]).some(l=>l.supplierId===s.id))
    .map(i=>{ const l=(i.links||[]).find(x=>x.supplierId===s.id && Number(x.cost)>0); return {item:i, cost:l?Number(l.cost):0}; })
    .sort((a,b)=>(a.item.name||'').localeCompare(b.item.name||''));
}
function supplierCardHtml(s){
  const groups=supplierDocGroups(s);
  const closed=closedStatusName();
  const openPos=groups.po.filter(p=>p.status!==closed).length;
  const lastDates=[].concat(groups.po.map(p=>p.orderDate), groups.r.map(r=>r.receiptDate)).filter(Boolean).sort();
  const lastOrder=lastDates.length?lastDates[lastDates.length-1]:null;
  const spend=groups.r.reduce((t,r)=>t+docTotal(r),0);
  const supplied=itemsSuppliedBy(s);
  const specs=String(s.specialty||'').split(/[,;/]+/).map(x=>x.trim()).filter(Boolean);
  const row=(ico,html,title)=>'<div class="sup-line" title="'+escAttr(title||'')+'"><span class="sup-ico">'+ico+'</span><span class="sup-val">'+html+'</span></div>';
  const empty=t=>'<span class="sup-empty">'+t+'</span>';
  const web=orderLinkHref(s.website||'');
  const contactLines=
    row('👤', s.contact?escAttr(s.contact):empty('No contact name'),'Contact')+
    row('✉', s.email?'<a href="mailto:'+escAttr(s.email)+'">'+escAttr(s.email)+'</a>':empty('No email'),'Email')+
    row('☎', s.phone?'<a href="'+escAttr(telHref(s.phone))+'">'+escAttr(s.phone)+'</a>':empty('No phone'),'Phone')+
    row('🌐', s.website?'<a href="'+escAttr(web)+'" target="_blank" rel="noopener noreferrer">'+escAttr(String(s.website).replace(/^https?:\/\//,'').replace(/\/$/,''))+'</a>':empty('No website'),'Website');
  const addressLine = s.address?row('📍',escAttr(s.address),'Address'):'';
  const meta=[];
  if(s.accountNumber) meta.push('<span><b>Acct #</b> '+escAttr(s.accountNumber)+'</span>');
  if(s.paymentTerms) meta.push('<span><b>Terms</b> '+escAttr(s.paymentTerms)+'</span>');
  const maxItems=40;
  const itemChips = supplied.length
    ? supplied.slice(0,maxItems).map(x=>'<span class="sup-item">'+escAttr(x.item.name)+(x.cost?' <span class="mono">$'+x.cost.toFixed(2)+'</span>':'')+'</span>').join('')+
      (supplied.length>maxItems?'<span class="sup-item more" title="'+escAttr(supplied.slice(maxItems).map(x=>x.item.name).join(', '))+'">+'+(supplied.length-maxItems)+' more</span>':'')
    : '<span class="sup-empty">No items linked yet</span>';
  const docRowsHtml=[].concat(
      groups.po.map(d=>({type:'po',label:'PO',num:d.poNumber,date:d.orderDate,status:d.cancelled?'Cancelled':d.status,d})),
      groups.q.map(d=>({type:'quotes',label:'Quote',num:d.quoteNumber,date:d.quoteDate,status:d.cancelled?'Cancelled':d.status,d})),
      groups.r.map(d=>({type:'receipts',label:'Receipt',num:d.receiptNumber,date:d.receiptDate,status:d.cancelled?'Cancelled':(d.appliedToStock?'In stock':'Pending'),d}))
    ).sort((a,b)=>(b.date||'').localeCompare(a.date||''))
    .map(r=>'<button type="button" class="sup-doc-line view-sup-doc'+(r.d.cancelled?' is-cancelled':'')+'" data-type="'+r.type+'" data-id="'+r.d.id+'">'+
      '<span class="doc-type-tag t-'+r.type+'">'+r.label+'</span>'+
      '<span class="sup-doc-num">'+escAttr(r.num||'(no number)')+'</span>'+
      '<span class="mono sup-doc-date">'+fmtShortDateSafe(r.date)+'</span>'+
      '<span class="mono sup-doc-total">'+money(docTotal(r.d))+'</span>'+
      '<span class="sup-doc-status">'+escAttr(r.status||'')+'</span>'+
    '</button>').join('');
  return '<div class="sup-card" data-id="'+s.id+'">'+
    '<div class="sup-card-head">'+
      '<div class="sup-avatar">'+escAttr(supplierInitials(s.name))+'</div>'+
      '<div class="sup-title"><div class="sup-name">'+escAttr(s.name||'(unnamed)')+'</div>'+
        '<div class="sup-specs">'+specs.map(x=>'<span class="sup-spec">'+escAttr(x)+'</span>').join('')+'</div>'+
      '</div>'+
      '<button type="button" class="btn sm subtle sup-edit no-print" title="Edit supplier">Edit</button>'+
    '</div>'+
    '<div class="sup-contact">'+contactLines+'</div>'+
    '<div class="sup-stats">'+
      '<div><b class="mono">'+supplied.length+'</b><span>items</span></div>'+
      '<div><b class="mono">'+openPos+'</b><span>open POs</span></div>'+
      '<div><b class="mono">'+(lastOrder?fmtShortDateSafe(lastOrder):'—')+'</b><span>last order</span></div>'+
      '<div><b class="mono">'+(spend?money(spend):'—')+'</b><span>receipts</span></div>'+
    '</div>'+
    '<details class="sup-docs-details"><summary><span class="sup-doc-caret">▸</span>Details, items &amp; documents ('+groups.total+' doc'+(groups.total===1?'':'s')+')</summary>'+
      '<div class="sup-more">'+
        ((addressLine||meta.length)?'<div>'+addressLine+(meta.length?'<div class="sup-meta" style="margin-top:4px">'+meta.join('')+'</div>':'')+'</div>':'')+
        '<div><div class="sup-more-label">Items supplied</div><div class="sup-items">'+itemChips+'</div></div>'+
        (s.notes?'<div class="sup-notes">'+escAttr(s.notes)+'</div>':'')+
        '<div><div class="sup-more-label">Documents on file</div><div class="sup-doc-list">'+(docRowsHtml||'<p class="note" style="margin:4px 0">No POs, quotes or receipts yet.</p>')+'</div></div>'+
      '</div>'+
    '</details>'+
  '</div>';
}
function fmtShortDateSafe(iso){ return iso?fmtShortDate(iso):'—'; }
function supplierSubnavHtml(){
  return '<div class="doc-subnav no-print">'+
    '<button type="button" class="subtab'+(supplierSubtab==='suppliers'?' active':'')+'" data-supsub="suppliers">Suppliers <span class="count">'+DB.suppliers.length+'</span></button>'+
    '<button type="button" class="subtab'+(supplierSubtab==='clients'?' active':'')+'" data-supsub="clients">Clients <span class="count">'+(DB.clients||[]).length+'</span></button>'+
  '</div>';
}
function wireSupplierSubnav(el){
  el.querySelectorAll('[data-supsub]').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.supsub!==supplierSubtab) setSupplierSubtab(b.dataset.supsub); }));
}
function renderSuppliers(){
  const el=document.getElementById('panel-suppliers');
  if(supplierSubtab==='clients'){ renderClients(); return; }
  const sq=(supplierSearch||'').trim().toLowerCase();
  const hay=s=>[s.name,s.contact,s.email,s.phone,s.specialty,s.notes,s.address,s.accountNumber].concat(itemsSuppliedBy(s).map(x=>x.item.name)).join(' ').toLowerCase();
  const visibleSuppliers=(sq? DB.suppliers.filter(s=>hay(s).includes(sq)) : DB.suppliers).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  document.getElementById('page-actions').innerHTML=
    '<button class="btn accent" id="add-supplier">+ New supplier</button>';
  el.innerHTML=supplierSubnavHtml()+
    '<div class="toolbar no-print">'+
      '<div class="search-input"><input type="text" id="sup-search" placeholder="Search name, contact, item..." value="'+escAttr(supplierSearch)+'"></div>'+
      '<div class="toolbar-spacer"></div><span class="toolbar-count">'+visibleSuppliers.length+' supplier'+(visibleSuppliers.length===1?'':'s')+'</span>'+
    '</div>'+
    (visibleSuppliers.length
      ? '<div class="sup-grid" id="sup-grid">'+visibleSuppliers.map(supplierCardHtml).join('')+'</div>'
      : '<div class="card"><div class="empty-state"><div class="empty-icon">☉</div><div class="empty-title">'+(DB.suppliers.length?'No suppliers match this search':'No suppliers yet')+'</div><div class="empty-sub">'+(DB.suppliers.length?'Try a different name or item.':'Add one with + New supplier.')+'</div></div></div>');
  document.getElementById('sup-search').addEventListener('input',e=>{ const pos=e.target.selectionStart; supplierSearch=e.target.value; renderSuppliers(); refocusSearch('sup-search',pos); });
  el.querySelectorAll('.sup-card').forEach(card=>{
    const s=supplierById(card.dataset.id);
    card.querySelector('.sup-edit').addEventListener('click',()=>openSupplierModal(s));
  });
  el.querySelectorAll('.view-sup-doc').forEach(btn=>{
    btn.addEventListener('click',()=>{ jumpToSupplierDoc(btn.dataset.type, btn.dataset.id); });
  });
  document.getElementById('add-supplier').addEventListener('click', openAddSupplierModal);
  wireSupplierSubnav(el);
}

/* ---------------- Clients (teams / customers we ship to) ----------------
   Lives in DB.clients and shares the Suppliers page as its own sub-tab. Each card shows the
   client's contact info and their full shipment history from DB.shipments. */
const CLIENT_FIELDS=[
  ['name','Client / team name','e.g. Smith Racing'],
  ['contact','Contact','Contact person'],
  ['phone','Phone','(555) 555-5555'],
  ['email','Email','name@team.com'],
  ['address','Ship-to address','Street, City, State ZIP'],
  ['tags','Type / series','e.g. Late model, Sprint car'],
  ['notes','Notes','—']
];
function clientShipments(c){
  return (DB.shipments||[]).filter(sh=>sh.clientId===c.id)
    .slice().sort((a,b)=>((b.shipDate||b.expectedDate||b.createdAt||'')).localeCompare(a.shipDate||a.expectedDate||a.createdAt||''));
}
function openClientModal(existing){
  const c=existing||{};
  const field=([k,label,ph])=>{
    const wide=(k==='address'||k==='notes'||k==='name');
    const input = k==='notes'
      ? '<textarea id="cl-f-'+k+'" rows="2" placeholder="'+escAttr(ph)+'" style="width:100%;font:inherit;box-sizing:border-box">'+escAttr(c[k]||'')+'</textarea>'
      : '<input type="text" id="cl-f-'+k+'" style="width:100%;font:inherit;box-sizing:border-box" placeholder="'+escAttr(ph)+'" value="'+escAttr(c[k]||'')+'">';
    return '<div class="sup-form-field'+(wide?' wide':'')+'"><label>'+label+'</label>'+input+'</div>';
  };
  openModal(existing?'Edit client':'New client',
    '<div class="sup-form">'+CLIENT_FIELDS.map(field).join('')+'</div>'+
    '<div class="toolbar" style="margin-top:16px">'+
      (existing?'<button class="btn subtle danger" id="cl-f-delete">Delete client</button>':'')+
      '<div class="toolbar-spacer"></div><button class="btn" id="cl-f-cancel">Cancel</button><button class="btn accent" id="cl-f-save">Save</button></div>');
  const nameInp=document.getElementById('cl-f-name');
  nameInp.focus();
  const commit=()=>{
    const name=nameInp.value.trim();
    if(!name){ nameInp.focus(); nameInp.style.borderColor='var(--red)'; return; }
    const dup=(DB.clients||[]).find(x=>x!==existing && (x.name||'').trim().toLowerCase()===name.toLowerCase());
    if(dup){ alertModal('There is already a client named '+dup.name+'.'); return; }
    const target = existing || {id:uid(), createdAt:new Date().toISOString()};
    CLIENT_FIELDS.forEach(([k])=>{ target[k]=document.getElementById('cl-f-'+k).value.trim(); });
    if(!existing) DB.clients.push(target);
    save(); closeModal(); renderSuppliers(); renderCounts();
    setTimeout(()=>{
      const card=document.querySelector('.client-card[data-id="'+target.id+'"]');
      if(card){ card.scrollIntoView({behavior:'smooth', block:'center'}); card.classList.add('doc-highlight'); setTimeout(()=>card.classList.remove('doc-highlight'),1600); }
    }, 30);
  };
  document.getElementById('cl-f-save').addEventListener('click', commit);
  document.getElementById('cl-f-cancel').addEventListener('click', closeModal);
  const del=document.getElementById('cl-f-delete');
  if(del) del.addEventListener('click',()=>{
    const n=clientShipments(existing).length;
    confirmModal('Delete '+existing.name+'?'+(n?' Their '+n+' shipment'+(n===1?'':'s')+' stay on file under the name “'+existing.name+'”.':''), ()=>{
      (DB.shipments||[]).forEach(sh=>{ if(sh.clientId===existing.id){ sh.clientId=''; sh.companyName=existing.name||''; } });
      DB.clients=DB.clients.filter(x=>x.id!==existing.id); save(); renderSuppliers(); renderCounts();
    });
  });
  CLIENT_FIELDS.forEach(([k])=>{
    if(k==='notes') return;
    document.getElementById('cl-f-'+k).addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); commit(); } });
  });
}
function clientCardHtml(c){
  const ships=clientShipments(c);
  const active=ships.filter(sh=>sh.status!=='Delivered' && sh.status!=='Cancelled').length;
  const lastShip=ships.find(sh=>sh.status!=='Cancelled' && (sh.shipDate||sh.deliveredDate));
  const spent=round2(ships.reduce((t,sh)=>t+(sh.status==='Cancelled'||sh.price==null?0:Number(sh.price)),0));
  const tags=String(c.tags||'').split(/[,;/]+/).map(x=>x.trim()).filter(Boolean);
  const row=(ico,html,title)=>'<div class="sup-line" title="'+escAttr(title||'')+'"><span class="sup-ico">'+ico+'</span><span class="sup-val">'+html+'</span></div>';
  const empty=t=>'<span class="sup-empty">'+t+'</span>';
  const contactLines=
    row('👤', c.contact?escAttr(c.contact):empty('No contact name'),'Contact')+
    row('✉', c.email?'<a href="mailto:'+escAttr(c.email)+'">'+escAttr(c.email)+'</a>':empty('No email'),'Email')+
    row('☎', c.phone?'<a href="'+escAttr(telHref(c.phone))+'">'+escAttr(c.phone)+'</a>':empty('No phone'),'Phone')+
    row('📍', c.address?escAttr(c.address):empty('No ship-to address'),'Ship-to address');
  const shipRows=ships.map(sh=>{
    const nFiles=(sh.docs||[]).length;
    const st=shipIsLate(sh)?'Late':sh.status;
    return '<button type="button" class="sup-doc-line view-client-ship'+(sh.status==='Cancelled'?' is-cancelled':'')+'" data-id="'+escAttr(sh.id)+'" title="'+escAttr(sh.contents||'')+'">'+
      '<span class="doc-type-tag t-ship-'+(sh.direction==='outbound'?'out':'in')+'">'+(sh.direction==='outbound'?'Out':'In')+'</span>'+
      '<span class="sup-doc-num">'+escAttr(sh.contents||sh.method||'Shipment')+(nFiles?' <span class="ship-clip">📎'+(nFiles>1?nFiles:'')+'</span>':'')+'</span>'+
      '<span class="mono sup-doc-date">'+fmtShortDateSafe(sh.shipDate||sh.expectedDate)+'</span>'+
      '<span class="mono sup-doc-total">'+(sh.price==null?'—':money(sh.price))+'</span>'+
      '<span class="sup-doc-status">'+escAttr(st)+'</span>'+
    '</button>';
  }).join('');
  return '<div class="sup-card client-card" data-id="'+escAttr(c.id)+'">'+
    '<div class="sup-card-head">'+
      '<div class="sup-avatar client-avatar">'+escAttr(supplierInitials(c.name))+'</div>'+
      '<div class="sup-title"><div class="sup-name">'+escAttr(c.name||'(unnamed)')+'</div>'+
        '<div class="sup-specs">'+tags.map(x=>'<span class="sup-spec">'+escAttr(x)+'</span>').join('')+'</div>'+
      '</div>'+
      '<div class="sup-head-btns no-print"><button type="button" class="btn sm subtle client-new-ship" title="New shipment to '+escAttr(c.name||'this client')+'">+ Ship</button>'+
      '<button type="button" class="btn sm subtle client-edit" title="Edit client">Edit</button></div>'+
    '</div>'+
    '<div class="sup-contact">'+contactLines+'</div>'+
    '<div class="sup-stats">'+
      '<div><b class="mono">'+ships.length+'</b><span>shipments</span></div>'+
      '<div><b class="mono">'+active+'</b><span>in progress</span></div>'+
      '<div><b class="mono">'+(lastShip?fmtShortDateSafe(lastShip.shipDate||lastShip.deliveredDate):'—')+'</b><span>last shipped</span></div>'+
      '<div><b class="mono">'+(spent?money(spent):'—')+'</b><span>ship cost</span></div>'+
    '</div>'+
    '<details class="sup-docs-details"><summary><span class="sup-doc-caret">▸</span>Notes &amp; shipment history ('+ships.length+')</summary>'+
      '<div class="sup-more">'+
        (c.notes?'<div class="sup-notes">'+escAttr(c.notes)+'</div>':'')+
        '<div><div class="sup-more-label">Shipment history</div><div class="sup-doc-list">'+(shipRows||'<p class="note" style="margin:4px 0">No shipments to this client yet.</p>')+'</div></div>'+
      '</div>'+
    '</details>'+
  '</div>';
}
function renderClients(){
  const el=document.getElementById('panel-suppliers');
  const cq=(clientSearch||'').trim().toLowerCase();
  const all=DB.clients||[];
  const hay=c=>[c.name,c.contact,c.email,c.phone,c.address,c.tags,c.notes].concat(clientShipments(c).map(sh=>[sh.contents,sh.tracking].join(' '))).join(' ').toLowerCase();
  const visible=(cq? all.filter(c=>hay(c).includes(cq)) : all).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  document.getElementById('page-actions').innerHTML='<button class="btn accent" id="add-client">+ New client</button>';
  el.innerHTML=supplierSubnavHtml()+
    '<div class="toolbar no-print">'+
      '<div class="search-input"><input type="text" id="client-search" placeholder="Search client, contact, what was shipped..." value="'+escAttr(clientSearch)+'"></div>'+
      '<div class="toolbar-spacer"></div><span class="toolbar-count">'+visible.length+' client'+(visible.length===1?'':'s')+'</span>'+
    '</div>'+
    (visible.length
      ? '<div class="sup-grid">'+visible.map(clientCardHtml).join('')+'</div>'
      : '<div class="card"><div class="empty-state"><div class="empty-icon">☉</div><div class="empty-title">'+(all.length?'No clients match this search':'No clients yet')+'</div><div class="empty-sub">'+(all.length?'Try a different name.':'Add one with + New client, or pick “+ New client” when you log a shipment.')+'</div></div></div>');
  wireSupplierSubnav(el);
  document.getElementById('client-search').addEventListener('input',e=>{ const pos=e.target.selectionStart; clientSearch=e.target.value; renderClients(); refocusSearch('client-search',pos); });
  document.getElementById('add-client').addEventListener('click',()=>openClientModal(null));
  el.querySelectorAll('.client-card').forEach(card=>{
    const c=clientById(card.dataset.id);
    card.querySelector('.client-edit').addEventListener('click',()=>openClientModal(c));
    card.querySelector('.client-new-ship').addEventListener('click',()=>openShipmentModal(null,{clientId:c.id}));
  });
  el.querySelectorAll('.view-client-ship').forEach(b=>b.addEventListener('click',()=>{
    const sh=shipmentById(b.dataset.id); if(sh) openShipmentModal(sh);
  }));
}

/* Gathers every PO/Quote/Receipt on file for a supplier, most-recent-first within each group. */
function supplierDocGroups(s){
  const po=DB.purchaseOrders.filter(p=>p.supplierId===s.id).slice().sort((a,b)=>(b.orderDate||'').localeCompare(a.orderDate||''));
  const q=DB.quotes.filter(x=>x.supplierId===s.id).slice().sort((a,b)=>(b.quoteDate||'').localeCompare(a.quoteDate||''));
  const r=DB.receipts.filter(x=>x.supplierId===s.id).slice().sort((a,b)=>(b.receiptDate||'').localeCompare(a.receiptDate||''));
  return {po,q,r,total:po.length+q.length+r.length};
}
function supplierDocLineTotal(doc){
  return docTotal(doc);
}
/* Renders one PO/Quote/Receipt summary row within the supplier documents panel. */
function supplierDocRowHTML(type, doc){
  let label, number, date, status;
  if(type==='po'){ label='PO'; number=doc.poNumber; date=doc.orderDate; status=doc.status||''; }
  else if(type==='quotes'){ label='Quote'; number=doc.quoteNumber; date=doc.quoteDate; status=doc.status||''; }
  else{ label='Receipt'; number=doc.receiptNumber; date=doc.receiptDate; status=''; }
  const total=supplierDocLineTotal(doc);
  return '<div class="card sup-doc-row" style="margin-bottom:8px">'+
    '<div class="card-head" style="padding:8px 12px">'+
      '<h3 style="font-size:13px">'+label+' '+escAttr(number||'(no number)')+(status?' <span class="status-badge">'+escAttr(status)+'</span>':'')+'</h3>'+
      '<div class="row-actions no-print"><button class="btn sm view-sup-doc" data-type="'+type+'" data-id="'+doc.id+'">View / edit →</button></div>'+
    '</div>'+
    '<div class="card-body" style="padding:8px 12px">'+
      '<div class="note">'+fmtDate(date)+' &middot; Total $'+total.toFixed(2)+'</div>'+
      '<div style="margin:6px 0">'+(doc.notes? escAttr(doc.notes) : '<span class="note">No notes on file.</span>')+'</div>'+
      '<div>'+docChips(doc.docs)+'</div>'+
    '</div></div>';
}
/* Builds the grouped Documents panel (PO / Quote / Receipt) for one supplier's expando row. */
function renderSupplierDocsPanel(s){
  const groups=supplierDocGroups(s);
  if(!groups.total) return '<p class="note">No purchase orders, quotes, or receipts on file for this supplier yet.</p>';
  function section(label, type, arr){
    return '<div class="sup-doc-group" style="margin-bottom:14px">'+
      '<div style="font-weight:600;font-size:12.5px;margin-bottom:6px">'+label+' <span class="chip">'+arr.length+'</span></div>'+
      (arr.length? arr.map(d=>supplierDocRowHTML(type,d)).join('') : '<p class="note">None on file.</p>')+
    '</div>';
  }
  return section('Purchase Orders','po',groups.po)+section('Quotes','quotes',groups.q)+section('Receipts','receipts',groups.r);
}
/* Switches to the record's home tab (reusing existing tab routing) and scrolls/highlights its card. */
function jumpToSupplierDoc(type, id){
  // Opening the record's detail drawer (rather than just scrolling to a card in a stacked
  // list) is the equivalent of the old "scroll to card" behavior under the list+drawer layout.
  openDocRecord(type, id);
  currentTab=type; setTab(type); renderCounts();
  setTimeout(()=>{
    const card=document.querySelector('.detail-drawer[data-id="'+id+'"]');
    if(card){
      card.scrollIntoView({behavior:'smooth', block:'start'});
      card.classList.add('doc-highlight');
      setTimeout(()=>card.classList.remove('doc-highlight'), 2000);
    }
  }, 30);
}

/* ---------------- Demand Plan tab ---------------- */
/* Anything you can plan a "build" for: real products AND sub-assemblies that have their own
   recipe (like LH/RH Wheelbase Assembly) — planning demand for a sub-assembly directly is useful
   when you build up spares/stock of it ahead of, or independent of, a specific bench build.
   Raw parts with no recipe of their own (Wheel, Axle, Diffusers, etc.) aren't buildable, so they
   stay off this list — those are tracked as plain inventory, netted from whatever explodes onto them. */
function productSelect(selId){
  const opts=DB.items.filter(i=>i.isProduct || (i.lines && i.lines.length));
  return '<select>'+opts.map(p=>'<option value="'+p.id+'" '+(p.id===selId?'selected':'')+'>'+escAttr(p.name)+'</option>').join('')+'</select>';
}
function renderDemand(){
  const el=document.getElementById('panel-demand');
  document.getElementById('page-actions').innerHTML=
    '<button class="btn accent" id="add-demand">+ New planned build</button>';
  el.innerHTML=

let PLAN_SHOW_ALL=false; // transient UI state (not saved) — Planned Orders: show every item, not just ones with an order
const STALE_COUNT_DAYS=30;
/* On-hand isn't live inventory — it's whatever was last typed in. onHandAsOf records when that was. */
function onHandAge(it){
  if(!it || !it.onHandAsOf) return null;
  return Math.round((new Date(todayISO()+'T00:00:00')-new Date(it.onHandAsOf+'T00:00:00'))/86400000);
}
function onHandAsOfHtml(it){
  const age=onHandAge(it);
  if(age===null) return '<button type="button" class="asof stale set-count" data-id="'+it.id+'" title="No count date on file — click to record a count">as of ?</button>';
  const stale=age>STALE_COUNT_DAYS;
  return '<button type="button" class="asof'+(stale?' stale':'')+' set-count" data-id="'+it.id+'" title="Counted '+fmtDate(it.onHandAsOf)+' ('+age+' day'+(age===1?'':'s')+' ago) — click to update">as of '+fmtShortDate(it.onHandAsOf)+'</button>';
}
function openCountModal(it, onDone){
  openModal('Update on-hand count — '+it.name,
    '<div class="po-meta">'+
      '<div><label>On hand ('+escAttr(it.uom||'ea')+')</label><br><input type="number" id="cnt-qty" value="'+(Number(it.onHand)||0)+'" style="width:100%;box-sizing:border-box"></div>'+
      '<div><label>Counted on</label><br><input type="date" id="cnt-date" value="'+todayISO()+'" style="width:100%;box-sizing:border-box"></div>'+
    '</div>'+
    '<p class="note" style="margin-top:10px">'+(it.onHandAsOf?'Last count: '+fmtQty(it.onHand)+' on '+fmtDate(it.onHandAsOf)+'.':'No count date recorded yet.')+'</p>'+
    '<div class="toolbar" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="cnt-cancel">Cancel</button><button class="btn accent" id="cnt-save">Save count</button></div>');
  const q=document.getElementById('cnt-qty'); q.focus(); q.select();
  const commit=()=>{
    it.onHand=Number(q.value)||0;
    it.onHandAsOf=document.getElementById('cnt-date').value||todayISO();
    save(); closeModal(); renderCounts(); if(onDone) onDone();
  };
  document.getElementById('cnt-save').addEventListener('click',commit);
  document.getElementById('cnt-cancel').addEventListener('click',closeModal);
  q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); commit(); } });
}

/* Picks the supplier to group a planned-order line under: the link with the lowest known
   cost, falling back to the first link on file, or null if the item has no supplier link yet. */
function primarySupplierForItem(item){
  if(!item || !item.links || !item.links.length) return null;
  const withCost=item.links.filter(l=>Number(l.cost)>0).slice().sort((a,b)=>Number(a.cost)-Number(b.cost));
  const link=withCost[0]||item.links[0];
  return link ? supplierById(link.supplierId) : null;
}
/* A clean, supplier-grouped purchase-request PDF meant to be sent out (to a supplier, or to
   finance to get a PO approved) — not the dense internal MRP table above. Only includes rows
   that actually have something to order, grouped by supplier with an estimated cost per line,
   a subtotal per supplier, and a blank approval/PO# line at the end. */
function exportPlanRequestPDF(res){
  if(!pdfAvailable()){ alertModal("PDF library didn't load — try Print instead."); return; }
  const actionable=res.filter(r=>Number(r.suggestedQty)>0);
  if(!actionable.length){ alertModal('Nothing to order right now — every part is covered by stock or has no demand.'); return; }
  const rank={late:0,soon:1,ok:2};
  actionable.sort((a,b)=>(rank[a.status]??3)-(rank[b.status]??3));

  const groups={}; const groupKeys=[];
  actionable.forEach(r=>{
    const supplier=primarySupplierForItem(r.item);
    const key=supplier?supplier.id:'__none__';
    if(!groups[key]){ groups[key]={supplier, rows:[]}; groupKeys.push(key); }
    groups[key].rows.push(r);
  });
  groupKeys.sort((a,b)=>{
    if(a==='__none__') return 1; if(b==='__none__') return -1;
    return (groups[a].supplier.name||'').localeCompare(groups[b].supplier.name||'');
  });

  const jsPDFCtor=window.jspdf.jsPDF;
  const doc=new jsPDFCtor({orientation:'portrait'});
  const pageH=doc.internal.pageSize.getHeight();
  const margin=14;
  let y=18;
  doc.setFontSize(16); doc.text('Dragon Seats — Purchase Request', margin, y);
  y+=7;
  doc.setFontSize(9); doc.setTextColor(110);
  doc.text('Prepared by John — Dragon Seats · '+new Date().toLocaleString(), margin, y);
  doc.setTextColor(0);

  let grandTotal=0;
  groupKeys.forEach(key=>{
    const g=groups[key];
    const supplierLabel=g.supplier ? g.supplier.name : 'No supplier on file — add one on the Links tab';
    const contactBits=[];
    if(g.supplier && g.supplier.contact) contactBits.push(g.supplier.contact);
    if(g.supplier && g.supplier.phone) contactBits.push(g.supplier.phone);
    if(g.supplier && g.supplier.email) contactBits.push(g.supplier.email);

    if(y>pageH-45){ doc.addPage(); y=18; }
    y+=10;
    doc.setFontSize(12); doc.setFont(undefined,'bold');
    doc.text(supplierLabel, margin, y);
    doc.setFont(undefined,'normal');
    if(contactBits.length){
      doc.setFontSize(9); doc.setTextColor(110);
      doc.text(contactBits.join('   ·   '), margin, y+5);
      doc.setTextColor(0);
    }
    y+=contactBits.length?9:4;

    let subtotal=0;
    const body=g.rows.map(r=>{
      const costInfo=resolvePartCost(r.item);
      const qty=Number(r.suggestedQty)||0;
      const lineTotal=costInfo.cost*qty;
      subtotal+=lineTotal;
      const urgency = r.status==='late'?'Past due':r.status==='soon'?'Order soon':'Order';
      return [r.item.name, urgency, fmtQty(qty), costInfo.cost?('$'+costInfo.cost.toFixed(2)):'—', costInfo.cost?('$'+lineTotal.toFixed(2)):'—', fmtDate(r.earliestRelease)];
    });
    grandTotal+=subtotal;

    doc.autoTable({
      head:[['Item','Urgency','Qty to Order','Est. Unit Cost','Est. Total','Order By']],
      body,
      startY:y,
      margin:{left:margin, right:margin},
      styles:{fontSize:9},
      headStyles:{fillColor:[170,2,1]},
      foot:[['','','','','Subtotal: $'+subtotal.toFixed(2),'']],
      footStyles:{fillColor:[247,246,244], textColor:[23,24,26], fontStyle:'bold'}
    });
    y=doc.lastAutoTable.finalY+4;
  });

  if(y>pageH-40){ doc.addPage(); y=18; }
  y+=10;
  doc.setFontSize(12); doc.setFont(undefined,'bold');
  doc.text('Total estimated: $'+grandTotal.toFixed(2), margin, y);
  doc.setFont(undefined,'normal');
  y+=16;
  doc.setFontSize(9); doc.setTextColor(110);
  doc.text('Estimated costs are based on the best price data on file (recent PO/receipt, standard cost, or a supplier link) — confirm actual pricing when the PO is placed.', margin, y, {maxWidth:180});
  doc.setTextColor(0);
  y+=14;
  doc.text('Approved by (Finance): _______________________     Date: ____________', margin, y);
  y+=10;
  doc.text('PO #: ____________________', margin, y);

  doc.save('dragon-seats-purchase-request.pdf');
}
function exportPlanCSV(res){
  const rows=[['Part','Status','Total Needed','On Hand','On Hand As Of','Safety Stock','Order Qty','Order By','Needed By','Driven By']];
  res.forEach(r=>rows.push([r.item.name, r.status, r.totalGross||0, r.item.onHand, r.item.onHandAsOf||'not dated', r.item.safetyStock, r.suggestedQty||0, r.earliestRelease||'', (r.plannedOrders[0]||{}).dueDate||'', r.plannedOrders.length?r.plannedOrders.map(o=>o.source).join(' | '):(r.needSources||[]).join(' | ')]));
  const csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='dragon-seats-planned-orders.csv'; a.click();
}

/* Compact "Item x Qty, Item x Qty" summary for document overview tables, so you can see
   what's on a PO/Quote/Receipt/Load-out without opening it. Caps how many show inline;
   the full list is always available via the cell's title tooltip. */
function lineItemsSummary(lines, maxShow){
  maxShow = maxShow || 2;
  const arr = (lines||[]).filter(l=>l.itemId);
  if(!arr.length) return '<span class="note">—</span>';
  const parts = arr.map(l=>{
    const it = itemById(l.itemId);
    return escAttr(it?it.name:'(deleted item)')+' <span class="mono" style="color:var(--steel)">\u00d7'+(l.qty||0)+'</span>';
  });
  if(parts.length<=maxShow) return parts.join(', ');
  return parts.slice(0,maxShow).join(', ')+' <span class="note">+'+(parts.length-maxShow)+' more</span>';
}
function lineItemsPlain(lines){
  const arr = (lines||[]).filter(l=>l.itemId);
  if(!arr.length) return '';
  return arr.map(l=>{ const it=itemById(l.itemId); return (it?it.name:'(deleted item)')+' x'+(l.qty||0); }).join(', ');

      confirmModal('Add any remaining line-item quantities to on-hand stock and mark this PO '+closedStatusName()+'? Lines already checked in individually won\'t be double-counted.', ()=>{
        (po.lines||[]).forEach(l=>{
          if(l.received) return;
          const it=itemById(l.itemId); if(it){ it.onHand=(Number(it.onHand)||0)+Number(l.qty||0); recordPurchase(it, l.qty, todayISO()); }
          l.received=true; l.receivedAt=todayISO();

      const pf=tr.querySelector('.f-price'); if(pf) pf.addEventListener('input',e=>{ po.lines[i].unitPrice=round2(e.target.value); po.lines[i].priceAuto=false; save(); refreshDocTotals(card,po); });
      const df=tr.querySelector('.po-del-line'); if(df) df.addEventListener('click',()=>{ po.lines.splice(i,1); save(); renderPO(); });
      const addInv=tr.querySelector('.line-add-inventory');
      if(addInv) addInv.addEventListener('click',()=>{
        const l=po.lines[i]; const it=itemById(l.itemId);
        if(it){ it.onHand=(Number(it.onHand)||0)+Number(l.qty||0); recordPurchase(it, l.qty, todayISO()); }
        l.received=true; l.receivedAt=todayISO();
        save(); renderPO(); renderCounts(); runMRP();
      });
      const undoRecv=tr.querySelector('.line-undo-receive');
